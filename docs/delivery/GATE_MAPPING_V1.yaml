    use_when: PACKAGE_EXCEEDS_SCOPE_OR_HAS_SEPARABLE_FAILURES
    output: NEW_SMALLER_MANIFESTS_WITH_EXACT_PARENT
  BLOCKED_TO_RECONTRACT:
    use_when: CONTRACT_IS_INTERNALLY_UNSATISFIABLE_OR_GOVERNANCE_CONFLICT_EXISTS
    output: REVISED_OWNER_OR_PL_APPROVED_CONTRACT
  BLOCKED_TO_EXTERNAL_OWNER_GATE:
    use_when: NEW_PRODUCT_STRUCTURE_PERMISSION_PROVIDER_COST_OR_PRODUCTION_AUTHORITY_IS_REQUIRED
    output: ONE_PRECISE_DECISION_AND_NON_DEPENDENT_WORK_CONTINUES_IF_AVAILABLE
  BLOCKED_TO_ABANDON_AS_SUPERSEDED:
    use_when: CANDIDATE_IS_NOT_REUSABLE_OR_HAS_BEEN_REPLACED
    output: ARCHIVE_REF_AND_NON_LOSS_LEDGER
