states:
  CONTRACT_READY:
    owner: PACKAGE_MANIFEST
    requires:
      - manifest_exists_before_writer
      - manifest_validates_against_PACKAGE_MANIFEST_SCHEMA_V2
      - exact_parent_and_source_locks_match
      - allowlist_and_forbidden_paths_are_explicit
    next:
      - PREFLIGHT_PASS
  PREFLIGHT_PASS:
    owner: ACTIVE_MISSION
    requires:
      - correct_root_branch_parent_and_clean_tree
      - no_project_writer_or_test_process
      - available_memory_and_shell_git_probes_within_calibrated_bounds
      - no_branch_collision
    next:
      - WRITING
      - BLOCKED
  WRITING:
    owner: ACTIVE_MISSION
    requires:
      - exactly_one_writer
      - changes_within_manifest_allowlist
      - no_parallel_build_or_test_writer
    next:
      - LOCAL_VERIFIED
      - BLOCKED
  LOCAL_VERIFIED:
    owner: ACTIVE_MISSION
    requires:
      - manifest_specific_acceptance_pass
      - local_gate_set_pass
      - exact_allowlist_and_diff_check_pass
      - commit_and_clean_tree
    next:
      - CLAUDE_REVIEWED
      - BLOCKED
  CLAUDE_REVIEWED:
    owner: FINDINGS_LEDGER
    requires:
      - exactly_one_full_diff_review_on_exact_remote_sha
      - reviewer_differs_from_writer
      - all_p0_p1_p2_reported_together
    next:
      - CORRECTED_ONCE_OR_NOT_NEEDED
      - BLOCKED
  CORRECTED_ONCE_OR_NOT_NEEDED:
    owner: FINDINGS_LEDGER
    requires:
      - correction_rounds_between_zero_and_one
      - every_p2_has_explicit_disposition
    next:
      - DELTA_REVIEWED
      - BLOCKED
  DELTA_REVIEWED:
    owner: FINDINGS_LEDGER
    requires:
      - targeted_review_only_if_correction_occurred
      - named_findings_and_whole_diff_guards_pass
      - open_p0_p1_p2_equal_zero
    next:
      - MERGE_READY_PENDING_CI
      - BLOCKED
  MERGE_READY_PENDING_CI:
    owner: EXACT_SHA_CLOSURE_RECEIPT
    requires:
      - reviewed_candidate_remote_sha_exact
      - clean_tree_and_process_cleanup
      - no_main_or_delivery_claim
    next:
      - CI_VERIFIED
      - BLOCKED
  CI_VERIFIED:
    owner: EXACT_SHA_CLOSURE_RECEIPT
    requires:
      - pull_request_or_equivalent_main_base_checks_on_exact_candidate_sha
      - quality_pass
      - agentur_gate_pass
      - Fresh_Supabase_replay_pass
      - ratchet_pass
      - actual_branch_protection_receipt_if_required_status_is_claimed
    next:
      - OWNER_PREVIEWED
      - BLOCKED
  OWNER_PREVIEWED:
    owner: EXACT_SHA_CLOSURE_RECEIPT
    requires:
      - applicable_preview_or_owner_acceptance_evidence
      - no_preview_equals_delivery_claim
    next:
      - RATIFIED
      - BLOCKED
  RATIFIED:
    owner: EXACT_SHA_CLOSURE_RECEIPT
    requires:
      - all_applicable_specialist_gates_pass
      - no_open_p0_p1
      - explicit_production_effect_authority_before_main_merge
    next:
      - MAIN_DELIVERED
      - BLOCKED
  MAIN_DELIVERED:
    owner: docs/project/CURRENT_STATE.md
    requires:
      - merge_performed_by_authorized_actor
      - exact_merge_sha_contains_candidate
      - post_merge_checks_pass
      - active_mission_and_current_state_synchronized
    next:
      - RELEASE_EVIDENCE
  RELEASE_EVIDENCE:
    owner: docs/project/CURRENT_STATE.md
    requires:
      - release_or_non_release_effect_recorded_truthfully
      - rollback_and_operational_receipts_if_applicable
blocked_transitions:
  BLOCKED_TO_SPLIT:
    use_when: PACKAGE_EXCEEDS_SCOPE_OR_HAS_SEPARABLE_FAILURES
    output: NEW_SMALLER_MANIFESTS_WITH_EXACT_PARENT
  BLOCKED_TO_RECONTRACT:
    use_when: CONTRACT_IS_INTERNALLY_UNSATISFIABLE_OR_GOVERNANCE_CONFLICT_EXISTS
    output: REVISED_OWNER_OR_PL_APPROVED_CONTRACT
  BLOCKED_TO_EXTERNAL_OWNER_GATE:
    use_when: NEW_PRODUCT_STRUCTURE_PERMISSION_PROVIDER_COST_OR_PRODUCTION_AUTHORITY_IS_REQUIRED
    output: ONE_PRECISE_DECISION_AND_NON_DEPENDENT_WORK_CONTINUES_IF_AVAILABLE
  BLOCKED_TO_ABANDON_AS_SUPERSEDED:
    use_when: CANDIDATE_IS_NOT_REUSABLE_OR_HAS_BEEN_REPLACED
    output: ARCHIVE_REF_AND_NON_LOSS_LEDGER
