invariants:
  data_truth: >-
    orders.due_date ist der einzige bestaetigte Kalendertag; completed_date und
    genau ein valides ORDER_PICKED_UP_V1 oder V2 liefern offsetgebundene
    Instants. promised_due_date und rohe V1-Finanzfelder sind ausgeschlossen.
  tenant_and_rls: >-
    Die reine Domaenenfunktion fuehrt keine DB- oder RLS-Operation aus und
    verwirft fremde Tenant- oder Auftragszuordnungen fail-closed.
  roles_and_commands: NO_ROLE_COMMAND_AUTH_SESSION_SERVER_PORT_UI_OR_VISIBLE_CAPABILITY_CHANGE
  receipt_and_readback: >-
    Ein valides Abholereignis liefert events.created_at samt Event-ID,
    Eventtyp, Schemaversion und Aggregatversion als Provenienz.
  reload_and_race: >-
    Die Ableitung ist rein und deterministisch; mehr als ein valides V1/V2-
    Ereignis bleibt unabhaengig von Reihenfolge oder Wiederholung mehrdeutig.
  error_behavior: >-
    Fehlende, ungueltige oder mehrere valide Abholereignisse sowie die nicht
    ratifizierte Stornoklassifikation liefern jeweils einen benannten
    Missing-Grund; fremde Zuordnungen und unbekannte Eventtypen werfen.
  rollback: >-
    Nur die zwei neuen Domaenen-/Unitdateien und die Paketsteuerung werden
    zurueckgenommen; keine persistierte oder externe Wahrheit ist betroffen.
