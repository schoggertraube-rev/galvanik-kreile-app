invariants:
  data_truth: >-
    Der Port mappt due_date ausschliesslich als YYYY-MM-DD-Kalendertag und
    completed_date sowie events.created_at ausschliesslich als UTC-Instant mit
    explizitem Z-Suffix. promised_due_date wird nie als zweiter Termin gelesen.
  tenant_and_rls: >-
    Der Tenant stammt ausschliesslich aus der serverseitig aufgeloesten
    Autorisierung, wird transaktionslokal als app.tenant_id gesetzt und
    zusaetzlich in beiden View-Reads geprueft. Fremdtenantzeilen bleiben leer.
  roles_and_commands: NO_ROLE_COMMAND_SESSION_UI_OR_VISIBLE_CAPABILITY_CHANGE_READ_REQUIRES_PERM_VIEW_LEITSTAND
  receipt_and_readback: >-
    Jede gelesene Auftragszeile wird zusammen mit allen zugehoerigen V1/V2-
    Ereigniszeilen an deriveOrderTimelinessFact uebergeben; Provenienz bleibt
    erhalten und kein Roh-Payload- oder Finanzfeld wird gelesen.
  reload_and_race: >-
    Ein Read findet in genau einer tenantgebundenen Transaktion statt. Mehrere
    valide Abholereignisse werden nicht dedupliziert, sondern von der Domaene
    fail-closed als pickup_event_ambiguous klassifiziert.
  error_behavior: >-
    Ungueltiger Range, fehlende Sitzung oder Berechtigung, DB-Fehler,
    Fremdtenant, falscher JSON-Typ und ungueltige Zeilen erzeugen benannte
    fail-closed Ergebnisse; es gibt keinen stillen Fallback.
  rollback: >-
    Das Paket enthaelt keine Migration oder Datenmutation. Vor einem Merge kann
    der Kandidat durch Verwerfen des Paketbranches vollstaendig entfernt werden.
