acceptance:
  - id: KR03B2-A1
    statement: Der Parent ist exakt der remote-gruene und Opus-gepruefte KR-03B1-Kandidat b1ca8392; origin/main bleibt separat fa1a989f.
    evidence: REMOTE_PARENT_MAIN_AND_EXTERNAL_RECEIPT_READBACK
  - id: KR03B2-A2
    statement: Genau ein server-only Port getOrderTimelinessFacts(range) loest die Session-Autorisierung auf, verlangt perm_view_leitstand und nimmt keinen Tenantparameter vom Client an.
    evidence: FOCUSED_AUTHORIZATION_MATRIX_AND_SERVER_PUBLIC_MANIFEST_CONTRACT
  - id: KR03B2-A3
    statement: Der inklusive Range ist ein striktes YYYY-MM-DD-Paar mit from kleiner-gleich to und filtert ausschliesslich den bestaetigten orders.due_date-Kalendertag.
    evidence: FRESH_DB_INCLUSIVE_BOUNDARY_AND_INVALID_RANGE_MATRIX
  - id: KR03B2-A4
    statement: due_date wird explizit als YYYY-MM-DD und completed_date sowie events.created_at werden explizit als UTC-Instants gemappt; implizite JavaScript-Lokalzeit ist ausgeschlossen.
    evidence: SQL_TEXT_PROJECTION_AND_FRESH_DB_DST_MAPPING_MATRIX
  - id: KR03B2-A5
    statement: V1 und V2 ergeben dieselbe Faktform; zwei valide Ereignisse desselben Auftrags bleiben sichtbar und werden ambiguous, ein falscher JSON-Typ wird invalid statt DB- oder Portfehler.
    evidence: FRESH_DB_V1_V2_MULTIPLE_EVENT_AND_FOCUSED_UNIT_WRONG_JSON_TYPE_BEHAVIOR
  - id: KR03B2-A6
    statement: Der Fresh-DB-Test belegt fehlende und fremde Tenantdaten fail-closed sowie den ausschliesslichen Zugriff ueber die zwei manifestdeklarierten security-invoker Views.
    evidence: FRESH_DB_GUC_TENANT_RLS_AND_QUERY_CONTRACT
  - id: KR03B2-A7
    statement: Das Orders-Manifest deklariert Fassade, Read-Views und konsumierte V1/V2-Events; es entsteht keine Migration, Tabelle, View, Funktion, Policy, UI oder neue sichtbare Capability.
    evidence: MODULE_GATE_EXACT_DIFF_AND_ZERO_MIGRATIONS
  - id: KR03B2-A8
    statement: Der fokussierte Server-Port-Test laeuft lokal auf einem frischen Reset und im blockierenden Fresh-Supabase-CI-Job.
    evidence: LOCAL_FRESH_REPLAY_FOCUSED_VITEST_AND_MAIN_BASE_CI
  - id: KR03B2-A9
    statement: Der Delivery-Selbsttest loest Queue-gegen-Mapping-Reihenfolgendrift direkt als Negativfall aus.
    evidence: DELIVERY_NEGATIVE_SELFTEST_AND_FOCUSED_UNIT_TEST
  - id: KR03B2-A10
    statement: KR-03B2 bleibt QUEUED_CANDIDATE und erhebt keinen Main-, Merge-, Remote-DB- oder Production-Claim.
    evidence: MISSION_EXTERNAL_RECEIPT_REMOTE_MAIN_AND_DRAFT_PR
