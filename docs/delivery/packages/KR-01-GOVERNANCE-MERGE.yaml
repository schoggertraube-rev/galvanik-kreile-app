acceptance:
  - id: KR01-A1
    statement: Das Betriebsreceipt belegt die effektive Main-Schutzvereinigung aus Classic Protection und aktivem Ruleset mit quality, agentur-gate und Fresh Supabase replay sowie null Bypass-Akteuren.
    evidence: LIVE_GITHUB_API_READBACK_AND_SCHEMA_VALIDATED_RECEIPT
  - id: KR01-A2
    statement: Ratchet ist ehrlich nicht Required, muss aber am exakten Pull-Request-Kandidaten gruen laufen.
    evidence: PULL_REQUEST_TARGET_RATCHET_EXACT_SHA_EXTERNAL_CLOSURE_RECEIPT
  - id: KR01-A3
    statement: Legacy-Manifest-Ausnahmen sind an die eingefrorenen KR-00E- und KR-00G-Dateien gebunden und koennen nicht durch eine fremde Datei mit wiederverwendeter package_id erreicht werden.
    evidence: DELIVERY_CONTRACT_GATE_AND_NEGATIVE_TEST
  - id: KR01-A4
    statement: Jeder strukturierte acceptance- oder invariant-Evidenzzeiger loest im eigenen Manifest real auf; unbekannte Ziele werden abgewiesen.
    evidence: DELIVERY_CONTRACT_GATE_AND_NEGATIVE_TEST
  - id: KR01-A5
    statement: Schema, Queue, Gate-Mapping und Manifest werden im normalen lokalen, Branch- und Main-Base-Gatepfad validiert und ihre Rolling-Policy driftet nicht auseinander.
    evidence: NPM_GATE_PLUS_THREE_WORKFLOW_BINDINGS_AND_NEGATIVE_TESTS
  - id: KR01-A6
    statement: Naht 7 prueft auch zuvor uebersprungene Unterbaeume, verbietet breitere unautorisierte Attributregeln und testet Duplikat, Zaehldrift und unerwartete Projektziele.
    evidence: TARGETED_MODULE_GATE_TESTS_AND_REAL_REPOSITORY_PASS
  - id: KR01-A7
    statement: Die rollende Queue setzt KR-04 vor KR-02 und materialisiert keinen weiteren Zukunftsvertrag.
    evidence: QUEUE_SCHEMA_AND_INSTANCE_READBACK
  - id: KR01-A8
    statement: Das Paket aendert keine Produktfunktion, Datenwahrheit, UI, Rolle, Session, Provider- oder Production-Konfiguration und erhebt keinen Main-Lieferclaim.
    evidence: EXACT_PARENT_DIFF_ALLOWLIST_AND_NO_PRODUCT_PATHS
  - id: KR01-A9
    statement: Fuenf Messungen belegen Rechnergrenzen anhand RAM, Shell- und Git-Laufzeit; Start und Leben kuenftiger Prozesse werden ueber PID, Outputzeit und Exit statt CPU behauptet.
    evidence: SCHEMA_VALIDATED_OPERATING_RECEIPT_AND_PROCESS_CONTRACT
