acceptance:
  - id: KR22R-A1
    statement: Der Queue-Parent ist exakt der gelieferte KR-04R-Merge 16888ccc. Vor der finalen Vertragsausgabe wird jeder spaetere reine Vorautorisierungs-Handoff angehaengt und Base, Tree sowie alle Repo-Source-Locks werden auf dessen exakten Merge-SHA neu gebunden; erst dieser rebaste Stand ist unveraenderlich.
    evidence: REMOTE_PARENT_MAIN_TRUSTED_GRAPH_AND_EXTERNAL_RECEIPTS
  - id: KR22R-A2
    statement: Ein Fine-Pointer-Desktop ab 1024 CSS-Pixeln bleibt auch bei Windows-Skalierung im Desktop-Frame; ein Touch-Tablet derselben Breitenklasse bleibt Tablet und Mobile bleibt Mobile.
    evidence: PURE_CLASSIFIER_UNIT_MATRIX_AND_REAL_BROWSER_DEVICE_MATRIX
  - id: KR22R-A3
    statement: Kunden- und Auftragsdetails nutzen auf dem gemeldeten skalierten Desktop die kompakte Desktopbreite und -hoehe, ohne die Touch-Tablet- oder Mobile-Darstellung umzudefinieren.
    evidence: REAL_BROWSER_1182X720_DPR_1_25_FINE_POINTER_SCREENSHOT_AND_DIMENSION_READBACK
  - id: KR22R-A4
    statement: Kundenliste und Kundendetail werten checkAppAuthorization genau einmal aus und verwenden nur den daraus serverseitig ermittelten Tenant; Rollen-, Session- und RLS-Vertraege bleiben unveraendert.
    evidence: EXACT_DIFF_TYPESCRIPT_UNIT_TESTS_AND_INDEPENDENT_SECURITY_REVIEW
  - id: KR22R-A5
    statement: Vercel Functions sind ausschliesslich auf fra1 festgelegt, passend zur bestehenden Datenbankregion eu-central-1; kein Provider, Secret oder Remote-Datensatz wird angelegt oder mutiert.
    evidence: EXACT_VERCEL_CONFIG_DIFF_BUILD_AND_PREVIEW_STATUS
  - id: KR22R-A6
    statement: TypeScript, Lint, vollstaendige Unit-Suite, Produktionsbuild und die Browsermatrix fuer 1914-Desktop, 1182-Windows-Desktop, 1220-Touch-Tablet und 390-Mobile sind am Kandidaten gruen.
    evidence: LOCAL_GATE_RECEIPT_EXACT_SHA_AND_REMOTE_CI
  - id: KR22R-A7
    statement: Das Paket aendert genau acht Produkt-, Test- oder Runtimepfade und eine Architekturzeile, keine Migration, Tabelle, Policy, Rolle, Session, Abhaengigkeit, Remote-Datenbank oder Echtdaten.
    evidence: EXACT_PARENT_ALLOWLIST_DIFF_AND_NO_FAKE_GATE
  - id: KR22R-A8
    statement: Mission und Queue zeigen danach auf KR-02R, KR-03A und KR-03B1; kein weiteres Zukunftsmanifest ist materialisiert.
    evidence: QUEUE_SCHEMA_MAPPING_AND_DELIVERY_GATE
  - id: KR22R-A9
    statement: Der Kandidat ist keine Main-Lieferung und kein Production-Claim; ein normaler Main-Merge bleibt bis zu einer getrennten expliziten Owner-Autorisierung gesperrt.
    evidence: MISSION_REMOTE_MAIN_DRAFT_PR_AND_EXPLICIT_MERGE_GATE
  - id: KR22R-A10
    statement: OWNER_PREVIEWED ist im Manifest ausschliesslich die geforderte Abschlussstufe, kein aktueller Erreichungsclaim; die reale Owner-Sichtung bleibt bis zum exakten rebasten Preview und einer separaten Receipt ausstehend.
    evidence: GATE_MAPPING_TARGET_SEMANTICS_MISSION_AND_EXACT_SHA_RECEIPT
  - id: KR22R-A11
    statement: Die neue Checker-Vorautorisierung ersetzt den alten KR-02R-Hash 265e8a28 vollstaendig durch den nach der Korrektur reviewten Hash; gleichzeitige Alt- und Neuautorisierung ist verboten.
    evidence: MISSION_EXACT_CHECKER_HASH_AND_WORKFLOW_REPLACE_NOT_APPEND_RULE
  - id: KR22R-A12
    statement: Die Vertragsausgabe ist eine einmalige Recovery nach dem direkten Owner-Bauauftrag; sie behauptet nicht, vor dem Writer existiert zu haben. Nach dem Rebase folgt ein frisches Exact-SHA-Review, und jeder neue P0, P1 oder P2 stoppt ohne weitere automatische Produktkorrektur.
    evidence: OWNER_CURRENT_TASK_GATE_MAPPING_AND_MISSION_RECOVERY_EXCEPTION
  - id: KR22R-A13
    statement: Login- und belastbare p95-Latenz bleiben ausdruecklich offen und werden in KR-22P beobachtbar gemessen; die Einzelmessungen dieses Pakets sind nur Diagnosewerte.
    evidence: FINDING_KR22R_FOLLOWUP_LATENCY_P95_AND_MISSION_DEFERRED_ROUTING
