invariants:
  data_truth: >-
    orders.due_date bleibt die einzige bestaetigte Terminwahrheit.
    promised_due_date verlaesst den Vertrag nicht als Datumswert, sondern nur
    als read-only Diagnoseklasse nach dem Europe-Berlin-Kalendertag.
  tenant_and_rls: >-
    Beide security-invoker Views liefern ohne nichtleere app.tenant_id-GUC
    null Zeilen, filtern exakt auf denselben Tenant und aendern keine
    bestehende RLS- oder Policy-Regel.
  roles_and_commands: NO_ROLE_COMMAND_AUTH_SESSION_SERVER_PORT_UI_OR_VISIBLE_CAPABILITY_CHANGE
  receipt_and_readback: >-
    Die Ereignis-View liefert event_id, Typ, Schema- und Aggregatversion sowie
    created_at und die fuer die V1/V2-Validierung benoetigten nicht-rohen
    Skalare; rohe Payload- und Finanzfelder bleiben ausgeschlossen.
  reload_and_race: >-
    Die Ereignisprojektion liest jede passende Basistabellenzeile direkt und
    genau einmal, ohne Join, Aggregation, MIN oder DISTINCT ON; Mehrfachereignisse
    bleiben fuer die fail-closed Domaene sichtbar.
  error_behavior: >-
    Fehlende oder leere Tenant-GUC liefert ein leeres Resultset. Ein falscher
    JSON-Typ wird als NULL projiziert und kann die View nicht sprengen; die
    Domaene klassifiziert ihn spaeter als ungueltig.
  rollback: >-
    Die eine additive Migration kann vor Remote-Ausfuehrung durch Entfernen
    der lokalen Datei verworfen werden; es gibt keinen Remote- oder
    Production-Effekt und keine Datenumschreibung.
