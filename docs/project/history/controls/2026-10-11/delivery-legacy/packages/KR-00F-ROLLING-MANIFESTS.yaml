    statement: Die aktive Mission zeigt exklusiv auf KR-00F und bindet den remote identischen, durch Claude Opus bestandenen KR-00G-Kandidaten als exakten Parent.
    evidence: MISSION_PARENT_BRANCH_PACKAGE_AND_EXTERNAL_RECEIPT_READBACK
