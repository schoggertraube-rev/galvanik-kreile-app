    evidence: AJV_RECURSIVE_FORBIDDEN_KEY_NEGATIVE_CASES
  - id: KR00F-A3
    statement: Functional und Data sind fest an LOCAL_VERIFIED, UI Reference und Owner UX fest an OWNER_PREVIEWED gebunden und jede Nichtanwendbarkeit traegt einen strukturierten Evidenzzeiger.
    evidence: SCHEMA_AND_GATE_MAPPING_STAGE_READBACK
  - id: KR00F-A4
    statement: Die rollende Queue enthaelt nur die geordnete Anfangsreichweite Governance, B1 und B2a als nicht ausfuehrbare Zeiger und exakt null vorproduzierte Zukunftsmanifeste.
    evidence: AJV_QUEUE_SCHEMA_VALIDATION_AND_ZERO_FUTURE_CONTRACTS
  - id: KR00F-A5
    statement: Die KR-00G-Importausnahme ist fail-closed an den Source-Lock gebunden; jede neue oder fehlende Datei unter docs/module sowie unvollstaendige Git-Attribute machen das Module-Gate rot.
    evidence: TARGETED_MODULE_GATE_TESTS_AND_REAL_REPOSITORY_PASS
  - id: KR00F-A6
    statement: Das Paket aendert weder Produktfunktion noch Datenmodell, sichtbare UI, Rollen, Provider oder Production und erhebt keinen Main-Lieferclaim.
    evidence: EXACT_PARENT_DIFF_ALLOWLIST_AND_NO_PRODUCT_PATHS
