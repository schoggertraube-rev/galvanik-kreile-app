<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreile · Kundenkarte — Machart-Entwurf V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#12161F; --navy-800:#1A1F2E; --navy-700:#262C3C; --navy-600:#353C4E;
    --navy-500:#4B5366; --navy-400:#6B7286; --navy-300:#8E94A6;
    --cream-50:#FBF8F2; --cream-100:#F6F0E6; --cream-200:#F1E9DC; --cream-300:#E7DCC9;
    --cream-400:#D9CBB3; --cream-500:#C7B79A;
    --purple:#7A3FB0; --magenta:#C2185B; --orange:#F2643C; --amber:#F6A93B;
    --grad:linear-gradient(115deg,#7A3FB0 0%,#C2185B 40%,#F2643C 76%,#F6A93B 100%);
    --succ:#4F9A5E; --succ-bg:#E3EDDD; --succ-fg:#336B40; --succ-bd:#B7CFAE;
    --warn:#D9722B; --warn-bg:#FAE7D6; --warn-fg:#9C5214; --warn-bd:#ECC39C;
    --info:#4B5366; --info-bg:#E6E8EE; --info-fg:#3A4763;
    --ral:#AF2B1E; --ral-bg:#F7E1DC; --ral-fg:#7E1D14; --ral-bd:#E7B4AA;
    --part-bg:#EBE4F3; --part-fg:#5A3E86;
    --serif:"Fraunces",Georgia,serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --sh-sm:0 1px 3px rgba(26,31,46,.08); --sh-md:0 4px 12px rgba(26,31,46,.08); --sh-lg:0 12px 28px rgba(26,31,46,.12);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream-200);font-family:var(--sans);color:var(--navy-900);padding:30px 20px 70px;-webkit-font-smoothing:antialiased;}
  svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none;}

  .page-head{max-width:1600px;margin:0 auto 22px;text-align:center;}
  .ph-brand{display:inline-flex;align-items:center;gap:11px;margin-bottom:10px;}
  .ph-logo{width:40px;height:40px;border-radius:10px;background:var(--navy-800);color:var(--cream-50);font-family:var(--serif);font-size:16px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;}
  .ph-name{font-family:var(--serif);font-size:16px;letter-spacing:2px;color:var(--navy-800);}
  .ph-title{font-family:var(--serif);font-size:23px;color:var(--navy-900);font-weight:500;}
  .ph-sub{font-size:13px;color:var(--navy-400);margin-top:6px;line-height:1.5;}

  .stage{display:flex;gap:30px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1600px;margin:0 auto;}
  .frame-col{display:flex;flex-direction:column;align-items:center;}
  .frame-label{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--navy-400);margin-bottom:10px;}
  .frame-label b{color:var(--navy-700);font-weight:600;}
  .frame{container-type:inline-size;background:var(--cream-50);overflow:hidden;}
  .frame.desktop{width:1080px;max-width:100%;border:1px solid var(--cream-300);border-radius:20px;box-shadow:var(--sh-lg);}
  .frame.tablet{width:428px;max-width:100%;height:868px;border:9px solid var(--navy-800);border-radius:34px;box-shadow:var(--sh-lg);}
  .frame.tablet .card{height:100%;overflow-y:auto;}

  .card{display:flex;flex-direction:column;background:var(--cream-50);animation:rise .5s var(--ease) both;}
  .stripe{height:3px;background:var(--grad);flex:none;}

  /* Kopf */
  .head{padding:20px 26px 16px;border-bottom:1px solid var(--cream-300);display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex:none;}
  .head-l{flex:1;min-width:0;}
  .ord-kicker{font-size:12px;color:var(--navy-400);letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ord-kicker .no{font-family:var(--serif);color:var(--navy-500);}
  .ord-title{font-family:var(--serif);font-size:31px;font-weight:500;color:var(--navy-900);line-height:1.05;margin-top:5px;letter-spacing:-.3px;}
  .ord-sub{font-size:13.5px;color:var(--navy-500);margin-top:5px;}
  .contact{font-size:13px;color:var(--navy-600);margin-top:9px;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;}
  .contact a{color:var(--magenta);text-decoration:none;} .contact .sep{color:var(--cream-400);}
  .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px;}
  .pref{font-size:12px;color:var(--navy-400);margin-top:9px;font-style:italic;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:500;line-height:1;}
  .pill-succ{background:var(--succ-bg);color:var(--succ-fg);border:1px solid var(--succ-bd);}
  .pill-soft{background:var(--cream-100);color:var(--navy-500);border:1px solid var(--cream-300);}
  .close{background:transparent;border:1px solid var(--cream-300);width:40px;height:40px;border-radius:999px;color:var(--navy-400);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex:none;}
  .close:hover{background:var(--cream-100);}
  .head-r{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:none;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:290px;}
  .tag{display:inline-flex;align-items:center;gap:5px;background:var(--cream-100);border:1px solid var(--cream-300);border-radius:999px;padding:5px 11px;font-size:11.5px;color:var(--navy-600);min-height:32px;}
  .tag svg.i{font-size:12px;color:var(--navy-400);} .tag.add{border-style:dashed;color:var(--navy-400);cursor:pointer;}

  /* Körper */
  .body{display:grid;grid-template-columns:1.62fr 1fr;}
  .main{padding:6px 24px 22px;border-right:1px solid var(--cream-300);min-width:0;}
  .rail{padding:6px 22px 22px;background:var(--cream-100);min-width:0;}
  .sec{padding:20px 0;border-top:1px solid var(--cream-300);}
  .sec:first-child{border-top:none;padding-top:16px;}
  .sec:last-child{padding-bottom:2px;}
  .sec-h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-700);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .sec-h .add{letter-spacing:0;text-transform:none;font-weight:500;color:var(--magenta);cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:4px;}

  /* Nächste Aktion */
  .next{position:relative;border-radius:16px;padding:16px 18px;overflow:hidden;background:linear-gradient(180deg,#FCEFF3 0%,#FBF8F2 74%);border:1px solid #EBC6D5;border-left:3px solid var(--magenta);}
  .next-k{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--magenta);font-weight:600;}
  .next-t{font-family:var(--serif);font-size:21px;color:var(--navy-900);margin-top:5px;line-height:1.2;}
  .next-s{font-size:13px;color:var(--navy-500);margin-top:5px;line-height:1.45;} .next-s .due-red{color:var(--ral-fg);font-weight:700;}
  .next-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px;}

  .btn{min-height:48px;border-radius:11px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--cream-300);background:var(--cream-50);color:var(--navy-800);display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 16px;transition:transform .12s var(--ease),background .15s;}
  .btn:hover{background:var(--cream-100);} .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy-800);color:var(--cream-50);border-color:var(--navy-800);} .btn-primary:hover{background:var(--navy-700);}
  .btn svg.i{font-size:16px;}

  /* Aktive Aufträge */
  .order{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--cream-50);border:1px solid var(--cream-300);border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer;margin-bottom:8px;transition:box-shadow .15s;}
  .order:hover{box-shadow:var(--sh-sm);}
  .odot{width:9px;height:9px;border-radius:50%;} .odot.warn{background:var(--ral);} .odot.ok{background:var(--succ);}
  .onum{font-family:var(--serif);font-size:14px;color:var(--navy-900);} .otitle{font-size:12.5px;color:var(--navy-600);margin-top:2px;}
  .oright{text-align:right;white-space:nowrap;} .ostage{font-size:11px;color:var(--navy-400);} .odue{font-size:11px;font-weight:600;margin-top:2px;} .odue.warn{color:var(--ral-fg);} .odue.ok{color:var(--succ-fg);}

  /* Fakten / Absprachen */
  .facts{display:flex;flex-direction:column;gap:8px;}
  .fact{background:var(--cream-50);border:1px solid var(--cream-300);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--navy-700);line-height:1.45;display:flex;gap:10px;align-items:flex-start;}
  .fact svg.i{font-size:15px;color:var(--navy-400);margin-top:2px;flex:none;}
  .fact .fk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy-300);font-weight:600;display:block;margin-bottom:2px;} .fact b{color:var(--navy-900);font-weight:600;}

  /* Notizen (hervorgehoben) */
  .notes{display:flex;flex-direction:column;gap:9px;}
  .note{background:var(--cream-100);border:1px solid var(--cream-300);border-left:4px solid var(--navy-700);border-radius:12px;padding:14px 16px;box-shadow:var(--sh-sm);}
  .note-scope{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:8px;}
  .scope-cust{background:var(--info-bg);color:var(--info-fg);} .scope-part{background:var(--part-bg);color:var(--part-fg);} .scope-phone{background:var(--warn-bg);color:var(--warn-fg);}
  .note-t{font-size:14px;color:var(--navy-900);line-height:1.5;} .note-m{font-size:11px;color:var(--navy-300);margin-top:8px;}

  /* Historie / Referenz */
  .ref{background:var(--cream-50);border:1px solid var(--cream-300);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
  .ref-top{font-family:var(--serif);font-size:13.5px;color:var(--navy-900);} .ref-s{font-size:11.5px;color:var(--navy-400);margin-top:4px;}
  .ref-a{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
  .btn-sm{min-height:40px;border:1px solid var(--cream-300);background:var(--cream-50);color:var(--navy-700);border-radius:9px;font-size:11.5px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--sans);} .btn-sm:hover{border-color:var(--magenta);color:var(--magenta);} .btn-sm svg.i{font-size:13px;}

  /* Profil */
  .profile{display:flex;flex-wrap:wrap;gap:7px;}
  .pchip{background:var(--cream-100);border:1px solid var(--cream-300);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--navy-700);} .profile-m{font-size:11px;color:var(--navy-300);margin-top:8px;}

  /* Empty / Reklamation */
  .empty{border:1px dashed var(--cream-400);border-radius:12px;padding:13px 15px;font-size:12.5px;color:var(--navy-500);display:flex;align-items:center;gap:9px;line-height:1.4;} .empty svg.i{font-size:16px;color:var(--succ);flex:none;}

  /* Fotos */
  .docs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .dthumb{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#B89F7A,#8E7355);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-size:17px;}
  .dfile{display:inline-flex;align-items:center;gap:7px;min-height:48px;padding:0 13px;border-radius:10px;background:var(--cream-50);border:1px solid var(--cream-300);font-size:12px;color:var(--navy-700);}
  .dadd{width:52px;height:52px;border-radius:10px;border:1.5px dashed var(--cream-400);display:flex;align-items:center;justify-content:center;color:var(--navy-400);cursor:pointer;font-size:17px;} .dadd:hover{border-color:var(--magenta);color:var(--magenta);}

  /* Steckplatz */
  .slot{border:1px dashed var(--cream-400);border-radius:14px;padding:15px 17px;background:repeating-linear-gradient(135deg,transparent,transparent 9px,rgba(139,115,85,.03) 9px,rgba(139,115,85,.03) 18px);}
  .slot-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;} .slot-h svg.i{font-size:17px;color:var(--navy-300);} .slot-h .t{font-family:var(--serif);font-size:15px;color:var(--navy-600);}
  .slot-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--cream-300);font-size:12.5px;} .slot-row:last-of-type{border-bottom:none;} .slot-row .k{color:var(--navy-500);}
  .slot-tag{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--info-fg);background:var(--info-bg);border-radius:999px;padding:3px 8px;font-weight:600;}
  .slot-foot{font-size:11.5px;color:var(--navy-400);margin-top:11px;line-height:1.5;font-style:italic;}

  /* Schnellaktionen (Desktop-Grid) */
  .qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .qa{min-height:66px;background:var(--cream-50);border:1px solid var(--cream-300);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--navy-800);font-family:var(--sans);transition:transform .12s var(--ease),background .15s;padding:8px;}
  .qa:hover{background:var(--cream-100);} .qa:active{transform:translateY(1px);}
  .qa svg.i{font-size:19px;color:var(--navy-600);} .qa .ql{font-size:11.5px;}
  .qa.primary{background:var(--navy-800);border-color:var(--navy-800);color:var(--cream-50);} .qa.primary svg.i{color:var(--cream-50);} .qa.primary:hover{background:var(--navy-700);}

  .tl{display:flex;flex-direction:column;}
  .tl-i{display:grid;grid-template-columns:28px 1fr;gap:11px;padding:9px 0;position:relative;}
  .tl-i:not(:last-child)::after{content:"";position:absolute;left:13px;top:32px;bottom:-3px;width:1px;background:var(--cream-300);}
  .tl-d{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;position:relative;flex:none;font-size:14px;}
  .tl-d.succ{background:var(--succ-bg);color:var(--succ-fg);} .tl-d.warn{background:var(--warn-bg);color:var(--warn-fg);} .tl-d.info{background:var(--cream-200);color:var(--navy-500);}
  .tl-time{font-size:10.5px;color:var(--navy-300);} .tl-t{font-size:12.5px;color:var(--navy-800);margin-top:1px;line-height:1.35;} .tl-s{font-size:11px;color:var(--navy-300);margin-top:1px;}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 26px;border-top:1px solid var(--cream-300);background:var(--cream-100);flex:none;}
  .foot-v{font-size:11px;color:var(--navy-300);letter-spacing:.3px;} .foot-a{display:flex;gap:8px;flex-wrap:wrap;}

  /* Mobile Dock */
  .dock{display:none;position:sticky;bottom:0;z-index:9;background:var(--cream-50);border-top:1px solid var(--cream-300);box-shadow:0 -8px 22px rgba(26,31,46,.12);padding:8px 10px 12px;flex:none;}
  .dock-sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:0;overflow:hidden;transition:max-height .32s var(--ease);}
  .dock.open .dock-sheet{max-height:120px;margin-bottom:8px;}
  .dock-main{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .da{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid transparent;background:transparent;color:var(--navy-700);font-size:10px;border-radius:11px;cursor:pointer;padding:5px 2px;font-family:var(--sans);}
  .da svg.i{font-size:21px;color:var(--navy-600);}
  .da.primary{background:var(--navy-800);color:var(--cream-50);} .da.primary svg.i{color:var(--cream-50);}
  .da.more{color:var(--navy-500);} .da.more svg.i{color:var(--navy-500);} .dock.open .da.more svg.i{transform:rotate(180deg);}
  .dock-sheet .da{border:1px solid var(--cream-300);background:var(--cream-50);}

  @container (max-width:720px){
    .body{grid-template-columns:1fr;}
    .main{border-right:none;border-bottom:1px solid var(--cream-300);}
    .next-a .btn{flex:1 1 100%;}
    .head{flex-wrap:wrap;} .head-r{width:100%;align-items:flex-start;} .tags{justify-content:flex-start;max-width:none;}
    .ord-title{font-size:28px;}
    .foot{justify-content:stretch;} .foot-a{flex:1 1 100%;} .foot-a .btn{flex:1 1 auto;}
    .qa-sec{display:none;} .dock{display:block;}
  }
  @container (max-width:470px){
    .head{padding:18px 15px 14px;} .main,.rail{padding:6px 15px 18px;} .foot{padding:14px 15px;}
  }

  @keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
