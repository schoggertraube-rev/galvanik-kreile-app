    case 'zu':return zu();

document.addEventListener('keydown',ev=>{
  if(!S.eingeloggt)return;
  const tg=ev.target,tippt=tg.matches&&tg.matches('input,textarea,select');
  if(ev.key==='Enter'&&tg.matches&&tg.matches('.kr-dialog input:not([type=checkbox])')){const erst=root.querySelector('.kr-treffer,.kr-wahl:not(:disabled)');if(erst&&tg.closest('.kr-suchfeld')){ev.preventDefault();erst.click();return}const f=[...root.querySelectorAll('.kr-dialog-fuss .kr-btn:not(:disabled)')].pop();if(f){ev.preventDefault();f.click();return}}
  if((ev.key==='ArrowDown'||ev.key==='ArrowUp')&&root.querySelector('.kr-palette')){ev.preventDefault();const n=root.querySelectorAll('[data-pal]').length;S.palSel=ev.key==='ArrowDown'?Math.min(n-1,S.palSel+1):Math.max(0,S.palSel-1);root.querySelectorAll('[data-pal]').forEach((x,j)=>{x.setAttribute('aria-selected',String(j===S.palSel));if(j===S.palSel){const l=x.closest('[data-pal-liste]');if(x.offsetTop<l.scrollTop||x.offsetTop+x.offsetHeight>l.scrollTop+l.clientHeight)l.scrollTop=x.offsetTop-l.clientHeight/2}});return}
  if(ev.key==='Enter'&&tg.matches&&tg.matches('.kr-palette input')){ev.preventDefault();const l=[...root.querySelectorAll('[data-pal]')];(l[Math.max(0,S.palSel)]||{click(){}}).click();return}
  if((ev.key==='ArrowDown'||ev.key==='ArrowUp')&&root.querySelector('.kr-ebene')){const l=[...root.querySelectorAll('.kr-treffer,.kr-wahl:not(:disabled)')];if(l.length){ev.preventDefault();const idx=l.indexOf(document.activeElement);const n=ev.key==='ArrowDown'?Math.min(l.length-1,idx+1):Math.max(-1,idx-1);if(n<0)root.querySelector('.kr-suchfeld input')?.focus();else l[n].focus();return}}
  if(!tippt&&!ev.ctrlKey&&!ev.metaKey&&!S.ebenen.length){if(ev.key==='/'){ev.preventDefault();S.suche='';S.palSel=-1;return oeffne('suche')}if(ev.key==='n'||ev.key==='N'){ev.preventDefault();return nav('eingang')}
    /* B4: j/k wählen · Enter = Hauptaktion (wie Klick) · s = Später (Zeitwahl) · Esc – nur Desktop, nicht in Feldern, nicht bei offenem Dialog */
    if(S.geraet==='desktop'){const l=[...root.querySelectorAll('.kr-hb-eintrag[data-hb]')].filter(x=>x.offsetParent&&!x.closest('.kr-klapp:not(.kr-klapp--offen)'));
      if((ev.key==='j'||ev.key==='k')&&l.length){ev.preventDefault();S.hbSel=ev.key==='j'?Math.min(l.length-1,S.hbSel+1):Math.max(0,S.hbSel-1);markiere();return}
      const sel=l[S.hbSel];if(sel&&ev.key==='Enter'){ev.preventDefault();sel.querySelector('.kr-hb-aktionen .kr-btn')?.click();return}
      if(sel&&(ev.key==='s'||ev.key==='S')){ev.preventDefault();[...sel.querySelectorAll('.kr-hb-aktionen .kr-btn')].find(x=>x.textContent.trim()==='Später')?.click();return}
      if(ev.key==='Escape'&&S.hbSel>=0){S.hbSel=-1;markiere();return}}}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();if(S.ebenen.some(e=>e.t==='suche'))return;S.suche='';S.palSel=-1;oeffne('suche')}
  if(ev.key==='Escape'&&S.ebenen.length)zu();
});

const SCREENS=[['login','Login /start'],['start','Startseite (je Person)'],['suche','1 · Suchen oder tun'],['eingang','3 · Neuer Eingang'],['auftraege','4 · Aufträge'],['woche','4 · Aufträge · Woche'],['monat','4 · Aufträge · Monat'],['auftrag','4 · Auftragskarte'],['kunden','5 · Kunden'],['kunde','5 · Kundenkarte'],['geld','7 · Geld & Rechnungen'],['raus','10 · Ware raus'],['mehrarbeit','Mehrarbeit'],['fertig','Fertig melden'],['einstellungen','Einstellungen'],['werkstatt','Werkstatt']];
function springe(s){
  S.ebenen=[];S.eingeloggt=s!=='login';S.ansicht='liste';
  if(s==='login')return render();
  if(s==='start')S.screen=PERSONEN[S.person].start;
  else if(['auftraege','kunden','geld','einstellungen','werkstatt'].includes(s))S.screen=s;
  else if(s==='woche'||s==='monat'){S.screen='auftraege';S.ansicht=s}
  else{S.screen=PERSONEN[S.person].start;
    if(s==='suche'){S.suche='';S.palSel=-1;S.ebenen=[{t:'suche'}]}
    if(s==='eingang'){S.eingang=eingangNeu();S.ebenen=[{t:'eingang'}]}
    if(s==='auftrag'){S.screen=istP()?'werkstatt':'auftraege';S.ebenen=[{t:'auftrag',arg:'A-2026-0101'}]}
    if(s==='kunde'){S.screen='kunden';S.ebenen=[{t:'kunde',arg:'K-2026-0011'}]}
    if(s==='raus')S.ebenen=[{t:'raus'}];
    if(s==='mehrarbeit'){S.pickerQ='';S.ebenen=[{t:'picker',arg:'mehrarbeit'}]}
    if(s==='fertig'){S.pickerQ='';S.ebenen=[{t:'picker',arg:'fertig'}]}
  }
  render();
}
function leiste(){
  const seg=(key,opts,label)=>`<div class="ka-gruppe"><span>${label}</span>${opts.map(([v,t])=>`<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${S[key]===v}">${t}</button>`).join('')}</div>`;
  document.getElementById('leiste').innerHTML=seg('person',[['rolf','Rolf'],['phillip','Phillip'],['gregor','Gregor']],'Person')+seg('geraet',[['desktop','Desktop 1914×917'],['tablet','Tablet 1220×880'],['handy','Handy 390×844']],'Gerät')+seg('daten',[['beispiel','Beispiel'],['leer','Leer'],['fehler','Fehler']],'Daten')+seg('anbindung',[['ziel','Livegang'],['heute','Stand heute'],['ausbau','Ausbau M01–M03']],'Anbindungen')+seg('tages',[['zeit','Zeitstrahl Heute & Woche (Owner)'],['kacheln','Kacheln (V1/Rolf V8)']],'Tagesüberblick')+`<div class="ka-gruppe"><span>Bildschirm</span><select data-springe>${SCREENS.filter(([v])=>!(istP()&&v==='geld')).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div><span class="ka-hinweis">Beispieldaten · nur Vorschau</span>`;
}
document.getElementById('leiste').addEventListener('click',ev=>{const b=ev.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,v=b.dataset.v;S[k]=v;if(k==='person'){S.geraet=PERSONEN[v].geraet;S.screen=PERSONEN[v].start;S.ebenen=[];S.hb={}}if(k==='daten'||k==='anbindung')S.hb={};S.hbSel=-1;render()});
document.getElementById('leiste').addEventListener('change',ev=>{if(ev.target.matches('[data-springe]'))springe(ev.target.value)});
function skala(){
  const sk=document.getElementById('skala');const [w,h]=MASSE[S.geraet];
  if(document.body.classList.contains('ka-pruef')){sk.style.transform='';sk.style.width=w+'px';sk.style.height=h+'px';return}
  const lh=document.getElementById('leiste').offsetHeight;const f=Math.min(1,(innerWidth-32)/w,(innerHeight-lh-32)/h);
  sk.style.transform=`scale(${f})`;sk.style.width=w*f+'px';sk.style.height=h*f+'px';
}
addEventListener('resize',skala);

if(P.get('screen')&&!['tag','werkstatt','auftraege','kunden','geld','einstellungen'].includes(P.get('screen')))springe(P.get('screen'));else render();
