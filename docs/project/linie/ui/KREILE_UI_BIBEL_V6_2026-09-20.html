<title>Kreile UI-Bibel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KREILE · UI-BIBEL (klickbarer Prototyp) — Tokens 1:1 aus den
   vier verbindlichen Referenzen (Phillip V4 · Rolf V8 · Auftragskarte V8 · Kundenkarte V2)
   ============================================================ */
:root{
  --navy-900:#12161F; --navy-800:#1A1F2E; --navy-700:#262C3C; --navy-600:#353C4E;
  --navy-500:#4B5366; --navy-400:#6B7286; --navy-300:#8E94A6;
  --cream-50:#FBF8F2; --cream-100:#F6F0E6; --cream-200:#F1E9DC; --cream-300:#E7DCC9;
  --cream-400:#D9CBB3; --cream-500:#C7B79A;
  --amber:#F6A93B; --magenta:#C2185B; --purple:#7A3FB0; --orange:#F2643C;
  --grad:linear-gradient(115deg,#7A3FB0 0%,#C2185B 40%,#F2643C 76%,#F6A93B 100%);
  --succ:#3F9E56; --succ-d:#337F45; --succ-bg:#E3EDDD; --succ-fg:#2C6B3C; --succ-bd:#B7CFAE;
  --warn:#D9722B; --warn-bg:#FAE7D6; --warn-fg:#9C5214; --warn-bd:#ECC39C;
  --info:#4B5366; --info-bg:#E6E8EE; --info-fg:#3A4763;
  --ral:#AF2B1E; --ral-bg:#F7E1DC; --ral-fg:#7E1D14; --ral-bd:#E7B4AA;
  --part-bg:#EBE4F3; --part-fg:#5A3E86;
  --ground:#EFE6D6; --ground-rail:#EADFCB; --surface:#FFFDF9; --line:#E1D5BE;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh-sm:0 1px 2px rgba(26,31,46,.06),0 1px 3px rgba(26,31,46,.05);
  --sh-md:0 2px 6px rgba(26,31,46,.08),0 6px 16px rgba(26,31,46,.06);
  --sh-lg:0 14px 40px rgba(26,31,46,.20);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--cream-200);}
body{font-family:var(--sans);color:var(--navy-900);-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:var(--sans);}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none;}
.scroll{scrollbar-width:none;-ms-overflow-style:none;} .scroll::-webkit-scrollbar{width:0;height:0;display:none;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes sheetIn{from{opacity:0;transform:translateY(-8px) scale(.99);}to{opacity:1;transform:none;}}
@keyframes sheetUp{from{transform:translateY(50px);opacity:.4;}to{transform:none;opacity:1;}}
@keyframes activeGlow{0%,100%{box-shadow:0 0 0 4px rgba(194,24,91,.18),0 3px 8px rgba(194,24,91,.3);}50%{box-shadow:0 0 0 7px rgba(194,24,91,.08),0 3px 8px rgba(194,24,91,.2);}}
@keyframes duePulse{0%,100%{box-shadow:0 2px 10px rgba(175,43,30,.14);}50%{box-shadow:0 2px 16px rgba(175,43,30,.28);}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ---------- Vorschau-Leiste (nur Prototyp, nicht Teil der App) ---------- */
.pv{position:sticky;top:0;z-index:100;background:var(--navy-900);color:var(--cream-100);display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;flex-wrap:wrap;}
.pv b{font-family:var(--serif);letter-spacing:1.2px;font-weight:500;color:#fff;}
.pv .pvl{color:var(--navy-300);}
.pv .pvb{display:flex;gap:4px;margin-left:6px;}
.pv button{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--navy-600);background:var(--navy-800);color:var(--cream-200);font-size:12px;font-weight:600;cursor:pointer;}
.pv button.on{background:var(--cream-50);color:var(--navy-900);border-color:var(--cream-50);}
.pv .pvr{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--navy-300);}
.pv .pvr .tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--navy-700);border-radius:999px;padding:3px 8px;color:var(--cream-300);font-weight:700;}
.stage{display:flex;justify-content:center;align-items:flex-start;padding:22px 16px 40px;min-height:calc(100vh - 46px);}

/* ---------- App-Rahmen (Geräte) ---------- */
.app{position:relative;background:var(--surface);overflow:hidden;box-shadow:var(--sh-lg);display:flex;flex-direction:column;}
.app.dev-desktop{width:1240px;max-width:100%;height:920px;border:1px solid var(--cream-400);border-radius:16px;}
.app.dev-tablet{width:834px;max-width:100%;height:1080px;border:11px solid var(--navy-800);border-radius:26px;}
.app.dev-phone{width:392px;max-width:100%;height:840px;border:10px solid var(--navy-800);border-radius:36px;}
.stripe{height:3px;background:var(--grad);flex:none;}

/* ---------- Shell: Desktop = Sidebar + Topbar · Touch = Topbar + Dock ---------- */
.shell{display:grid;grid-template-columns:238px 1fr;grid-template-rows:66px 1fr;height:calc(100% - 3px);}
.dev-tablet .shell,.dev-phone .shell{display:flex;flex-direction:column;}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;}
.dev-tablet .topbar,.dev-phone .topbar{height:58px;padding:0 14px;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none;}
.logo{width:40px;height:40px;border-radius:11px;background:var(--navy-800);color:var(--cream-50);font-family:var(--serif);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.dev-tablet .logo,.dev-phone .logo{width:34px;height:34px;font-size:13px;}
.brand-txt{display:flex;flex-direction:column;}
.brand-name{font-family:var(--serif);font-size:16px;letter-spacing:1.5px;color:var(--navy-800);}
.brand-home{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-300);margin-top:2px;}
.dev-phone .brand-txt{display:none;}
.search{flex:1;height:46px;background:var(--cream-50);border:1.5px solid var(--cream-400);border-radius:12px;display:flex;align-items:center;gap:11px;padding:0 16px;cursor:pointer;box-shadow:var(--sh-sm);min-width:0;}
.dev-tablet .search,.dev-phone .search{height:40px;}
.search svg.i{font-size:18px;color:var(--navy-500);} .search .ph{font-size:14px;color:var(--navy-400);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .dev-tablet .search .ph,.dev-phone .search .ph{font-size:13px;}
.search .kbd{margin-left:auto;font-size:11px;color:var(--navy-300);border:1px solid var(--cream-400);border-radius:6px;padding:2px 7px;background:var(--surface);flex:none;}
.dev-tablet .search .kbd,.dev-phone .search .kbd{display:none;}
.tb-date{font-size:12px;color:var(--navy-500);text-align:right;line-height:1.35;flex:none;} .tb-date b{color:var(--navy-800);font-weight:600;}
.dev-tablet .tb-date,.dev-phone .tb-date{display:none;}
.avatar{width:42px;height:42px;border-radius:999px;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;position:relative;cursor:pointer;}
.dev-tablet .avatar{width:36px;height:36px;font-size:12px;} .dev-phone .avatar{width:34px;height:34px;font-size:12px;}
.avatar .cv{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:999px;background:var(--surface);border:1px solid var(--cream-400);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--navy-500);}
.dev-phone .avatar .cv{display:none;}
/* Sidebar */
.side{background:var(--navy-800);padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.dev-tablet .side,.dev-phone .side{display:none;}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--navy-300);padding:8px 12px 5px;text-transform:uppercase;}
.nav{display:flex;align-items:center;gap:11px;min-height:44px;border-radius:10px;padding:0 13px;font-size:13.5px;font-weight:500;color:var(--cream-200);cursor:pointer;transition:background .14s,color .14s;border:1px solid transparent;}
.nav svg.i{font-size:18px;color:var(--navy-300);}
.nav:hover{background:var(--navy-700);color:#fff;} .nav:hover svg.i{color:var(--cream-200);}
.nav.active{background:var(--cream-50);color:var(--navy-900);font-weight:600;} .nav.active svg.i{color:var(--navy-800);}
.nav.home.active{box-shadow:inset 0 0 0 2px var(--amber);}
.nav.primary{background:var(--navy-700);color:#fff;border-color:var(--navy-600);} .nav.primary svg.i{color:var(--amber);}
.nav.dim{opacity:.5;} .nav.planned{border:1px dashed var(--navy-600);color:var(--navy-300);cursor:default;} .nav.planned svg.i{color:var(--navy-500);}
.nav .badge{margin-left:auto;background:var(--navy-600);color:var(--cream-100);border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.nav .badge.red{background:var(--ral);color:#fff;}
.nav .soon{margin-left:auto;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--info-fg);background:var(--info-bg);border-radius:999px;padding:3px 8px;font-weight:700;}
.nav-div{height:1px;background:var(--navy-600);margin:9px 8px;} .nav-bottom{margin-top:auto;} .nav .pin{margin-left:auto;font-size:13px;color:var(--amber);}
/* Inhalt */
.content{background:var(--ground);overflow-y:auto;padding:18px 22px 24px;position:relative;min-width:0;}
.dev-tablet .content,.dev-phone .content{flex:1;padding:14px 14px 92px;} .dev-phone .content{padding:12px 11px 92px;}
.content.card-page{padding:0;background:var(--surface);} .dev-tablet .content.card-page,.dev-phone .content.card-page{padding:0 0 92px;}
/* Dock (Tablet/Handy) */
.dock{display:none;position:absolute;left:0;right:0;bottom:0;height:66px;background:var(--navy-800);align-items:stretch;padding:7px 8px;gap:2px;box-shadow:0 -8px 24px rgba(18,22,31,.22);z-index:6;}
.dev-tablet .dock,.dev-phone .dock{display:flex;}
.dk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;color:var(--cream-200);font-size:10px;font-weight:600;cursor:pointer;position:relative;background:transparent;border:none;} .dk svg.i{font-size:20px;color:var(--navy-300);}
.dk.active{background:var(--cream-50);color:var(--navy-900);box-shadow:inset 0 0 0 2px var(--amber);} .dk.active svg.i{color:var(--navy-800);}
.dk .badge{position:absolute;top:4px;right:calc(50% - 24px);background:var(--ral);color:#fff;border-radius:999px;min-width:17px;height:17px;padding:0 4px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
/* Zurück-Kopf für Seiten-Karten */
.pgback{display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--navy-600);flex:none;}
.dev-tablet .pgback,.dev-phone .pgback{padding:9px 14px;}
.pgback button{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--cream-400);background:var(--surface);color:var(--navy-700);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;} .pgback button svg.i{font-size:15px;}
.pgback .crumb{color:var(--navy-400);} .pgback .crumb b{color:var(--navy-800);font-weight:600;}

/* ---------- Seitentitel & Zeilen (Startseiten) ---------- */
.day-title{font-family:var(--serif);font-size:26px;color:var(--navy-900);font-weight:500;letter-spacing:-.3px;} .dev-tablet .day-title{font-size:21px;} .dev-phone .day-title{font-size:22px;}
.day-line{font-size:14px;color:var(--navy-600);margin-top:5px;line-height:1.45;} .dev-tablet .day-line,.dev-phone .day-line{font-size:13px;}
.day-line b{color:var(--navy-900);font-weight:600;} .rp{color:var(--ral-fg);font-weight:700;} .rp b{color:var(--ral-fg);}
.day-line.clear{color:var(--succ-fg);} .day-line.clear b{color:var(--succ-fg);}
.pri-h{display:flex;align-items:center;gap:10px;margin:18px 0 10px;}
.pri-t{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy-800);}
.pri-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--ral);color:#fff;}
.pri-t .hint{margin-left:auto;font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--navy-400);}
.sec-t{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy-800);margin:0 0 10px;} .sec-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--warn);color:#fff;}
.sec-t .hint{margin-left:auto;font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--navy-400);}
.cols{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px;} .dev-phone .cols{grid-template-columns:1fr;gap:14px;}
/* Prioritätspunkte (.pi) — Phillip + Rolf */
.pri{display:flex;flex-direction:column;gap:9px;}
.pi{position:relative;display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;background:var(--surface);border:1px solid var(--cream-300);border-left:4px solid var(--cream-400);border-radius:13px;padding:13px 14px;box-shadow:var(--sh-sm);overflow:visible;transition:opacity .25s,background .15s,height .5s var(--ease),transform .4s var(--ease),padding .4s,border-width .4s;animation:rise .45s var(--ease) both;}
.pi.hero{padding:16px 17px;} .pi.hero .pi-t{font-size:16px;}
.pi.menuopen{z-index:30;}
.pi.crit{border-left-color:var(--ral);background:linear-gradient(90deg,rgba(175,43,30,.05),var(--surface) 60%);}
.pi.soon{border-left-color:var(--warn);} .pi.fromrolf{border-left-color:var(--info);background:linear-gradient(90deg,rgba(75,83,102,.07),var(--surface) 60%);}
.pi.pending{opacity:.7;} .pi.offline{border-left-color:var(--ral);} .pi.working{background:var(--cream-50);}
.pi.snoozed{opacity:.66;background:var(--cream-100);border-left-color:var(--cream-500);}
.pi-dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--navy-300);margin-top:5px;} .pi.crit .pi-dot{background:var(--ral);box-shadow:0 0 0 4px rgba(175,43,30,.14);} .pi.soon .pi-dot{background:var(--warn);} .pi.fromrolf .pi-dot,.pi.delegated .pi-dot{background:var(--info);box-shadow:0 0 0 4px rgba(75,83,102,.14);}
.pi-main{min-width:0;} .pi-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pi-t{font-size:14px;font-weight:600;color:var(--navy-900);line-height:1.3;} .pi-t .id{font-family:var(--serif);color:var(--navy-700);font-weight:500;} .dev-phone .pi-t{font-size:13.5px;}
.from{font-size:10px;font-weight:700;color:var(--info-fg);background:var(--info-bg);border-radius:999px;padding:3px 8px;display:inline-flex;align-items:center;gap:5px;} .from svg.i{font-size:12px;}
.zust{font-size:10px;font-weight:700;border-radius:999px;padding:3px 8px;letter-spacing:.02em;} .zust.arb{background:var(--info-bg);color:var(--info-fg);} .zust.fertig{background:var(--succ-bg);color:var(--succ-fg);} .zust.neu{background:var(--cream-200);color:var(--navy-500);} .zust.raus{background:var(--succ);color:#fff;}
.pi-s{font-size:12px;color:var(--navy-500);margin-top:3px;line-height:1.4;} .pi-s .q{color:var(--navy-800);font-weight:600;}
.pi-chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
.pchip{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block;margin-top:6px;} .pc-red{background:var(--ral-bg);color:var(--ral-fg);} .pc-info{background:var(--info-bg);color:var(--info-fg);}
.pi-cond{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--navy-400);} .pi-cond svg.i{font-size:12px;color:var(--succ);}
.pi-a{position:relative;display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.btn-do{min-height:42px;padding:0 15px;border-radius:11px;background:var(--succ);color:#fff;border:none;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer;box-shadow:0 2px 8px rgba(63,158,86,.26);} .btn-do svg.i{font-size:15px;}
.btn-do.freeze{background:var(--navy-800);box-shadow:0 2px 8px rgba(26,31,46,.22);} .btn-do .tag{font-size:9px;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.16);border-radius:999px;padding:1px 6px;margin-left:6px;}
.btn-do.outline{background:transparent;color:var(--succ-fg);border:1.5px solid var(--succ-bd);box-shadow:none;}
.btn-hand{min-height:42px;padding:0 13px;border-radius:10px;background:var(--surface);color:var(--navy-700);border:1.5px solid var(--cream-500);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;} .btn-hand:hover{border-color:var(--navy-400);background:var(--cream-50);} .btn-hand svg.i{font-size:15px;color:var(--navy-500);}
.btn-return{min-height:42px;padding:0 12px;border-radius:11px;background:var(--surface);color:var(--ral-fg);border:1.5px solid var(--ral-bd);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;} .btn-return svg.i{font-size:14px;}
.btn-later{min-height:42px;padding:0 13px;border-radius:11px;background:transparent;color:var(--navy-500);border:1px solid var(--cream-400);font-size:12px;font-weight:500;cursor:pointer;}
.dev-tablet .btn-do,.dev-tablet .btn-hand,.dev-tablet .btn-later,.dev-phone .btn-do,.dev-phone .btn-hand,.dev-phone .btn-later{min-height:40px;}
.pi.done{opacity:.85;} .pi.done .pi-t{color:var(--succ-fg);} .pi .mut{font-weight:400;color:var(--navy-400);font-size:12px;}
.pi.removing{opacity:0;transform:translateX(14px);padding-top:0!important;padding-bottom:0!important;border-top-width:0;border-bottom-width:0;margin:0;}
.pi-note{font-size:11.5px;color:var(--navy-400);display:flex;align-items:center;gap:6px;flex-wrap:wrap;} .pi-note svg.i{font-size:13px;}
.pi-note.deleg{color:var(--info-fg);font-weight:500;} .pi-note.deleg svg.i{color:var(--info);}
.pi-note.offline-note{color:var(--ral-fg);font-weight:600;} .pi-note.offline-note svg.i{color:var(--ral);}
.pi-note.ret{color:var(--ral-fg);font-weight:600;} .pi-note.ret svg.i{color:var(--ral);}
.pi-note a{text-decoration:underline;cursor:pointer;font-size:11px;opacity:.72;color:inherit;} .pi-note a:hover{opacity:1;}
.pending-note{color:var(--navy-500);font-weight:500;}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--cream-400);border-top-color:var(--navy-500);display:inline-block;animation:spin .7s linear infinite;}
.pi-mat{font-size:10px;color:var(--info-fg);background:var(--info-bg);border-radius:999px;padding:2px 7px;font-weight:700;}
.snooze{position:absolute;left:0;top:calc(100% + 6px);z-index:16;background:var(--surface);border:1px solid var(--cream-400);border-radius:12px;box-shadow:var(--sh-lg);padding:8px;min-width:200px;display:flex;flex-direction:column;gap:4px;animation:rise .16s var(--ease) both;}
.snooze-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--navy-500);padding:3px 8px 5px;}
.snooze-o{text-align:left;background:transparent;border:none;border-radius:8px;padding:9px 10px;font-size:13px;color:var(--navy-800);cursor:pointer;font-weight:500;} .snooze-o:hover{background:var(--cream-100);}
.snooze-note{font-size:10.5px;color:var(--ral-fg);padding:5px 8px 2px;line-height:1.35;border-top:1px solid var(--line);margin-top:2px;}
/* Rail (Phillip) */

function pgAuftraege(){

  const filt0 = f==='alle'?all.filter(o=>o.stage!=='raus'):f==='galvanik'?inWork():f==='fertig'?heuteRaus():f==='angenommen'?all.filter(o=>o.stage==='angenommen'):f==='woche'?all.filter(o=>o.stage!=='raus'&&(o.urgent||/Woche|heute|3 Tagen/.test(o.rel))):f==='raus'?all.filter(o=>o.stage==='raus'):all; const filt=filt0.filter(byq);
  const chips=[['alle','Offen',all.filter(o=>o.stage!=='raus').length],['angenommen','Angenommen',all.filter(o=>o.stage==='angenommen').length],['galvanik','In Arbeit',inWork().length],['fertig','Fertig',heuteRaus().length],['woche','Fällig diese Woche',6],['raus','Raus / Archiv',all.filter(o=>o.stage==='raus').length]];

  <div class="list">${filt.length?filt.map(o=>`<div class="row" data-go="#/auftrag/${o.id}"><span class="row-dot ${o.urgent?'r':o.stage==='fertig'?'g':o.stage==='galvanik'?'i':'w'}"></span><div class="row-main"><div class="row-t"><span class="id">${o.id}</span>${cust(o).short} · ${o.titel}${o.express?' <span class="rchip rc-red">Express</span>':''}</div><div class="row-s">${o.sub} · ${o.mode==='versand'?'Versand':'Abholung'} · Termin ${o.termin}</div></div><div class="row-side"><span class="zust ${zustCls[o.stage]}">${stageLbl[o.stage]}</span><span class="rchip ${o.urgent?'rc-red':'rc-info'}">${o.rel}</span></div></div>`).join(''):`<div class="empty big">${I('check')}<div class="et">Nichts in dieser Ansicht</div><div class="es">Ehrlich leer — keine Platzhalter. Neuer Eingang legt den nächsten Auftrag an.</div><button class="btn btn-primary" data-go="#/eingang">${I('inbox')}Neuer Eingang</button></div>`}</div>`;

/* ---------- Seite: Auftragskarte (V8) ---------- */
function pgAuftrag(id){
  const o=ORD[id]; if(!o) return shell(`<div class="empty big">${I('alert')}<div class="et">Auftrag ${esc(id)} nicht gefunden</div><div class="es">Direkt-URL fail-closed — kein „kommt bald".</div><button class="btn" data-go="#/auftraege">Zu den Aufträgen</button></div>`);
  const c=cust(o); const st=o.stage; const paid=o.bezahlt; const gateNeeded=o.zahlung==='vorkasse';
  const stepCls=(k)=>{ const order=['angenommen','galvanik','fertig','raus']; const i=order.indexOf(k), cur=order.indexOf(st); if(i<cur) return 'done'; if(i===cur) return k==='fertig'?'done':'active'; if(k==='fertig'&&st==='galvanik') return 'ready'; if(k==='raus'){ return (st==='fertig'&&(!gateNeeded||paid))?'ready':'wait'+((gateNeeded&&!paid)?' locked':''); } return 'wait'; };
  const rausLbl=o.mode==='versand'?'verschickt':'abgeholt';
  const teile=o.teile.map(t=>`<div class="part${t.done?' done':''}" data-pid="${t.id}"><div class="thumb${t.foto?'':' none'}" data-open-part="${t.id}">${I(t.foto?'photo':'photo-off')}</div><div class="p-body-tap" data-open-part="${t.id}"><div class="p-top"><span class="p-id">${t.id}</span><span class="p-name">${t.n}</span>${t.foto?'<span class="p-chip chip-succ chip-status">erfasst</span>':`<span class="p-chip chip-warn chip-status">${I('alert')}Foto fehlt</span>`}<span class="p-chip chip-fertig">fertig</span>${t.mehr?`<span class="p-chip chip-neutral">Mehraufwand ${t.mehr}</span>`:''}${t.note?`<span class="p-chip chip-note">${I('msg')}${t.note} Notiz</span>`:''}</div><div class="p-meta">${t.m} · <span class="p-qty">${t.q}</span></div></div><div class="p-actions"><button class="p-fertig" data-part-fertig="${t.id}">${I('check')}<span class="lbl-t">fertig</span></button><button class="p-editbtn" data-open-part="${t.id}">${I('edit')}</button></div></div>`).join('');
  const inv=Object.values(INV).find(i=>i.oid===o.id);
  const inner=`${back(`<b>${o.id}</b> · ${c.short} · Auftragskarte`,'#/auftraege')}
  <div class="card">
    <div class="head"><div class="head-l"><div class="ord-kicker">Auftrag <span class="no">${o.id}</span></div><div class="ord-title">${o.titel}</div><div class="ord-sub">${o.sub} · Kunde ${c.short}</div>
      <div class="meta">${o.express?`<span class="pill pill-brand">${I('flag')}Express</span>`:''}<span class="pill pill-succ">${I('box')}${Object.values(ORD).filter(x=>x.kid===o.kid&&x.stage!=='raus').length} Aufträge im Haus</span><span class="pill pill-soft">${I('layers')}${o.metall}</span><a class="pill pill-cust" data-go="#/kunde/${c.id}">${I('user')}${c.name} · Kundenakte ${I('arrow')}</a></div></div>
      <div class="head-r"><div class="due${o.urgent?' urgent':st==='fertig'?' ok':''}"><div class="due-l">${I('clock')}Liefertermin</div><div class="due-c">${o.rel}</div><div class="due-d">${o.termin}</div><div class="due-m">${I(o.mode==='versand'?'truck':'user')}${o.mode==='versand'?'Versand':'Abholung'} · ${o.zahlung==='vorkasse'?'Vorkasse':o.zahlung==='uebergabe'?'zahlt bei Übergabe':'auf Rechnung'}</div></div></div>
    </div>
    <div class="chain-wrap"><div class="chain-top">Ort im Haus · Schritt tippen zum Umstellen</div>
      <div class="chain">
        <button class="step ${stepCls('angenommen')}" data-stage="angenommen"><span class="dot">${I('check')}</span><span class="lbl">angenommen</span><span class="st">${o.verlauf.slice(-1)[0]?.[2]||''}</span></button>
        <button class="step ${stepCls('galvanik')}" data-stage="galvanik"><span class="dot">${I('droplet')}</span><span class="lbl">Galvanik</span><span class="st">${st==='galvanik'?'jetzt':st==='angenommen'?'als Nächstes':'durch'}</span></button>
        <button class="step ${stepCls('fertig')}" data-stage="fertig"><span class="dot">${I('flag')}</span><span class="lbl">fertig</span><span class="st">${st==='fertig'||st==='raus'?'Freeze gesetzt':'tippen zum Melden'}</span></button>
        ${gateNeeded?`<div class="gate${paid?' paid':''}"><span class="gate-dot">${I('card')}</span><span class="lbl">Zahlung</span><span class="st">${paid?'bezahlt ✓':'Schwelle'}</span></div>`:''}
        <button class="step ${stepCls('raus')}" data-stage="raus"><span class="dot">${I('truck')}</span><span class="lbl">${rausLbl}</span><span class="st">${st==='raus'?'erledigt':gateNeeded&&!paid?'erst nach Zahlung':st==='fertig'?'bereit':'—'}</span></button>
      </div>
      ${gateNeeded?`<div class="paygate${paid?' paid':''}"><div class="pg-info">${I('lock')}<b>Vorkasse</b> · Versand erst nach Zahlung · <span class="pg-state">${paid?'bezahlt ✓':'Zahlung offen'}</span></div><button class="btn-pay" data-pay-for="${o.id}">${I('card')}bezahlen</button></div>`:''}
    </div>
    <div class="cbody">
      <div class="cmain">
        <div class="sec"><div class="next"><div class="next-k">Nächste Aktion</div><div class="next-t">${o.next[0]}</div><div class="next-s">${o.next[1]} ${o.urgent?`<span class="due-red">Liefertermin ${o.rel} · ${o.termin}</span>`:''}</div><div class="next-a"><button class="btn btn-primary" data-act="foto">${I('camera')}Foto aufnehmen</button><button class="btn" data-act="mail" data-oid="${o.id}">${I('mail')}Kunde informieren</button></div></div></div>
        <div class="sec"><div class="sec-h"><span class="t">Teile · was ist zu tun</span><button class="add" data-act="teil-neu" data-oid="${o.id}">${I('plus')}Teil hinzufügen</button></div><div class="parts">${teile}<button class="add-part" data-act="teil-neu" data-oid="${o.id}">${I('plus')}Teil hinzufügen</button></div></div>
        <div class="sec"><div class="sec-h"><span class="t">Auftrag abschließen</span></div><div class="finish">${st==='fertig'||st==='raus'?`<button class="btn btn-succ" disabled style="opacity:.7">${I('check-c')}Fertig · Freeze gesetzt</button>`:`<button class="btn btn-succ" data-order-fertig="${o.id}">${I('check-c')}Auftrag als „fertig" melden</button>`}<button class="btn" data-act="korrektur" data-oid="${o.id}">${I('edit')}Korrektur mit Grund</button></div><div class="freeze-note">${I('lock')}Mit „fertig" frieren erfasster Aufwand und Beträge ein — danach nur noch über Korrektur.</div></div>
        <div class="sec"><div class="sec-h"><span class="t">Notizen</span><button class="add" data-act="notiz" data-oid="${o.id}">${I('plus')}Notiz · Auftrag oder Teil</button></div><div class="notes">${o.notes.length?o.notes.map(n=>`<div class="note"><span class="note-scope scope-${n.scope}">${I(n.scope==='order'?'box':'msg')}${n.l}</span><div class="note-t">${n.t}</div><div class="note-m">${n.m}</div></div>`).join(''):`<div class="empty">${I('msg')}Noch keine Notiz — „Notiz" legt eine an (Auftrag oder einzelnes Teil).</div>`}</div></div>
        <div class="sec"><div class="sec-h"><span class="t">Fotos & Dokumente</span></div><div class="docs">${Array.from({length:o.docs}).map(()=>`<div class="dthumb" data-act="galerie">${I('photo')}</div>`).join('')}${o.kv?`<div class="dfile">${I('file')}${o.kv}</div>`:''}${inv?`<div class="dfile" data-go="#/rechnung/${inv.id}">${I('receipt')}${inv.id}.pdf</div>`:''}<div class="dadd" data-act="foto">${I('plus')}</div></div></div>
        <div class="sec"><div class="slot"><div class="slot-h">${I('receipt')}<span class="t">Rechnung & Zahlung</span></div>
          ${inv?`<div class="slot-row"><span class="k">Rechnung ${inv.id} · ${inv.datum}</span><span class="v">${fmt(inv.betrag)}</span></div><div class="slot-row"><span class="k">Status</span><span class="stat st-${inv.status}">${inv.status==='bez'?'BEZAHLT':inv.status==='ueber'?'ÜBERFÄLLIG':'OFFEN'}</span></div><div class="slot-row"><span class="k">Offener Betrag</span><span class="v">${inv.status==='bez'?fmt(0):fmt(inv.betrag)}</span></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" data-go="#/rechnung/${inv.id}">${I('receipt')}Rechnung öffnen</button>${inv.status!=='bez'?`<button class="btn btn-primary" data-pay-inv="${inv.id}">${I('card')}Zahlung bestätigen</button>`:''}</div>`
              :st==='fertig'||st==='raus'?`<div class="slot-row"><span class="k">Positionen aus eingefrorener Karte</span><span class="v">${o.teile.length} Pos.</span></div><div class="slot-row"><span class="k">Rechnung</span><span class="slot-tag">noch nicht gestellt</span></div><div style="margin-top:10px"><button class="btn btn-primary" data-act="rechnung-neu" data-oid="${o.id}">${I('receipt')}Rechnung erstellen</button></div>`
              :`<div class="slot-row"><span class="k">Rechnung</span><span class="slot-tag">erst nach „fertig"</span></div><div class="slot-foot">Positionen und Mehraufwand werden mit „fertig" eingefroren — daraus entsteht die unveränderliche Rechnung (Nummer, Snapshot, PDF).</div>`}
        </div></div>
      </div>
      <div class="crail">
        <div class="sec"><div class="sec-h"><span class="t">Schnellaktionen</span></div><div class="qa-grid">
          <button class="qa" data-act="mail" data-oid="${o.id}">${I('mail')}<span class="ql">Status-Mail</span></button><button class="qa" data-act="anruf" data-oid="${o.id}">${I('phone')}<span class="ql">Anrufen</span></button><button class="qa" data-act="foto">${I('camera')}<span class="ql">Foto +</span></button><button class="qa" data-go="#/eingang">${I('box')}<span class="ql">Erfassung</span></button>
          <button class="qa" data-act="kv" data-oid="${o.id}">${I('file')}<span class="ql">KV</span></button><button class="qa" data-act="rechnung-neu" data-oid="${o.id}">${I('receipt')}<span class="ql">Rechnung</span></button><button class="qa" data-pay-for="${o.id}">${I('card')}<span class="ql">Zahlung</span></button><button class="qa" data-go="#/ware-raus">${I('truck')}<span class="ql">Versand</span></button>
          <button class="qa" data-act="rekla" data-oid="${o.id}">${I('alert')}<span class="ql">Reklamation</span></button><button class="qa" data-act="dup" data-oid="${o.id}">${I('copy')}<span class="ql">Duplizieren</span></button>
        </div></div>
        <div class="sec"><div class="sec-h"><span class="t">Verlauf</span></div><div class="tl">${o.verlauf.map(v=>`<div class="tl-i"><span class="tl-d ${v[0]}">${I(v[1])}</span><div><div class="tl-time">${v[2]}</div><div class="tl-t">${v[3]}</div>${v[4]?`<div class="tl-s">${v[4]}</div>`:''}</div></div>`).join('')}</div></div>
      </div>
    </div>
    <div class="foot"><div class="foot-v">Auftragskarte · Machart V8 · UI-Bibel</div><div class="foot-a"><button class="btn" data-go="#/auftraege">Schließen</button><button class="btn btn-primary" data-act="mail" data-oid="${o.id}">${I('send')}Kunden-Update senden</button></div></div>
  </div>`;
  return shell(inner,{card:true});
}

/* ---------- Seite: Kunden (Liste) ---------- */
function pgKunden(){
  const kq=(S.kq||'').toLowerCase();
  const list=Object.values(CUST).filter(c=>!kq||(c.name+' '+c.ort+' '+c.tel+' '+c.profil.join(' ')).toLowerCase().includes(kq)).filter(c=>S.kfilter==='alle'||(S.kfilter==='aktiv'&&Object.values(ORD).some(o=>o.kid===c.id&&o.stage!=='raus'))||(S.kfilter==='a'&&c.klasse==='A-Kunde')||(S.kfilter==='offen'&&Object.values(INV).some(i=>i.kid===c.id&&i.status!=='bez')));
  const inner=`
  <div class="ph-row"><div><div class="day-title">Kunden & Kontakt</div><div class="day-line">${list.length} Kunden · Stammdaten, Eigenheiten, Aufträge, Notizen — Suche/Filter → Kundenkarte.</div></div><button class="btn btn-primary" data-act="kunde-neu">${I('plus')}Neuer Kunde</button></div>
  <div class="searchbig">${I('search')}<input placeholder="Name, Ort, Telefon, Oberfläche …" data-kq value="${esc(S.kq||'')}"></div>
  <div class="filt">${[['alle','Alle'],['aktiv','Mit Aufträgen im Haus'],['a','A-Kunden'],['offen','Offene Posten']].map(c=>`<button class="fchip${S.kfilter===c[0]?' on':''}" data-kfilter="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="list">${list.map(c=>{const n=Object.values(ORD).filter(o=>o.kid===c.id&&o.stage!=='raus').length; const off=Object.values(INV).filter(i=>i.kid===c.id&&i.status!=='bez').length; return `<div class="row" data-go="#/kunde/${c.id}"><span class="avatar" style="width:36px;height:36px;font-size:11px">${c.name.split(' ').map(w=>w[0]).slice(0,2).join('')}</span><div class="row-main"><div class="row-t">${c.name}${c.klasse==='A-Kunde'?' <span class="rchip rc-go">A</span>':''}</div><div class="row-s">${c.ort} · ${c.tel} · ${c.sub.split('·')[0].trim()}</div></div><div class="row-side">${n?`<span class="rchip rc-info">${n} im Haus</span>`:''}${off?`<span class="rchip rc-warn">${off} offen</span>`:''}${I('arrow')}</div></div>`;}).join('')}</div>`;
  return shell(inner);
}

/* ---------- Seite: Kundenkarte (V2) ---------- */
function pgKunde(id){
  const c=CUST[id]; if(!c) return shell(`<div class="empty big">${I('alert')}<div class="et">Kunde ${esc(id)} nicht gefunden</div><button class="btn" data-go="#/kunden">Zu den Kunden</button></div>`);
  const orders=Object.values(ORD).filter(o=>o.kid===c.id&&o.stage!=='raus'); const invs=Object.values(INV).filter(i=>i.kid===c.id);
  const hot=orders.find(o=>o.urgent)||orders[0];
  const inner=`${back(`<b>${c.id}</b> · ${c.short} · Kundenkarte`,'#/kunden')}
  <div class="card">
    <div class="head"><div class="head-l"><div class="ord-kicker">Kunde <span class="no">${c.id}</span></div><div class="ord-title">${c.name}</div><div class="ord-sub">${c.sub}</div>
      <div class="contact">${c.str?c.str+', ':'<span style="color:var(--ral-fg)">Straße fehlt · </span>'}${c.plz?c.plz+' ':''}${c.ort}<span class="sep">·</span><a href="tel:${c.tel.replace(/\s/g,'')}">${c.tel}</a><span class="sep">·</span><a href="mailto:${c.mail}">${c.mail}</a></div>
      <div class="meta"><span class="pill pill-succ">${I('star')}${c.klasse}</span><span class="pill pill-succ">${I('box')}${orders.length} Aufträge im Haus</span><span class="pill pill-soft">${I('truck')}${c.versand}</span></div>${c.pref?`<div class="pref">${c.pref}</div>`:''}</div>
      <div class="head-r"><div class="tags">${c.tags.map(t=>`<span class="tag">${I('tag')}${t}</span>`).join('')}<span class="tag add" data-act="tag">${I('plus')}Tag</span></div></div>
    </div>
    <div class="cbody">
      <div class="cmain">
        ${hot?`<div class="sec"><div class="next"><div class="next-k">Nächste Aktion</div><div class="next-t">${c.short} über ${hot.stage==='fertig'?'die Abholung/den Versand':'den Stand'} von ${hot.titel} informieren</div><div class="next-s">Auftrag ${hot.id}${hot.express?' · Express':''} · ${hot.urgent?`<span class="due-red">Liefertermin ${hot.rel} · ${hot.termin}</span>`:hot.rel}</div><div class="next-a"><button class="btn btn-primary" data-act="mail" data-oid="${hot.id}">${I('mail')}E-Mail schreiben</button><button class="btn" data-act="anruf" data-kid="${c.id}">${I('phone')}Anrufen</button></div></div></div>`:''}
        <div class="sec"><div class="sec-h"><span class="t">Aktive Aufträge · ${orders.length}</span><button class="add" data-go="#/eingang?k=${c.id}">${I('plus')}Neuer Auftrag</button></div>${orders.length?orders.map(o=>`<div class="order" data-go="#/auftrag/${o.id}"><span class="odot ${o.urgent?'warn':o.stage==='fertig'?'ok':'i'}"></span><div><div class="onum">${o.id}</div><div class="otitle">${o.titel} · ${o.sub}</div></div><div class="oright"><div class="ostage">${stageLbl[o.stage]}${o.express?' · Express':''}</div><div class="odue ${o.urgent?'warn':'ok'}">${o.rel}</div></div></div>`).join(''):`<div class="empty">${I('check')}Keine Aufträge im Haus.</div>`}</div>
        <div class="sec"><div class="sec-h"><span class="t">Notizen & Telefonnotizen</span><button class="add" data-act="telefonnotiz" data-kid="${c.id}">${I('plus')}Notiz · Kunde oder Auftrag</button></div><div class="notes">${c.notes.length?c.notes.map(n=>`<div class="note"><span class="note-scope scope-${n.scope}">${I(n.scope==='phone'?'phone':'user')}${n.l}</span><div class="note-t">${n.t}</div><div class="note-m">${n.m}</div></div>`).join(''):`<div class="empty">${I('msg')}Noch keine Notiz. Telefonnotiz gehört hierher (Kunde/Intake).</div>`}</div></div>
        <div class="sec"><div class="sec-h"><span class="t">Eigenheiten & Absprachen</span><button class="add" data-act="absprache" data-kid="${c.id}">${I('plus')}Absprache</button></div><div class="facts">${c.facts.length?c.facts.map(f=>`<div class="fact">${I(f[0])}<div><span class="fk">${f[1]}</span>${f[2]}</div></div>`).join(''):`<div class="empty">${I('check')}Keine Absprachen hinterlegt.</div>`}</div></div>
        <div class="sec"><div class="sec-h"><span class="t">Historie & ähnliche Arbeiten</span><button class="add">Filter: Oberfläche ▾</button></div>${c.hist.length?c.hist.map(h=>`<div class="ref"><div class="ref-top">${h[0]}</div><div class="ref-s">${h[1]}</div><div class="ref-a"><button class="btn-sm" data-act="hist">${I('open')}Öffnen</button><button class="btn-sm" data-act="ref">${I('copy')}Als Referenz verwenden</button></div></div>`).join(''):`<div class="empty">${I('clock')}Noch keine abgeschlossenen Aufträge.</div>`}</div>
        <div class="sec"><div class="sec-h"><span class="t">Fotos & Dokumente</span></div><div class="docs"><div class="dthumb" data-act="galerie">${I('photo')}</div><div class="dthumb" data-act="galerie">${I('photo')}</div>${c.facts.some(f=>f[1]==='Preisabsprache')?`<div class="dfile">${I('file')}Preisvereinbarung.pdf</div>`:''}<div class="dadd" data-act="foto">${I('plus')}</div></div></div>
      </div>
      <div class="crail">
        <div class="sec"><div class="sec-h"><span class="t">Schnellaktionen</span></div><div class="qa-grid"><button class="qa primary" data-go="#/eingang?k=${c.id}">${I('plus')}<span class="ql">Neuer Auftrag</span></button><button class="qa" data-act="anruf" data-kid="${c.id}">${I('phone')}<span class="ql">Anrufen</span></button><button class="qa" data-act="mail" data-kid="${c.id}">${I('mail')}<span class="ql">E-Mail</span></button><button class="qa" data-go="#/geld">${I('receipt')}<span class="ql">Rechnung</span></button><button class="qa" data-go="#/geld">${I('card')}<span class="ql">Zahlung</span></button><button class="qa" data-act="rekla">${I('alert')}<span class="ql">Reklamation</span></button><button class="qa" data-act="kunde-edit" data-kid="${c.id}">${I('edit')}<span class="ql">Bearbeiten</span></button><button class="qa" data-act="telefonnotiz" data-kid="${c.id}">${I('phone')}<span class="ql">Telefonnotiz</span></button></div></div>
        <div class="sec"><div class="sec-h"><span class="t">Teile & Profil</span></div><div class="profile">${c.profil.map(p=>`<span class="prochip">${p}</span>`).join('')||'<span class="prochip">noch kein Profil</span>'}</div><div class="profile-m">Wiederkehrende Oberflächen dieses Kunden.</div></div>
        <div class="sec"><div class="sec-h"><span class="t">Reklamationen</span></div><div class="empty">${I('check')}Keine offenen · 1 erledigt (2024, Kulanz-Nachpolitur).</div></div>
        <div class="sec"><div class="sec-h"><span class="t">Kontaktverlauf</span></div><div class="tl">${c.kontakt.length?c.kontakt.map(k=>`<div class="tl-i"><span class="tl-d ${k[0]}">${I(k[1])}</span><div><div class="tl-time">${k[2]}</div><div class="tl-t">${k[3]}</div></div></div>`).join(''):`<div class="empty">${I('clock')}Noch kein Kontakt protokolliert.</div>`}</div></div>
        <div class="sec"><div class="slot"><div class="slot-h">${I('receipt')}<span class="t">Rechnungen & offene Posten</span></div>${invs.length?invs.map(i=>`<div class="slot-row" data-go="#/rechnung/${i.id}" style="cursor:pointer"><span class="k">${i.id} · ${i.datum}</span><span class="stat st-${i.status}">${i.status==='bez'?'BEZAHLT':i.status==='ueber'?'ÜBERFÄLLIG':'OFFEN'}</span></div>`).join('')+`<div class="slot-row"><span class="k">Offener Betrag</span><span class="v">${fmt(invs.filter(i=>i.status!=='bez').reduce((a,i)=>a+i.betrag,0))}</span></div>`:`<div class="slot-row"><span class="k">Offene Posten</span><span class="v">${fmt(0)}</span></div>`}</div></div>
      </div>
    </div>
    <div class="foot"><div class="foot-v">Kundenkarte · Machart V2 · UI-Bibel</div><div class="foot-a"><button class="btn" data-go="#/kunden">Schließen</button><button class="btn btn-primary" data-go="#/eingang?k=${c.id}">${I('inbox')}Neuer Auftrag für ${c.short}</button></div></div>
  </div>`;
  return shell(inner,{card:true});
}
</script>

.cbody.single{grid-template-columns:1fr;} .cbody.single .cmain{max-width:760px;}
.toast{pointer-events:none;} .dev-phone .toast{left:14px;right:14px;transform:none;width:auto;} .dev-phone .toast .t-act{white-space:nowrap;} .toast .t-act{pointer-events:auto;}
.freeze-box{display:block;position:relative;padding-left:36px;} .freeze-box svg.i{position:absolute;left:13px;top:12px;margin:0;}
</style>
<script>
/* =====================================================================
   Teil 5 · Geld / Rechnung / Eingang / Ware raus / Suche / Einstellungen /
   Mehr · Overlays · Router · Events · Init
   ===================================================================== */
const SURF=['verchromen','Chrom hochglanz','vernickeln','verzinken','verkupfern + verchromen','Entchromen / prüfen','Passivieren','noch klären'];
const ZUST=['alter Chrom','Rost','Dellen','Riss','Lötstelle nötig','Zubehör dabei','Verpackung behalten'];
const EING=['persönlich angeliefert','Versand eingegangen','Abholung durch Kreile'];
const teilNamen=()=>[...new Set(Object.values(ORD).flatMap(o=>o.teile.map(t=>t.n)))].sort();
const normName=x=>String(x||'').toLowerCase().replace(/gmbh|kg|ag|ug|e\.k\.|&|\./g,'').replace(/\s+/g,' ').trim();
const tail8=x=>String(x||'').replace(/\D/g,'').slice(-8);
const findDup=(name,tel,mail)=>{const n=normName(name); return Object.values(CUST).find(c=>{const cn=normName(c.name); return (n.length>=4&&(cn.includes(n)||n.includes(cn)))||(tail8(tel).length===8&&tail8(c.tel)===tail8(tel))||(mail&&String(mail).includes('@')&&c.mail.toLowerCase()===String(mail).toLowerCase());});};
const MATS=['Stahl','Messing','Zinkdruckguss','Alu-Guss','Kupfer','Edelstahl'];
const KAT=[['Richten','15 Min · 21,95 €'],['Schleifen','je 15 Min · 21,95 €'],['Entlacken','pauschal · 18,00 €'],['Strahlen','pauschal · 24,00 €'],['Polieren','je 15 Min · 21,95 €'],['Sonderverpackung','pauschal · 9,50 €']];
let seqA=61, seqK=41, seqR=119;
const invStat={offen:'offen',bez:'bezahlt',ueber:'überfällig'};
const statPill=s=>`<span class="stat st-${s}">${invStat[s]}</span>`;
const sum=a=>a.reduce((x,i)=>x+i.betrag,0);
function pushV(o,arr){ o.verlauf.unshift(arr); }
function nowLbl(){ return 'heute · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

/* ---------- Seite: Geld & Rechnungen ---------- */
function pgGeld(){
  const all=Object.values(INV); const f=S.filter==='alle'||!['offen','ueber','bez'].includes(S.filter)?'alle':S.filter;
  const list=f==='alle'?all:all.filter(i=>i.status===f);
  const ueber=all.filter(i=>i.status==='ueber'), offen=all.filter(i=>i.status==='offen'), bez=all.filter(i=>i.status==='bez');
  const frozenNoInv=Object.values(ORD).filter(o=>(o.stage==='fertig'||o.stage==='raus')&&!all.find(i=>i.oid===o.id));
  const inner=`
  <div class="ph-row"><div><div class="day-title">Geld & Rechnungen</div><div class="day-line">Rechnung aus eingefrorener Auftragskarte · Zahlung erfassen · Export. Minimal, keine Buchhaltung.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">${I('download')}Export CSV / DATEV</button><button class="btn btn-primary" data-act="rechnung-neu">${I('receipt')}Rechnung erstellen${frozenNoInv.length?`<span class="badge" style="margin-left:6px">${frozenNoInv.length}</span>`:''}</button></div></div>
  <div class="kpi">
    <div class="k"><div class="kl">Offene Posten</div><div class="kn">${fmt(sum(offen)+sum(ueber))}<small>${offen.length+ueber.length} Rechnungen</small></div></div>
    <div class="k red"><div class="kl">Überfällig</div><div class="kn">${fmt(sum(ueber))}<small>${ueber.length} · Erinnerung fällig</small></div></div>
    <div class="k ok"><div class="kl">Bezahlt · 30 Tage</div><div class="kn">${fmt(sum(bez))}<small>${bez.length} Rechnungen</small></div></div>
  </div>
  <div class="filt">${[['alle','Alle',all.length],['offen','Offen',offen.length],['ueber','Überfällig',ueber.length],['bez','Bezahlt',bez.length]].map(c=>`<button class="fchip${f===c[0]?' on':''}" data-filter="${c[0]}">${c[1]}<span class="n">${c[2]}</span></button>`).join('')}</div>
  <div class="list" style="padding:4px 10px"><table class="inv-tbl"><thead><tr><th>Nr.</th><th>Kunde · Auftrag</th><th class="hide-phone">Datum</th><th>Fällig</th><th class="r">Betrag</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(i=>`<tr data-go="#/rechnung/${i.id}" style="cursor:pointer"><td><b>${i.id}</b></td><td>${CUST[i.kid].short}<div class="lsub" style="margin:2px 0 0">${i.oid}</div></td><td class="hide-phone">${i.datum}</td><td>${i.faellig}</td><td class="r">${fmt(i.betrag)}</td><td>${statPill(i.status)}</td><td>${i.status==='bez'?'':`<button class="btn btn-sm" data-pay-inv="${i.id}">${I('card')}Zahlung</button>`}</td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">${I('receipt')}Keine Rechnungen in diesem Filter.</div></td></tr>`}
  </tbody><tfoot><tr><td colspan="4">Summe Filter</td><td class="r">${fmt(sum(list))}</td><td colspan="2"></td></tr></tfoot></table></div>
  <div class="lsub">Bereit zur Rechnung · eingefrorene Aufträge ohne Rechnung</div>
  <div class="list">${frozenNoInv.map(o=>`<div class="row"><span class="row-dot g"></span><div class="row-main"><div class="row-t"><span class="id">${o.id}</span>${cust(o).short} · ${o.titel}</div><div class="row-s">${o.teile.length} Positionen · Freeze gesetzt · ${o.zahlung==='vorkasse'?'Vorkasse':o.zahlung==='uebergabe'?'zahlt bei Übergabe':'auf Rechnung'}</div></div><div class="row-side"><button class="btn btn-sm btn-primary" data-act="rechnung-neu" data-oid="${o.id}">${I('receipt')}Rechnung</button></div></div>`).join('')||`<div class="empty">${I('check')}Alles abgerechnet — kein eingefrorener Auftrag wartet.</div>`}</div>
  <div class="modstrip">${I('lock')}<div class="mt"><b>Regel:</b> Beträge kommen ausschließlich aus der eingefrorenen Auftragskarte. Rechnung = Snapshot, Änderung nur über Korrektur mit Grund.</div><span class="tag">ACCOUNTING minimal</span></div>`;
  return shell(inner);
}

/* ---------- Seite: Rechnung ---------- */
function pgRechnung(id){
  const i=INV[id]; if(!i) return shell(`<div class="empty big">${I('alert')}<div class="et">Rechnung ${esc(id)} nicht gefunden</div><button class="btn" data-go="#/geld">Zu Geld & Rechnungen</button></div>`);
  const c=CUST[i.kid], o=ORD[i.oid]; const netto=i.betrag/1.19, mwst=i.betrag-netto;
  const inner=`${back(`<b>${i.id}</b> · ${c.short} · Rechnung`,'#/geld')}
  <div class="card">
    <div class="head"><div class="head-l"><div class="ord-kicker">Rechnung <span class="no">${i.id}</span></div><div class="ord-title">${o?o.titel:'—'}</div><div class="ord-sub">Kunde ${c.name} · ${c.ort}</div>
      <div class="meta">${statPill(i.status)}<a class="pill pill-soft" data-go="#/auftrag/${i.oid}">${I('box')}${i.oid} · Auftragskarte ${I('arrow')}</a><a class="pill pill-cust" data-go="#/kunde/${c.id}">${I('user')}Kundenakte ${I('arrow')}</a></div></div>
      <div class="head-r"><div class="due${i.status==='ueber'?' urgent':i.status==='bez'?' ok':''}"><div class="due-l">${I('clock')}Fällig</div><div class="due-c">${i.faellig}</div><div class="due-d">Rechnungsdatum ${i.datum}</div><div class="due-m">${I('euro')}${fmt(i.betrag)} brutto</div></div></div>
    </div>
    <div class="cbody"><div class="cmain">
      <div class="sec"><div class="sec-h"><span class="t">Positionen · Snapshot aus Freeze</span></div>
        <table class="inv-tbl"><thead><tr><th>Position</th><th>Menge</th><th class="r">Betrag</th></tr></thead><tbody>${i.pos.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td><td class="r">${fmt(+p[2])}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="2">Netto</td><td class="r">${fmt(netto)}</td></tr><tr><td colspan="2">MwSt 19 %</td><td class="r">${fmt(mwst)}</td></tr><tr><td colspan="2">Brutto</td><td class="r">${fmt(i.betrag)}</td></tr></tfoot></table>
        <div class="freeze-note">${I('lock')}Positionen sind eingefroren. Änderung nur über Korrektur/Gutschrift mit Grund — Original bleibt sichtbar.</div></div>
      <div class="sec"><div class="sec-h"><span class="t">Zahlung</span></div>
        ${i.status==='bez'?`<div class="empty">${I('check-c')}Bezahlt · ${i.faellig} · Zahlart ${i.zahlart||'Überweisung'}</div>`:`<div class="slot"><div class="slot-row"><span class="k">Offen</span><span class="v">${fmt(i.betrag)}</span></div><div class="slot-row"><span class="k">Zahlungsweg</span><span class="v">Mollie-Link · Überweisung · Bar/EC</span></div><div class="slot-foot"><button class="btn btn-succ" data-pay-inv="${i.id}">${I('card')}Zahlung erfassen</button>${i.status==='ueber'?`<button class="btn" data-act="erinnerung" data-iid="${i.id}">${I('mail')}Zahlungserinnerung</button>`:''}</div></div>`}</div>
    </div><div class="crail">
      <div class="sec"><div class="sec-h"><span class="t">Aktionen</span></div><div class="qa-grid">
        <button class="qa primary" data-act="pdf" data-iid="${i.id}">${I('file')}<span class="ql">PDF</span></button>
        <button class="qa" data-act="mail" data-oid="${i.oid}" data-iid="${i.id}">${I('send')}<span class="ql">Per Mail senden</span></button>
        <button class="qa" data-act="korrektur" data-oid="${i.oid}" data-iid="${i.id}">${I('edit')}<span class="ql">Korrektur / Gutschrift</span></button>
        <button class="qa" data-act="anruf" data-oid="${i.oid}">${I('phone')}<span class="ql">Anruf ${c.tel}</span></button></div></div>
      <div class="sec"><div class="sec-h"><span class="t">Verlauf</span></div><div class="tl">
        ${i.status==='bez'?`<div class="tl-i"><span class="tl-d succ">${I('card')}</span><div><div class="tl-time">${i.faellig}</div><div class="tl-t">Zahlung eingegangen</div></div></div>`:''}
        ${i.status==='ueber'?`<div class="tl-i"><span class="tl-d warn">${I('alert')}</span><div><div class="tl-time">seit ${i.faellig}</div><div class="tl-t">Überfällig · keine Erinnerung gesendet</div></div></div>`:''}
        <div class="tl-i"><span class="tl-d info">${I('receipt')}</span><div><div class="tl-time">${i.datum}</div><div class="tl-t">Rechnung erstellt aus Freeze ${i.oid}</div></div></div></div></div>
    </div></div>
    <div class="foot"><div class="foot-v">Rechnung · ACCOUNTING minimal · UI-Bibel</div><div class="foot-a"><button class="btn" data-go="#/geld">Schließen</button></div></div>
  </div>`;
  return shell(inner,{card:true});
}

/* ---------- Seite: Neuer Eingang (Wizard 5 Schritte) ---------- */
function wizHead(step){ const T=['Kunde','Positionen','Fotos & Dokumente','Termin · Versand · Zahlung','Bestätigung'];
  return `<div class="wiz-t">Schritt ${step} von 5 · ${T[step-1]}</div><div class="wiz">${T.map((_,i)=>`<span class="wz${i+1<step?' done':i+1===step?' on':''}"></span>`).join('')}</div>`; }
function pgEingang(){
  const it=S.intake; const c=it.kid?CUST[it.kid]:null;
  let body='';
  if(it.step===1){
    const q=(it.q||'').toLowerCase(); const list=Object.values(CUST).filter(k=>!q||(k.name+' '+k.ort+' '+k.tel).toLowerCase().includes(q));
    body=`<div class="pick-s" style="opacity:.62;cursor:default;border-style:dashed" title="Anbindung folgt nach Provider-Freigabe">${I('scan')}Lieferschein / Zettel / Foto scannen → Vorschläge (Kunde, Teile, Menge)<span class="stat st-offen" style="margin-left:auto">nicht verbunden · später</span></div>
      <div class="searchbig">${I('search')}<input placeholder="Kunde suchen · Name, Ort, Telefon, Kundennummer" data-wq value="${esc(it.q||'')}" autofocus></div>
      <div class="pick-s" data-act="kunde-neu">${I('plus')}Neuer Kunde anlegen${it.q&&findDup(it.q,it.q,'')?` <span class="stat st-ueber" style="margin-left:auto">Achtung: ähnlicher Kunde vorhanden</span>`:''}</div>
      ${list.map(k=>`<div class="pick-row" data-pick-cust="${k.id}"><span class="id">${k.id}</span><div><div class="nm">${k.name}</div><div class="sb">${k.ort} · ${k.klasse} · ${k.versand}</div></div><span class="zust ${Object.values(ORD).some(o=>o.kid===k.id&&o.stage!=='raus')?'arb':'neu'}" style="margin-left:auto">${Object.values(ORD).filter(o=>o.kid===k.id&&o.stage!=='raus').length} im Haus</span></div>`).join('')||`<div class="empty">${I('users')}Kein Kunde gefunden — neu anlegen.</div>`}`;
  } else if(it.step===2){
    const f=it.form||(it.form={n:'',q:1,mat:'Stahl',surf:[],zust:[]}); f.zust=f.zust||[];
    body=`<div class="fld"><div><div class="fld-k">Kunde</div><div class="fld-v">${c.name} · ${c.ort}</div></div><button class="btn btn-sm" data-wiz="1">ändern</button></div>
      ${(()=>{const last=Object.values(ORD).filter(o=>o.kid===c.id).slice(-1)[0]; return last&&!it.pos.length?`<div class="pick-s" data-wtemplate="${last.id}">${I('copy')}Wie letzter Auftrag ${last.id} · ${last.teile.length} Teile übernehmen (nur Unterschiede ändern)</div>`:'';})()}
      ${it.pos.length?`<div class="lsub">Positionen · ${it.pos.length} von max. 20</div>${it.pos.map((p,i)=>`<div class="pos-row"><span class="pn">T-${String(i+1).padStart(2,'0')}</span><div><div class="pt">${esc(p.n)}</div><div class="ps">${p.mat} → ${p.surf.join(' + ')||'Oberfläche offen'} · ${p.q} Stück${p.zust&&p.zust.length?' · '+p.zust.join(', '):''}</div></div><button class="kat-rm" data-pos-rm="${i}">${I('x')}</button></div>`).join('')}`:`<div class="empty">${I('box')}Noch keine Position. Teil unten erfassen — Foto kommt in Schritt 3.</div>`}
      <div class="sec" style="padding-bottom:0"><div class="sec-h"><span class="t">Teil erfassen</span></div>
        <div class="fg"><label class="flabel">Teil / Bezeichnung · Vorschläge aus Historie</label><input class="inp" data-wf="n" list="teilnamen" value="${esc(f.n)}" placeholder="z. B. Stoßstange vorne"><datalist id="teilnamen">${teilNamen().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
        <div class="fg"><label class="flabel">Material · Auswahl</label><div class="surf-chips">${MATS.map(m=>`<button class="schip${f.mat===m?' on':''}" data-wmat="${m}">${m}</button>`).join('')}</div></div>
        <div class="fg"><label class="flabel">Oberfläche · Mehrfachauswahl (Katalog, kein Freitext)</label><div class="surf-chips">${SURF.map(s=>`<button class="schip${f.surf.includes(s)?' on':''}" data-wsurf="${s}">${s}</button>`).join('')}</div></div>
        <div class="fg"><label class="flabel">Zustand bei Eingang · optional</label><div class="surf-chips">${ZUST.map(z=>`<button class="schip${f.zust.includes(z)?' on':''}" data-wzust="${z}">${z}</button>`).join('')}</div></div>
        <div class="kat"><div><div class="kat-name">Menge</div><div class="kat-sub">Stück</div></div><div class="stepper"><button class="stp" data-wq-step="-1">−</button><span class="stval">${f.q}</span><button class="stp" data-wq-step="1">+</button></div></div>
        <button class="kat-add" data-pos-add ${it.pos.length>=20?'disabled':''}>${I('plus')}Position übernehmen</button></div>`;
  } else if(it.step===3){
    body=`<div class="fld"><div><div class="fld-k">Eingang</div><div class="fld-v">${c.short} · ${it.pos.length} Positionen</div></div></div>
      <div class="lsub">Zustandsfotos je Teil · empfohlen: Gesamtansicht + Schadstelle · Kunde ${c.pref.includes('Fotos')?'<b>wünscht Fotos ausdrücklich</b>':'Standard'}</div>
      ${it.pos.map((p,i)=>`<div class="fld"><div><div class="fld-k">T-${String(i+1).padStart(2,'0')} · ${p.q} Stück</div><div class="fld-v">${esc(p.n)}</div><div class="kat-sub">${(p.fotos||0)?`${p.fotos} Foto(s)`:'<span style="color:var(--ral-fg)">noch kein Foto</span>'}</div></div><div class="docs">${Array.from({length:p.fotos||0}).map(()=>`<div class="dthumb">${I('photo')}</div>`).join('')}<div class="dadd" data-wfoto="${i}" data-wart="Gesamtansicht" title="Gesamtansicht">${I('camera')}</div><div class="dadd" data-wfoto="${i}" data-wart="Schadstelle" title="Schadstelle / Detail">${I('alert')}</div><div class="dadd" data-wfoto="${i}" data-wart="Zubehör" title="Zubehör / Verpackung">${I('package')}</div></div></div>`).join('')}
      <div class="lsub">Dokumente · optional</div><div class="docs">${it.docs?`<div class="dfile">${I('file')}Lieferschein.pdf</div>`:''}<div class="dadd" data-wdoc>${I('plus')}</div></div>
      <div class="freeze-box">${I('camera')}Foto ist <b>keine Pflicht</b> (Owner-Entscheidung 20.09.). Ohne Eingangsfoto wird der Auftrag angelegt, erscheint aber als rote Kachel „Foto fehlt" bei Rolf und Phillip, bis das Foto da ist. Am Desktop: Datei wählen oder QR ans Tablet übergeben.</div>`;
  } else if(it.step===4){
    const f=it.fin||(it.fin={termin:'Fr · 24.07.2026',mode:c.versand.startsWith('Versand')?'versand':'abholung',zahlung:c.zahl||(c.pref.includes('Vorkasse')?'vorkasse':'rechnung'),express:false,eing:EING[0]});
    body=`<div class="fgrid"><div class="fg"><label class="flabel">Liefertermin</label><input class="inp" data-wfin="termin" value="${esc(f.termin)}"></div>
      <div class="fg"><label class="flabel">Express</label><div class="setrow" style="padding:8px 0;border:none"><div><div class="sk">Express-Zuschlag</div><div class="ss">Termin vor Standard-Durchlauf</div></div><button class="sw${f.express?' on':''}" data-wexpress></button></div></div></div>
      <div class="freeze-box" style="margin-bottom:12px">${I('user')}Vorbelegt aus dem Kundenprofil von <b>${c.short}</b> (${c.versand}${c.zahl?' · '+c.zahl:''}) — nur bei Abweichung ändern.</div>
      <div class="fg"><label class="flabel">Eingangsart</label><div class="surf-chips">${EING.map(e=>`<button class="schip${f.eing===e?' on':''}" data-weing="${e}">${e}</button>`).join('')}</div></div>
      <div class="fg"><label class="flabel">Rückweg</label><div class="surf-chips"><button class="schip${f.mode==='abholung'?' on':''}" data-wmode="abholung">${I('user')}Abholung</button><button class="schip${f.mode==='versand'?' on':''}" data-wmode="versand">${I('truck')}Versand DHL</button></div></div>
      <div class="fg"><label class="flabel">Zahlung</label><div class="surf-chips"><button class="schip${f.zahlung==='rechnung'?' on':''}" data-wzahl="rechnung">auf Rechnung</button><button class="schip${f.zahlung==='vorkasse'?' on':''}" data-wzahl="vorkasse">${I('lock')}Vorkasse</button><button class="schip${f.zahlung==='uebergabe'?' on':''}" data-wzahl="uebergabe">bei Übergabe (Mollie)</button></div></div>
      ${f.zahlung==='vorkasse'?`<div class="freeze-box">${I('lock')}Vorkasse: Versand-Schritt in der Auftragskarte bleibt gesperrt, bis die Zahlung erfasst ist.</div>`:''}
      ${f.mode==='versand'&&!(c.str)?`<div class="freeze-box" style="border-color:var(--ral-bd);background:var(--ral-bg);color:var(--ral-fg)">${I('alert')}Versand gewählt, aber beim Kunden fehlt die Straße. Vor dem Versand wird die Adresse Pflicht — <a data-act="kunde-edit" data-kid="${c.id}" style="text-decoration:underline;cursor:pointer">jetzt ergänzen</a>.</div>`:''}
      <div class="fg" style="margin-top:12px"><label class="flabel">Notiz zum Auftrag · optional</label><textarea class="note-input" rows="2" data-wfin="note" placeholder="Absprache, Glanzgrad, Besonderheiten …">${esc(f.note||'')}</textarea></div>`;
  } else {
    const o=ORD[it.created];
    body=`<div class="rcpt"><div class="rl">Eingang angenommen</div><div class="rn">${o.id}</div><div class="rs">${c.name} · ${o.teile.length} Positionen · ${o.mode==='versand'?'Versand':'Abholung'} · ${o.termin}</div>
      <div class="readback"><b>Rückles-Check:</b> ${o.teile.map(t=>`${t.q} ${t.n} (${t.m}${t.zust?' · '+t.zust:''})`).join(' · ')}. ${o.eing||''}. Rückweg <b>${o.mode==='versand'?'Versand DHL':'Abholung'}</b>, Zahlung ${o.zahlung==='vorkasse'?'<b>Vorkasse</b>':o.zahlung==='uebergabe'?'<b>bei Übergabe</b>':'<b>auf Rechnung</b>'}${o.express?' · <b>Express</b>':''}. Fotos: ${o.teile.filter(t=>t.foto).length}/${o.teile.length}${o.teile.some(t=>!t.foto)?' — <b style="color:var(--ral-fg)">Foto fehlt → Kachel bei Rolf/Phillip</b>':' ✓'}.</div></div>
      <div class="qa-grid" style="margin-top:14px"><button class="qa primary" data-act="labels" data-oid="${o.id}">${I('tag')}<span class="ql">Etiketten je Teil + Laufzettel drucken</span></button><button class="qa" data-go="#/auftrag/${o.id}">${I('open')}<span class="ql">Auftragskarte öffnen</span></button><button class="qa" data-act="mail" data-oid="${o.id}">${I('mail')}<span class="ql">Eingangsbestätigung mailen</span></button><button class="qa succ" data-wiz-reset>${I('inbox')}<span class="ql">Nächster Eingang</span></button></div>`;
  }

/* ---------- Router ---------- */
function render(){
  let h=location.hash||'#/start'; S.hash=h;
  const [path,qs]=h.slice(2).split('?'); const seg=path.split('/'); const p=seg[0]||'start', arg=decodeURIComponent(seg[1]||''); const params=Object.fromEntries(new URLSearchParams(qs||''));
  let html;
  if(!S.auth){ html=pgStart(); if(p!=='start'){ S.after=h; } }
  else if(!S.role&&p!=='role'){ location.hash='#/role'; return; }
  else switch(p){
    case 'start': location.hash=S.role?ROLE[S.role].home:'#/role'; return;
    case 'role': html=pgRole(); break;
    case 'tag': html=pgTag(); break;
    case 'werkstatt': html=pgWerkstatt(); break;
    case 'auftraege': if(!['alle','angenommen','galvanik','fertig','woche','raus'].includes(S.filter)) S.filter='alle'; html=pgAuftraege(); break;
    case 'auftrag': html=pgAuftrag(arg); break;
    case 'kunden': html=pgKunden(); break;
    case 'kunde': html=pgKunde(arg); break;
    case 'geld': if(!['alle','offen','ueber','bez'].includes(S.filter)) S.filter='alle'; html=pgGeld(); break;
    case 'rechnung': html=pgRechnung(arg); break;
    case 'eingang': if(params.k&&S.intake.kid!==params.k&&S.intake.step<5){ wizReset(params.k); }  html=pgEingang(); break;
    case 'ware-raus': html=pgWareRaus(); break;
    case 'suche': html=pgSuche(); break;
    case 'einstellungen': html=pgEinstellungen(); break;
    case 'mehr': html=pgMehr(); break;
    default: html=shell(`<div class="empty big">${I('alert')}<div class="et">Seite „${esc(p)}" gibt es nicht</div><div class="es">Fail-closed: kein „kommt bald", keine leere Hülle.</div><button class="btn btn-primary" data-go="${ROLE[S.role].home}">Zur Startseite</button></div>`);
  }
  root.innerHTML=html;
  document.querySelector('[data-pv-route]').textContent=h; document.querySelector('[data-pv-role]').textContent='Rolle: '+(S.role?ROLE[S.role].name+' · '+ROLE[S.role].roleLbl:'—');
  const c=document.getElementById('content'); if(c&&!S.keepScroll) c.scrollTop=0; S.keepScroll=false;
  const sq=root.querySelector('[data-sq]'); if(sq&&S.focusQ){ sq.focus(); sq.setSelectionRange(sq.value.length,sq.value.length); S.focusQ=false; }
}

        if(!OV.edit&&!OV.force){ const dup=findDup(v('name'),v('tel'),v('mail')); if(dup){ sheet.querySelector('[data-dupbox]').innerHTML=`<div class="freeze-box" style="border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn-fg);margin-bottom:12px">${I('alert')}<b>Möglicherweise schon vorhanden:</b> ${dup.name} · ${dup.id} · ${dup.ort} · ${dup.tel}<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm btn-primary" data-dup-use="${dup.id}">Bestehenden verwenden</button><button class="btn btn-sm" data-dup-force>Trotzdem neu anlegen</button></div></div>`; return; } }
        if(OV.edit){ const c=CUST[OV.edit]; Object.assign(c,{name:v('name'),ort:v('ort'),tel:v('tel')||c.tel,mail:v('mail')||c.mail,ap:v('ap'),str:v('str'),plz:v('plz'),pref:v('pref'),versand:OV.versand,zahl:OV.zahl}); c.short=c.name.split(' ')[0]; closeSheet(); rerender(); showToast('Kunde gespeichert'); } else { const id='K-2026-00'+(seqK++); CUST[id]={id,name:v('name'),short:v('name').split(' ')[0],sub:`${OV.typ} · neu angelegt`,ort:v('ort')||'—',ap:v('ap'),str:v('str'),plz:v('plz'),tel:v('tel')||'—',mail:v('mail')||'—',klasse:OV.typ==='Lead'?'Lead':'Neu',versand:OV.versand,zahl:OV.zahl,pref:v('pref'),tags:[],facts:[],notes:[],profil:[],hist:[],kontakt:[['info','user','heute','Kunde angelegt']]}; closeSheet(); if(S.hash.startsWith('#/eingang')){ S.intake.kid=id; S.intake.step=2; render(); } else go('#/kunde/'+id); showToast(`Kunde <b>${id}</b> angelegt`); } break; }
      case 'teilneu': { const o=ORD[OV.oid]; const n=sheet.querySelector('[data-ovname]').value.trim(); if(!n){ showToast('Bezeichnung fehlt.'); return; } const id='T-'+String(o.teile.length+1).padStart(2,'0'); o.teile.push({id,n,m:`${sheet.querySelector('[data-ovmat]').value} → ${OV.surf.join(' + ')||'offen'}`,q:OV.q+' Stück',done:false,foto:false}); o.sub=o.sub.replace(/\d+ Teile?/,o.teile.length+' Teile'); pushV(o,['info','plus',nowLbl(),`${id} ${n} hinzugefügt`,ROLE[S.role].name]); closeSheet(); rerender(); showToast(`<b>${id}</b> angelegt · Foto fehlt noch`); break; }
      case 'rneu': { const o=ORD[OV.oid]; const id='R-2026-0'+(seqR++); INV[id]={id,oid:o.id,kid:o.kid,datum:new Date().toLocaleDateString('de-DE'),betrag:OV.betrag,status:'offen',faellig:o.zahlung==='vorkasse'?'Vorkasse':'in 14 Tagen',pos:OV.pos}; pushV(o,['info','receipt',nowLbl(),`Rechnung ${id} erstellt · ${fmt(OV.betrag)}`,'aus Freeze']); closeSheet(); go('#/rechnung/'+id); showToast(`Rechnung <b>${id}</b> erstellt`); break; }
      case 'rekla': { const o=ORD[OV.oid]; const id='A-2026-00'+(seqA++); ORD[id]={...o,id,stage:'angenommen',bezahlt:false,express:true,termin:'schnellstmöglich',rel:'Reklamation',urgent:true,titel:o.titel+' · Nacharbeit',sub:'Reklamation · '+OV.grund,teile:o.teile.map(t=>({...t,done:false,mehr:undefined,note:undefined})),next:['Nacharbeit prüfen · '+OV.grund,note||''],notes:[{scope:'order',l:'Reklamation · '+OV.grund,t:esc(note||'—'),m:who}],docs:0,kv:null,verlauf:[['warn','alert',nowLbl(),`Reklamation zu ${o.id} · ${OV.grund}`,ROLE[S.role].name]]}; pushV(o,['warn','alert',nowLbl(),`Reklamation · Nacharbeit ${id} angelegt`,OV.grund]); cust(o).kontakt.unshift(['warn','alert','heute',`Reklamation ${o.id} · ${OV.grund}`]); cust(o).tags.push('Reklamation'); closeSheet(); go('#/auftrag/'+id); showToast(`Nacharbeit <b>${id}</b> angelegt`); break; }
      case 'kv': { const o=ORD[OV.oid||oidR]; o.kv=o.kv||`KV-${o.id.slice(2)}.pdf`; pushV(o,['info','file',nowLbl(),'KV versendet · wartet auf Freigabe','an '+cust(o).mail]); cust(o).kontakt.unshift(['info','file','heute',`KV ${o.id} versendet`]); closeSheet(); rerender(); showToast('KV gesendet'); break; }
      case 'abspr': { const c=CUST[OV.kid]; if(!note){ showToast('Text fehlt.'); return; } c.facts.push([OV.kat==='Verpackung'?'package':OV.kat==='Preisabsprache'||OV.kat==='Zahlung'?'file':'tool',OV.kat,esc(note)]); closeSheet(); rerender(); showToast('Absprache gespeichert'); break; }
      case 'tag': { const c=CUST[OV.kid]; const v=sheet.querySelector('[data-ovname]').value.trim(); if(v&&!c.tags.includes(v)) c.tags.push(v); closeSheet(); rerender(); showToast(v?`Tag <b>${esc(v)}</b> hinzugefügt`:'Kein Tag'); break; }
      default: closeSheet(); showToast('Gespeichert');
    } return; }
  /* Sonstige Aktionen */
  if('act' in d){ const oid=d.oid||oidR; const kid=d.kid||(S.hash.startsWith('#/kunde/')?decodeURIComponent(S.hash.split('/')[2]):null);
    switch(d.act){
      case 'teil-neu': ovTeilNeu(oid); break;
      case 'notiz': ovNotiz(oid); break;
      case 'korrektur': closeSheet(); ovKorrektur(oid,d.iid); break;
      case 'galerie': ovGalerie(oid); break;
      case 'foto': { const o=ORD[oid]; const p=d.pid?o.teile.find(x=>x.id===d.pid):o.teile.find(x=>!x.foto); if(p&&!p.foto){ p.foto=true; pushV(o,['succ','camera',nowLbl(),`Foto für ${p.id} (${p.n}) aufgenommen`,ROLE[S.role].name]); if(o.teile.every(x=>x.foto)&&o.stage==='angenommen') o.next=['In Galvanik anstoßen','Alle Fotos da.']; if(o.id==='A-2026-0042'&&p.id==='T-03'){ o.next=['Weiter in Galvanik','Foto T-03 ist da.']; o.urgent=false; } } o.docs++; closeSheet(); rerender(); showToast(`${I('camera')} Foto gespeichert${p?' · <b>'+p.id+'</b>':''}`); break; }
      case 'mail': ovMail(oid,d.iid); break;
      case 'erinnerung': { const i=INV[d.iid]; ovMail(i.oid,i.id); break; }
      case 'anruf': { const o=ORD[oid]; const c=o?cust(o):CUST[kid]; c.kontakt.unshift(['info','phone',nowLbl(),'Anruf gestartet']); showToast(`${I('phone')} Anruf <b>${c.tel}</b> · Gerät wählt`,'Telefonnotiz',()=>ovNotiz(oid,c.id,true)); break; }
      case 'kv': ovKV(oid); break;
      case 'rechnung-neu': ovRechnungNeu(d.oid); break;
      case 'rekla': ovRekla(oid); break;
      case 'dup': { const o=ORD[oid]; const id='A-2026-00'+(seqA++); ORD[id]={...o,id,stage:'angenommen',bezahlt:false,express:false,termin:'offen',rel:'neu · Vorlage '+o.id,urgent:false,teile:o.teile.map(t=>({...t,done:false,foto:false,mehr:undefined,note:undefined})),next:['Zustandsfotos aufnehmen','Vorlage aus '+o.id+' — Teile prüfen.'],notes:[],docs:0,kv:null,verlauf:[['info','copy',nowLbl(),`Aus ${o.id} dupliziert`,ROLE[S.role].name]]}; go('#/auftrag/'+id); showToast(`<b>${id}</b> aus Vorlage angelegt`); break; }
      case 'tag': ovTag(kid); break;
      case 'telefonnotiz': ovNotiz(null,kid,true); break;
      case 'absprache': ovAbsprache(kid); break;
      case 'hist': showToast('Filter Oberfläche · Prototyp'); break;
      case 'ref': showToast('Referenz kopiert'); break;
      case 'kunde-edit': ovKundeNeu(kid); break;
      case 'kunde-neu': ovKundeNeu(null, S.hash.startsWith('#/eingang')?S.intake.q:''); break;
      case 'export': showToast(`${I('download')} Export <b>DATEV-CSV</b> · ${Object.keys(INV).length} Buchungen · Datei gespeichert`); break;
      case 'pdf': showToast(`${I('file')} PDF erzeugt · Vorlage Kreile`); break;
      case 'print': showToast(`${I('file')} Laufzettel gedruckt`); break;
      case 'labels': { const o=ORD[oid]; showToast(`${I('tag')} <b>${o.teile.length} Etiketten</b> (${o.id}/T-01…) + Laufzettel gedruckt`); pushV(o,['info','tag',nowLbl(),`Etiketten je Teil und Laufzettel gedruckt`,ROLE[S.role].name]); break; }
      case 'scan': showToast(`${I('scan')} Kamera (Gerät) · QR auf Laufzettel scannen`); break;
      case 'pin': ovPin(d.user); break;
      case 'user-neu': ovPin('Neue Person'); break;
      case 'edit-satz': ovSatz(); break;
      case 'edit-katalog': ovKatalog(); break;
      case 'edit-betrieb': ovBetrieb(); break;
      default: showToast(`Aktion „${d.act}" · Prototyp`);
    } return; }
  /* Eingang-Wizard */
  if('wiz' in d){ S.intake.step=+d.wiz; return render(); }
  if('wizCancel' in d){ wizReset(); go(ROLE[S.role].home); return; }
  if('wizReset' in d){ wizReset(); return render(); }
  if('wizFinish' in d){ wizFinish(); return; }
  if('wsurf' in d){ const f=S.intake.form; const i=f.surf.indexOf(d.wsurf); i>=0?f.surf.splice(i,1):f.surf.push(d.wsurf); t.classList.toggle('on'); return; }
  if('wqStep' in d){ const f=S.intake.form; f.q=Math.max(1,f.q+ +d.wqStep); t.parentElement.querySelector('.stval').textContent=f.q; return; }
  if('posAdd' in d){ const f=S.intake.form; if(!f.n.trim()){ showToast('Bezeichnung fehlt.'); sheet; return; } S.intake.pos.push({n:f.n.trim(),q:f.q,mat:f.mat,surf:[...f.surf],zust:[...(f.zust||[])],fotos:0}); S.intake.form={n:'',q:1,mat:f.mat,surf:[...f.surf],zust:[]}; return rerender(); }
  if('posRm' in d){ S.intake.pos.splice(+d.posRm,1); return rerender(); }
  if('wfoto' in d){ const p=S.intake.pos[+d.wfoto]; p.fotos=(p.fotos||0)+1; rerender(); showToast(`${I('camera')} ${d.wart||'Foto'} für T-${String(+d.wfoto+1).padStart(2,'0')} gespeichert · Original zuerst gesichert`); return; }
  if('wdoc' in d){ S.intake.docs=1; rerender(); showToast('Dokument angehängt'); return; }
  if('wexpress' in d){ S.intake.fin.express=!S.intake.fin.express; t.classList.toggle('on'); return; }
  if('wmode' in d){ S.intake.fin.mode=d.wmode; return rerender(); }
  if('wzahl' in d){ S.intake.fin.zahlung=d.wzahl; return rerender(); }
});
document.addEventListener('input',e=>{ const t=e.target; const d=t.dataset;
  if('qin' in d||'kq' in d){ if('kq' in d) S.kq=t.value; else S.q=t.value; S.keepScroll=true; render(); const i=root.querySelector('kq' in d?'[data-kq]':'[data-qin]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } return; }
  if('sq' in d){ S.q=t.value; S.focusQ=true; rerender(); return; }
  if('wq' in d){ S.intake.q=t.value; S.keepScroll=true; render(); const i=root.querySelector('[data-wq]'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); return; }
  if('wf' in d){ S.intake.form[d.wf]=t.value; return; }
  if('wfin' in d){ S.intake.fin[d.wfin]=t.value; return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); root.querySelector('[data-amenu-box].open')?.classList.remove('open'); } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.auth&&S.role){ e.preventDefault(); S.focusQ=true; go('#/suche'); } if(!S.auth&&/^[0-9]$/.test(e.key)){ document.querySelector(`[data-pin="${e.key}"]`)?.click(); } if(!S.auth&&e.key==='Backspace'){ document.querySelector('[data-pin="clr"]')?.click(); } });
document.querySelector('[data-toast]').addEventListener('mouseenter',()=>clearTimeout(toastTimer));

/* ---------- Init ---------- */
S.auth=false; S.after=null;
const w=window.innerWidth; const dev=w>=1100?'desktop':w>=760?'tablet':'phone';
document.querySelectorAll('[data-dev]').forEach(b=>b.classList.toggle('on',b.dataset.dev===dev)); S.dev=dev; app.className='app dev-'+dev;
if(!location.hash) location.hash='#/start';
render();
</script>
