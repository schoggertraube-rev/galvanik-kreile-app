name: agentur-gate

on:
  pull_request:
    branches:
      - main
      - feature/capture-auth-tenant
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  agentur-gate:
    name: agentur-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check mojibake
        shell: bash
        run: |
          if [ -f scripts/check-mojibake.mjs ]; then
            node scripts/check-mojibake.mjs
          else
            echo "mojibake script absent on this branch, skipping"
          fi

      - name: Check delivery contracts and rolling queue
        run: |
          npm run quality:delivery-contracts:selftest
          npm run quality:delivery-contracts

      - name: Type-check
        run: npx tsc --noEmit

      - name: H16 rights and identity contracts
        run: |
          npm run quality:h16-eslint-contracts:selftest
          npm run quality:h16-eslint-contracts

      - name: H18 Server Action write contracts
        run: |
          npm run quality:h18-server-actions:selftest
          npm run quality:h18-server-actions

      - name: Run unit tests
        run: npm run test:unit

  h16-schema:
    name: h16-schema
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Replay every migration on an empty local database
        run: |
          npm run quality:supabase-cli
          ./node_modules/.bin/supabase start
          ./node_modules/.bin/supabase db reset --local --no-seed

      - name: Run the named H12 F0/F2 SQL contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          npm run quality:f0-f2-schema
          npm run quality:f0-f2-schema:selftest

      - name: H18 real Server Actions against replay DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          H18_EXPECTED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: npx vitest run src/test/h18_settings_actions.integration.test.ts src/test/h18_settings_client.integration.test.tsx src/test/h18_invoice_actions.integration.test.ts src/test/h18_quote_actions.integration.test.ts src/test/h18_customer_actions.integration.test.ts src/test/h18_workshop_actions.integration.test.ts src/test/h18_masterdata_actions.integration.test.ts src/test/h18_order_admin_actions.integration.test.ts --maxWorkers=1 --no-file-parallelism

      - name: Acceptance tests against replay DB (all packages)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          H18_EXPECTED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: npx vitest run src/test/acceptance/ --passWithNoTests --maxWorkers=1 --no-file-parallelism

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(node -e 'const p=require("./package-lock.json"); process.stdout.write(p.packages["node_modules/@playwright/test"].version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo "Playwright installation failed; retrying once."
          done

      - name: Generated BAUPLAN flows against replay DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlLWRlbW8iLCJyb2xlIjoiYW5vbiIsImV4cCI6MTk4MzgxMjk5Nn0.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          APP_SESSION_SECRET: generated-flow-tests-local-only
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          npm run build
          node scripts/spec/generate-flow-tests.mjs --check
          npx playwright test -c e2e/generated/playwright.config.ts

      - name: Stop local database
        if: always()
        run: ./node_modules/.bin/supabase stop --no-backup
