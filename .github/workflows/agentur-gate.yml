name: agentur-gate

on:
  pull_request:
    branches:
      - main
      - feature/capture-auth-tenant
  push:

permissions:
  contents: read

jobs:
  agentur-gate:
    name: agentur-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check mojibake
        shell: bash
        run: |
          if [ -f scripts/check-mojibake.mjs ]; then
            node scripts/check-mojibake.mjs
          else
            echo "mojibake script absent on this branch, skipping"
          fi

      - name: Check delivery contracts and rolling queue
        run: |
          npm run quality:delivery-contracts:selftest
          npm run quality:delivery-contracts

      - name: Type-check
        run: npx tsc --noEmit

      - name: H16 rights and identity contracts
        run: |
          npm run quality:h16-eslint-contracts:selftest
          npm run quality:h16-eslint-contracts

      - name: Run unit tests
        run: npm run test:unit

  h16-schema:
    name: h16-schema
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Replay every migration on an empty local database
        run: |
          npm run quality:supabase-cli
          ./node_modules/.bin/supabase start
          ./node_modules/.bin/supabase db reset --local --no-seed

      - name: Run the named H12 F0/F2 SQL contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          npm run quality:f0-f2-schema
          npm run quality:f0-f2-schema:selftest

      - name: Stop local database
        if: always()
        run: ./node_modules/.bin/supabase stop --no-backup
