name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      SUPABASE_URL: https://example.supabase.co
      DATABASE_URL: postgres://user:pass@127.0.0.1:5432/db

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine Node version
        id: node-version
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(pkg.engines?.node ?? '')")"
          if [ -z "$node_version" ]; then
            node_version="24"
          fi
          echo "version=$node_version" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Supabase CLI and immutable W4 source anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(npx --yes supabase@2.111.0 --version)" = "2.111.0"
          echo "7d3a6d679e8e32e064297901d43fe2eacfe2a7681e408a76206a85ef6c2e4fcb  docs/evidence/f0/PROD_FINGERPRINT_REFERENCE.txt" | sha256sum --check --strict
          echo "175b8ca9f8b964532ef8ad6a5cff710fcea833874ceb5f7b1f7cf358f5a1357d  scripts/schema-parity-catalog.sql" | sha256sum --check --strict
          echo "814c888d0d9b25fdc7fdd066eddc9c34887e07fe839bc2702e6250e3a004f315  docs/evidence/f0/hardening/f0_schema_fingerprint.sql" | sha256sum --check --strict
          echo "060de7673beef3d9eaa73289dc04159e262137e23bb437354dccffd363696d4b  scripts/schema-parity-inventory.json" | sha256sum --check --strict

      - name: W4 candidate checker mutation-free selftest
        run: |
          node scripts/quality/check-w4-candidate-schema.mjs --selftest
          node scripts/quality/check-w4-cross-module-read-ports.mjs --selftest
          node scripts/quality/check-w4-cross-module-read-ports.mjs --check

      - name: Resolve diff range
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Production migration ledger contract
        run: node scripts/check-migration-ledger.mjs --base "${{ steps.diff.outputs.base }}"

      - name: F1-R0 No-fake-production gate selftest (proves rules fire, mutation-free)
        run: node scripts/quality/check-no-fake-production.mjs --selftest

      - name: F1-R0 No-fake-production gate (blocking)
        # Blocking invariant: both counters must remain zero and the frozen F1.1
        # evidence binding must keep ACTIVE_CAPABILITY_REAL_E2E at PASS.
        run: node scripts/quality/check-no-fake-production.mjs

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Full ESLint (lint:full, BF-013)
        run: npm run lint:full

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Auth boundary E2E
        run: npm run test:e2e -- e2e/smoke.spec.ts

      - name: ESLint on changed TS and TSX files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ steps.diff.outputs.base }}" "${{ steps.diff.outputs.head }}" -- '*.ts' '*.tsx')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed TS/TSX files to lint."
            exit 0
          fi
          npx eslint --max-warnings 0 "${files[@]}"

      - name: Repository ESLint ratchet
        shell: bash
        run: |
          set -euo pipefail
          ratchet_config="$RUNNER_TEMP/eslint-ratchet-frozen-r0.mjs"
          cat > "$ratchet_config" <<'EOF'
          import { pathToFileURL } from "node:url";

          const canonicalConfig = (
            await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/eslint.config.mjs`).href)
          ).default;

          export default [
            ...canonicalConfig,
          ];
          EOF

          node --import tsx scripts/quality/check-eslint-ratchet.ts \
            --config "$ratchet_config" \
            --base "${{ steps.diff.outputs.base }}"

      - name: F0 doc truth gate
        run: node scripts/quality/check-f0-doc-truth.mjs

      - name: F0 doc truth gate selftest (proves the gate rules themselves fire, GOV-06d)
        run: node scripts/quality/check-f0-doc-truth.mjs --selftest

      - name: Supabase client boundary
        run: node scripts/quality/check-supabase-client-boundary.mjs

      - name: Whitespace and merge marker check
        run: git diff --check "${{ steps.diff.outputs.base }}" "${{ steps.diff.outputs.head }}"

      - name: Forbidden pattern gate
        run: node scripts/quality/check-forbidden-patterns.mjs --base "${{ steps.diff.outputs.base }}" --head "${{ steps.diff.outputs.head }}"

      - name: Runtime dependency audit (persisted artifact, BF-013, kein Fail-Gate)
        if: always()
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit-omit-dev.json || true
          node -e "
            const fs = require('node:fs');
            let v = {};
            try {
              const data = JSON.parse(fs.readFileSync('npm-audit-omit-dev.json', 'utf8'));
              v = data.metadata?.vulnerabilities ?? {};
            } catch (e) {
              console.error('npm-audit-omit-dev.json nicht parsebar:', e.message);
            }
            const sev = ['critical','high','moderate','low','info'];
            const counts = sev.map((s) => \`\${s}=\${v[s] ?? 0}\`).join(' ');
            console.log('NPM_AUDIT_OMIT_DEV_SEVERITY_COUNTS ' + counts + ' total=' + (v.total ?? 0));
          "

      - name: Upload runtime audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit
          path: npm-audit-omit-dev.json
          if-no-files-found: warn

  fresh-supabase-replay:
    name: Fresh Supabase replay
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Supabase CLI and immutable W4 source anchors before DB start
        shell: bash
        run: |
          set -euo pipefail
          test "$(npx --yes supabase@2.111.0 --version)" = "2.111.0"
          echo "7d3a6d679e8e32e064297901d43fe2eacfe2a7681e408a76206a85ef6c2e4fcb  docs/evidence/f0/PROD_FINGERPRINT_REFERENCE.txt" | sha256sum --check --strict
          echo "175b8ca9f8b964532ef8ad6a5cff710fcea833874ceb5f7b1f7cf358f5a1357d  scripts/schema-parity-catalog.sql" | sha256sum --check --strict
          echo "814c888d0d9b25fdc7fdd066eddc9c34887e07fe839bc2702e6250e3a004f315  docs/evidence/f0/hardening/f0_schema_fingerprint.sql" | sha256sum --check --strict
          echo "060de7673beef3d9eaa73289dc04159e262137e23bb437354dccffd363696d4b  scripts/schema-parity-inventory.json" | sha256sum --check --strict
          node scripts/quality/check-w4-candidate-schema.mjs --selftest
          node scripts/quality/check-w4-cross-module-read-ports.mjs --selftest
          node scripts/quality/check-w4-cross-module-read-ports.mjs --check

      - name: Start isolated local Supabase stack (Postgres + Storage + Auth, BF-007)
        # War vorher "supabase db start" (nur Postgres-Container). BF-007 braucht die echte
        # Storage-REST-API (scripts/quality/f0-storage-http-tests.mjs) und liest deren Keys zur
        # Laufzeit aus "supabase status -o env" - dieser Befehl liefert API_URL/ANON_KEY/
        # SERVICE_ROLE_KEY nur fuer Dienste, die tatsaechlich laufen. "db start" startet nur
        # Postgres; erst der volle "start" bringt Storage/Auth/Kong mit hoch (CI-Fund
        # 2026-08-10-Zyklus-2: "status -o env" lieferte nur DB_URL, storage-http-tests.mjs
        # brach mit FATAL ab). Alle anderen Schritte in diesem Job sprechen ohnehin nur die
        # Postgres-DB direkt an und sind von den zusaetzlich laufenden Diensten unberuehrt.
        run: npx --yes supabase@2.111.0 start

      - name: Capture isolated local Supabase runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="$(mktemp)"
          npx --yes supabase@2.111.0 status -o env > "$runtime_env"
          set -a
          source "$runtime_env"
          set +a
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Replay exact Production cutoff from zero without seed
        run: npx --yes supabase@2.111.0 db reset --local --no-seed --version 20260810100000

      - name: Capture exact 9-migration Production-cutoff catalog and 11-component fingerprint
        run: |
          node scripts/quality/check-w4-candidate-schema.mjs --capture \
            --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            --catalog w4-baseline.catalog --fingerprint w4-baseline-fingerprint.json --ledger w4-baseline-ledger.json

      - name: Existing Production fingerprint comparator against exact Production cutoff
        shell: bash
        run: |
          set -euo pipefail
          FP_BASELINE="$(node -e "const f=require('./w4-baseline-fingerprint.json'); process.stdout.write(['cols','idx','cons','trig','func','pol','rls','grants','func_grants','def_privs','viewopts'].map(k=>f[k]).join('|'))")"
          node scripts/quality/fingerprint-compare.mjs "$FP_BASELINE" docs/evidence/f0/PROD_FINGERPRINT_REFERENCE.txt | tee replay-baseline-fingerprint.txt

      - name: Replay exact 13-migration W4 candidate from zero without seed
        run: npx --yes supabase@2.111.0 db reset --local --no-seed --version 20260812103446

      - name: Capture and check exact W4 candidate catalog, ledger, and fingerprint
        run: |
          node scripts/quality/check-w4-candidate-schema.mjs --capture \
            --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            --catalog w4-candidate.catalog --fingerprint w4-candidate-fingerprint.json --ledger w4-candidate-ledger.json
          node scripts/quality/check-w4-candidate-schema.mjs --materialize-contract \
            --baseline-catalog w4-baseline.catalog --candidate-catalog w4-candidate.catalog \
            --baseline-fingerprint w4-baseline-fingerprint.json --candidate-fingerprint w4-candidate-fingerprint.json \
            --ledger w4-candidate-ledger.json --output w4-runtime-contract.json
          cmp --silent docs/evidence/f0/W4_CANDIDATE_SCHEMA_CONTRACT.json w4-runtime-contract.json
          node scripts/quality/check-w4-candidate-schema.mjs --check \
            --baseline-catalog w4-baseline.catalog --candidate-catalog w4-candidate.catalog \
            --baseline-fingerprint w4-baseline-fingerprint.json --candidate-fingerprint w4-candidate-fingerprint.json \
            --ledger w4-candidate-ledger.json
          node scripts/quality/check-w4-candidate-schema.mjs --selftest

      - name: Replay F1.2 candidate fresh from zero without seed
        # Complete F1.2-candidate replay: integral F1.2 schema through 20260817120000.
        # Baseline and separate W4/production fingerprint anchors remain immutable.
        run: npx --yes supabase@2.111.0 db reset --local --no-seed --version 20260817120000

      - name: W3/F1.2 order-station command, receipt, and private read-model integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          W3_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          W4_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: npx vitest run src/test/w3_order_station.integration.test.ts

      - name: M1-source-compatible 14-migration W4-03 replay
        run: npx --yes supabase@2.111.0 db reset --local --no-seed --version 20260812133649

      - name: W4-03 Galvanik handoff attachment real DB, View, Actions, Panel, and Storage HTTP
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          W4_ATTACHMENT_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          W4_SOURCE_SHA="ef9a8411cad56b968dcbe97b089260d38c67f7d5"
          CURRENT_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "${W4_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$W4_SOURCE_SHA" "$CURRENT_SOURCE_SHA"

          w4_source="$(mktemp -d)"
          git archive "$W4_SOURCE_SHA" | tar -x -C "$w4_source"
          W4_TEST_PATH="src/test/w4_order_station_attachment.integration.test.ts"
          W4_TEST_BLOB="d2e7d4346114c9dd14649003939a3ef9182a53bd"
          git cat-file -e "${W4_SOURCE_SHA}:${W4_TEST_PATH}"
          actual_w4_test_blob="$(git rev-parse "${CURRENT_SOURCE_SHA}:${W4_TEST_PATH}")"
          test "$actual_w4_test_blob" = "$W4_TEST_BLOB"
          overlay_tmp="$w4_source/.w4-test-overlay.tmp"
          git cat-file blob "$actual_w4_test_blob" > "$overlay_tmp"
          test "$(git hash-object "$overlay_tmp")" = "$W4_TEST_BLOB"
          mv "$overlay_tmp" "$w4_source/$W4_TEST_PATH"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$w4_source/node_modules"
          cd "$w4_source"
          "$GITHUB_WORKSPACE/node_modules/.bin/vitest" run \
            src/test/w4_order_station_attachment.integration.test.ts

      - name: F1.3 candidate replay fresh from zero without seed
        # Complete F1.3-candidate replay: integral F1.3 schema through 20260820143000.
        # Enables F1.3 integration tests against foundation ports and live card.
        run: npx --yes supabase@2.111.0 db reset --local --no-seed --version 20260820143000

      - name: F1.3 foundation ports and live card integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          F1_3_EXPECTED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: npx vitest run src/test/f1_3_foundation_ports.integration.test.ts src/test/f1_3_live_card.integration.test.ts

      - name: Persist W4 candidate fingerprint artifact
        run: |
          node -e "const f=require('./w4-candidate-fingerprint.json'); console.log(JSON.stringify(f))" | tee replay-fingerprint.txt

      - name: F0 negative + inventory tests (grant-denial, rls-contract, storage, view)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/quality/f0_negative_tests.sql

      - name: BF-008 tenant coverage check (F0_TENANT_COVERAGE.json vs live)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/quality/check-tenant-coverage.mjs

      - name: BF-007 storage HTTP negative matrix (S1-S12, real Storage API)
        run: node scripts/quality/f0-storage-http-tests.mjs

      - name: DB integration tests against replay DB
        # NUR scan_order.integration.test.ts: es mockt @/lib/server/authorization vollstaendig.
        # verify.integration.test.ts ruft transitionOrderProcess/createCustomerDb OHNE Mock auf; die
        # Kette resolveAuthorization -> readAppSession -> cookies() (next/headers) wirft ausserhalb eines
        # echten Next.js-Request-Scopes ("cookies was called outside a request scope"), abgefangen als
        # AUTH_ERROR: Berechtigungen nicht verfuegbar. Vorbestehende Testarchitektur-Grenze, nicht durch
        # diese PR verursacht; siehe PR-Beschreibung "Integration in Replay-CI nicht erreicht, Grund X".
        # Test selbst NICHT veraendert/abgeschwaecht.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          SUPABASE_URL: http://127.0.0.1:54321
        run: npx vitest run src/test/scan_order.integration.test.ts

      - name: BF-006 build (gegen lokale Supabase-Replay-DB, echte Session-Kette)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          SUPABASE_URL: http://127.0.0.1:54321
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          APP_SESSION_SECRET: f0-verify-http-tests-ci-secret-2026-08-10
        run: npm run build

      - name: BF-006 start app (next start -p 3100) + readiness loop
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          SUPABASE_URL: http://127.0.0.1:54321
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          APP_SESSION_SECRET: f0-verify-http-tests-ci-secret-2026-08-10
        run: |
          set -euo pipefail
          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          HOSTNAME=127.0.0.1 PORT=3100 node .next/standalone/server.js > next-start.log 2>&1 &
          echo $! > next-start.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3100/ -o /dev/null; then
              echo "next start ready after ${i}s"
              ready=1
              break
            fi
            pid="$(cat next-start.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "next process exited before readiness: PID=$pid"
              cat next-start.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "next start did not become ready in time"
            cat next-start.log
            exit 1
          fi

      - name: BF-006 verify HTTP tests (real login POST + session cookie + auth boundary)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          BASE_URL: http://127.0.0.1:3100
          APP_SESSION_SECRET: f0-verify-http-tests-ci-secret-2026-08-10
        run: node scripts/quality/f0-verify-http-tests.mjs

      - name: BF-006 stop app
        if: always()
        run: |
          if [ -f next-start.pid ]; then
            kill "$(cat next-start.pid)" 2>/dev/null || true
          fi
          if [ -f next-start.log ]; then
            echo "--- next-start.log (last 100 lines) ---"
            tail -n 100 next-start.log
          fi

      - name: Second exact 13-migration replay and byte-identical W4 captures
        run: |
          set -euo pipefail
          npx --yes supabase@2.111.0 db reset --local --no-seed --version 20260812103446
          node scripts/quality/check-w4-candidate-schema.mjs --capture \
            --database-url postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            --catalog w4-candidate-second.catalog --fingerprint w4-candidate-second-fingerprint.json --ledger w4-candidate-second-ledger.json
          cmp --silent w4-candidate.catalog w4-candidate-second.catalog
          cmp --silent w4-candidate-fingerprint.json w4-candidate-second-fingerprint.json
          cmp --silent w4-candidate-ledger.json w4-candidate-second-ledger.json
          node scripts/quality/check-w4-candidate-schema.mjs --check \
            --baseline-catalog w4-baseline.catalog --candidate-catalog w4-candidate-second.catalog \
            --baseline-fingerprint w4-baseline-fingerprint.json --candidate-fingerprint w4-candidate-second-fingerprint.json \
            --ledger w4-candidate-second-ledger.json
          echo "W4_CANDIDATE_REPLAY_DETERMINISM=PASS"

      - name: Upload W4 candidate fingerprint and catalog evidence
        uses: actions/upload-artifact@v4
        with:
          name: w4-candidate-schema-evidence
          if-no-files-found: error
          path: |
            replay-baseline-fingerprint.txt
            replay-fingerprint.txt
            w4-baseline.catalog
            w4-baseline-fingerprint.json
