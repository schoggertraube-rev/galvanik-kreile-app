name: Product Company Quality Gate
on:
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Unit tests
        run: npm run test:unit --if-present
      - run: npm run build
      - name: Company state check
        run: node company/scripts/company-doctor.mjs
