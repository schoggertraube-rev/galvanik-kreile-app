name: ESLint Ratchet

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: ratchet-base
          persist-credentials: false

      - name: Checkout candidate without credentials
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Determine protected Node version
        id: node-version
        working-directory: ratchet-base
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(pkg.engines?.node ?? '')")"
          if [ -z "$node_version" ]; then
            node_version="24"
          fi
          echo "version=$node_version" >> "$GITHUB_OUTPUT"

      - name: Setup protected Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: ratchet-base/package-lock.json

      - name: Install protected lint dependencies
        working-directory: ratchet-base
        run: npm ci --ignore-scripts

      - name: Enforce protected repository ratchet
        working-directory: ratchet-base
        run: |
          test ! -e "$GITHUB_WORKSPACE/candidate/node_modules"
          ln -s "$GITHUB_WORKSPACE/ratchet-base/node_modules" "$GITHUB_WORKSPACE/candidate/node_modules"
          node --import tsx scripts/quality/check-eslint-ratchet.ts \
            --root "$GITHUB_WORKSPACE/candidate" \
            --config "$GITHUB_WORKSPACE/ratchet-base/eslint.config.mjs" \
            --base-baseline "$GITHUB_WORKSPACE/ratchet-base/quality/eslint-baseline.json"

      - name: Enforce D-GOV-001 authority contract on candidate
        working-directory: ratchet-base
        env:
          AUTHORITY_CHECKER_SHA256_CURRENT: 05d07eeb62e61049ccb1bbcd33b1742a9e53b56c5401bf7b0a3600e4399e80fb
          AUTHORITY_CHECKER_SHA256_NEXT: b3934c8b84e4f04eb6cd412a9b7e303d4b44921d36375a2341ba6091a5681752
          AUTHORITY_SCHEMA_SHA256_CURRENT: 798139c41576c5b6652774ae2268a63286fdd43d7e4d71dcf4732e50f9c1194a
          AUTHORITY_SCHEMA_SHA256_QUEUED: 322018e732ee86ecdd4a0320255b8bd216d7d2281302dff8b149dfbd3a80dbba
          AUTHORITY_SCHEMA_SHA256_NEXT: fc04eaae60c118e51ae66182b687dbf15b80cd726bfce3a81d08ba25d4d1d788
        run: |
          set -euo pipefail

          # Finite transition for the already reviewed KR-10A authority contract.
          # After KR-10A reaches main, a separate cleanup package must collapse these
          # sets back to the final checker and schema hashes only.
          checker="$GITHUB_WORKSPACE/candidate/scripts/quality/check-authoritative-sources.mjs"
          schema="$GITHUB_WORKSPACE/candidate/quality/authoritative-sources.json"

          # `sha256sum` follows symlinks while Node resolves an ESM main module to
          # its real path. Reject both end-point and parent-path symlinks so the
          # hashed checker is necessarily the checker whose main guard executes.
          for guarded in "$checker" "$schema"; do
            if [ ! -f "$guarded" ] || [ "$(readlink -f "$guarded")" != "$guarded" ]; then
              echo "::error::${guarded} must be a real regular file at the expected candidate path"
              exit 1
            fi
          done

          for variable_name in \
            AUTHORITY_CHECKER_SHA256_CURRENT \
            AUTHORITY_CHECKER_SHA256_NEXT \
            AUTHORITY_SCHEMA_SHA256_CURRENT \
            AUTHORITY_SCHEMA_SHA256_QUEUED \
            AUTHORITY_SCHEMA_SHA256_NEXT; do
            variable_value="${!variable_name:-}"
            if ! [[ "$variable_value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::${variable_name} must be a lowercase 64-character SHA-256 value"
              exit 1
            fi
          done

          if [ "$AUTHORITY_CHECKER_SHA256_CURRENT" = "$AUTHORITY_CHECKER_SHA256_NEXT" ]; then
            echo "::error::Authority checker transition pins must be distinct"
            exit 1
          fi

          if [ "$AUTHORITY_SCHEMA_SHA256_CURRENT" = "$AUTHORITY_SCHEMA_SHA256_QUEUED" ] || \
             [ "$AUTHORITY_SCHEMA_SHA256_CURRENT" = "$AUTHORITY_SCHEMA_SHA256_NEXT" ] || \
             [ "$AUTHORITY_SCHEMA_SHA256_QUEUED" = "$AUTHORITY_SCHEMA_SHA256_NEXT" ]; then
            echo "::error::Authority schema transition pins must be distinct"
            exit 1
          fi

          checker_sha256="$(sha256sum "$checker" | cut -d' ' -f1)"
          schema_sha256="$(sha256sum "$schema" | cut -d' ' -f1)"

          if [ "$checker_sha256" = "$AUTHORITY_CHECKER_SHA256_CURRENT" ] && \
             { [ "$schema_sha256" = "$AUTHORITY_SCHEMA_SHA256_CURRENT" ] || \
               [ "$schema_sha256" = "$AUTHORITY_SCHEMA_SHA256_QUEUED" ]; }; then
            :
          elif [ "$checker_sha256" = "$AUTHORITY_CHECKER_SHA256_NEXT" ] && \
               [ "$schema_sha256" = "$AUTHORITY_SCHEMA_SHA256_NEXT" ]; then
            :
          else
            echo "::error::Candidate authority checker/schema pair is not a reviewed transition state"
            exit 1
          fi

          node "$checker" --selftest
          node "$checker" \
            --root "$GITHUB_WORKSPACE/candidate" --check

      - name: Enforce protected S1 module gates (Path 1 Naehte)
        # Base-Skript gegen den Kandidatenbaum; die UI-Vertrag-Baseline des Kandidaten darf
        # gegenueber der Basis nur schrumpfen. Ein Kandidat kann das Gate nicht durch
        # Aendern des Skripts oder der Baseline umgehen.
        working-directory: ratchet-base
        run: |
          node scripts/quality/check-module-gates.mjs \
            --root "$GITHUB_WORKSPACE/candidate" \
            --base-baseline "$GITHUB_WORKSPACE/ratchet-base/quality/module-gates-baseline.json" \
            --schema "$GITHUB_WORKSPACE/ratchet-base/docs/architecture/MODULE_MANIFEST.schema.json"
