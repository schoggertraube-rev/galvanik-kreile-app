name: ESLint Ratchet

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: ratchet-base
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout candidate without credentials
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Determine protected Node version
        id: node-version
        working-directory: ratchet-base
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.stdout.write(pkg.engines?.node ?? '')")"
          if [ -z "$node_version" ]; then
            node_version="24"
          fi
          echo "version=$node_version" >> "$GITHUB_OUTPUT"

      - name: Setup protected Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
          cache-dependency-path: ratchet-base/package-lock.json

      - name: Install protected lint dependencies
        working-directory: ratchet-base
        run: npm ci --ignore-scripts

      - name: Enforce protected static ratchet boundary
        # Base code only (KR A1, D-QA-001): compares base and candidate Git objects,
        # byte-binds the judge files listed in quality/ratchet-boundary.json, binds the
        # candidate data roots to their Git blobs and emits the verified delivery judge.
        working-directory: ratchet-base
        env:
          RATCHET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RATCHET_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RATCHET_REPOSITORY: ${{ github.repository }}
          RATCHET_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          RATCHET_CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          node scripts/quality/check-ratchet-boundary.mjs --selftest
          node scripts/quality/check-ratchet-boundary.mjs \
            --base-root "$GITHUB_WORKSPACE/ratchet-base" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --base-sha "$RATCHET_BASE_SHA" \
            --candidate-sha "$RATCHET_CANDIDATE_SHA" \
            --repository "$RATCHET_REPOSITORY" \
            --base-repository "$RATCHET_BASE_REPOSITORY" \
            --candidate-repository "$RATCHET_CANDIDATE_REPOSITORY" \
            --delivery-judge-out "$RUNNER_TEMP/kreile-delivery-judge/check-delivery-contracts.mjs"

      - name: Enforce protected delivery contracts on candidate data
        # Runs only the judge bytes emitted by the boundary: byte-identical to the base
        # checker or an exact base-preauthorized successor. Living Mission, queue,
        # manifests, gate mapping, handoff graph and the PR113 import invariant are
        # validated as candidate data against the trusted base Git graph.
        working-directory: ratchet-base
        env:
          GIT_NO_REPLACE_OBJECTS: "1"
          DELIVERY_REQUIRE_TRUSTED_BASE: "true"
          DELIVERY_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DELIVERY_TRUSTED_REPO: ${{ github.workspace }}/ratchet-base
        run: |
          set -euo pipefail
          judge_dir="$RUNNER_TEMP/kreile-delivery-judge"
          test -f "$judge_dir/check-delivery-contracts.mjs"
          test ! -L "$judge_dir/check-delivery-contracts.mjs"
          test ! -e "$judge_dir/node_modules"
          ln -s "$GITHUB_WORKSPACE/ratchet-base/node_modules" "$judge_dir/node_modules"
          sha256sum "$judge_dir/check-delivery-contracts.mjs"
          node "$judge_dir/check-delivery-contracts.mjs" --selftest --root "$GITHUB_WORKSPACE/candidate"
          node "$judge_dir/check-delivery-contracts.mjs" --root "$GITHUB_WORKSPACE/candidate"

      - name: Enforce D-GOV-001 authority contract on candidate
        working-directory: ratchet-base
        env:
          AUTHORITY_CHECKER_SHA256: "05d07eeb62e61049ccb1bbcd33b1742a9e53b56c5401bf7b0a3600e4399e80fb"
          AUTHORITY_SCHEMA_SHA256: "322018e732ee86ecdd4a0320255b8bd216d7d2281302dff8b149dfbd3a80dbba"
        run: |
          set -euo pipefail
          # KR-01R closes the temporary KR-01A transition. The protected base
          # workflow now accepts exactly the ratified authority schema and checker;
          # the candidate copy runs only after both base-pinned SHA-256 checks.
          checker="$GITHUB_WORKSPACE/candidate/scripts/quality/check-authoritative-sources.mjs"
          schema="$GITHUB_WORKSPACE/candidate/quality/authoritative-sources.json"
          checker_sha="$(sha256sum "$checker" | cut -d' ' -f1)"
          schema_sha="$(sha256sum "$schema" | cut -d' ' -f1)"
          if [[ "$checker_sha" != "$AUTHORITY_CHECKER_SHA256" ]]; then
            echo "Authority checker hash mismatch: $checker_sha" >&2
            exit 1
          fi
          if [[ "$schema_sha" != "$AUTHORITY_SCHEMA_SHA256" ]]; then
            echo "Authority schema hash mismatch: $schema_sha" >&2
            exit 1
          fi
          node "$checker" --selftest
          node "$checker" \
            --root "$GITHUB_WORKSPACE/candidate" --check

      - name: Enforce protected S1 module gates (Path 1 Naehte)
        # Base-Skript gegen den Kandidatenbaum; die UI-Vertrag-Baseline des Kandidaten darf
        # gegenueber der Basis nur schrumpfen. Ein Kandidat kann das Gate nicht durch
        # Aendern des Skripts oder der Baseline umgehen.
        working-directory: ratchet-base
        run: |
          node scripts/quality/check-module-gates.mjs \
            --root "$GITHUB_WORKSPACE/candidate" \
            --base-baseline "$GITHUB_WORKSPACE/ratchet-base/quality/module-gates-baseline.json" \
            --schema "$GITHUB_WORKSPACE/ratchet-base/docs/architecture/MODULE_MANIFEST.schema.json"

      - name: Enforce protected repository ratchet
        # Last step: the consistency snapshot loads the candidate eslint.config.mjs,
        # so no protected verdict may run after candidate code. Debt is judged with
        # the base config and base baseline (D-QA-001).
        working-directory: ratchet-base
        run: |
          test ! -e "$GITHUB_WORKSPACE/candidate/node_modules"
          ln -s "$GITHUB_WORKSPACE/ratchet-base/node_modules" "$GITHUB_WORKSPACE/candidate/node_modules"
          node --import tsx scripts/quality/check-eslint-ratchet.ts \
            --root "$GITHUB_WORKSPACE/candidate" \
            --config "$GITHUB_WORKSPACE/ratchet-base/eslint.config.mjs" \
            --base-baseline "$GITHUB_WORKSPACE/ratchet-base/quality/eslint-baseline.json"
