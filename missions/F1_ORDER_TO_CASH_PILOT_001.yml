# ── F1.2 Entscheidungsgrundlage (bindend, ersetzt Altstand) ───────
# D-F12-001A (ersetzt D-F12-001): F1.2 = genau EIN Uebergang
#   wareneingang(angenommen) -> galvanik. Kein ready->in_progress, kein
#   Start-Klick — ersatzlos gestrichen. Zweck: Ware digital auffindbar
#   statt Regal-Suche.
# D-ARCH-001: galvanik = eine stabile Aussenstation = gesamte Produktion
#   (inkl. Vorbehandlung/Schleifen). Keine Innenschritte, keine
#   Workflow-Engine.
# D-ARCH-002: globale Zustandskette als Namensvertrag jetzt fixiert:
#   angenommen -> galvanik -> fertig -> abgeholt (+ bezahlt als
#   accounting-Status, separate Achse). F1.2 baut nur den ersten
#   Uebergang; fertig/abgeholt sind Namen only (F1.3/F1.5).
# D-F12-002: genau eine aktive Station je Auftrag. Kein QS-Zwischenschritt.
#   Keine Teillieferung.
# D-F12-003: Rollen buero, werkstatt, meister, admin duerfen den
#   Uebergang und die Korrektur ausloesen. readonly und developer sind
#   FORBIDDEN. Tenant-, Rollen-, Ownership- und Versionspruefung bleiben
#   vollstaendig im Command.
# D-F12-004: Ruecknahme nie still — eigener Korrektur-Command mit
#   Pflicht-Begruendung (5..500 Zeichen, getrimmt) + eigenes
#   ORDER_STATION_CORRECTED_V1 Ereignis; keine Loeschung.
#   Versionskonflikt = kein Write, neu laden.
# D-F12-005: keine Extra-Pflichtfelder. Nachweise automatisch: Actor,
#   Zeitpunkt, Auftrag, Version, Receipt.
# Leitplanke: Stationsstatus ist Ortswahrheit, nie Zeitwahrheit — aus
#   Uebergangs-Zeitstempeln wird niemals Arbeitszeit/Abrechnung abgeleitet.

