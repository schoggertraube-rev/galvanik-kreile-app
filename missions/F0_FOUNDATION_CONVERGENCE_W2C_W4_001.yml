mission_id: "F0_FOUNDATION_CONVERGENCE_W2C_W4_001"
title: "F0 Foundation Convergence: T0 bis W4"
product_goal: "Ein fail-closed, evidenzgestützter Foundation-Vertrag für das WerkstattCockpit."
user_value: "Kontrolle und Planbarkeit beruhen auf tenant-gebundener, nachvollziehbarer Fachwahrheit."
risk_class: "critical-foundation-security-data-integrity"
allowed_paths:
  - "src/**"
  - "supabase/migrations/**"
  - "supabase/functions/**"
  - "supabase/config.toml"
  - "scripts/quality/**"
  - ".github/workflows/quality.yml"
  - ".github/workflows/agentur-gate.yml"
  - "tests/**"
  - "playwright.config.*"
  - "package.json"
  - "docs/project/**"
  - "docs/evidence/f0/**"
  - "missions/F0_FOUNDATION_CONVERGENCE_W2C_W4_001.yml"
forbidden_paths:
  - "node_modules/**"
  - ".env"
  - ".env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.p12"
  - "**/*.pfx"
  - "outside this repository"
  - "old worktrees or clones"
forbidden_actions:
  - "Datei- oder Datenlöschung"
  - "Production-Deploy, -Promotion oder -Mutation"
  - "Remote-Supabase-Migration, RLS-, Policy-, Grant- oder Default-ACL-Mutation"
  - "Legacy-Daten- oder Legacy-Objektmutation"
  - "Merge nach main"
data_contracts:
  - name: "W3 Server-Command-Vertrag"
    source: "kanonische Serversession und fachlich besessenes Domain-Objekt"
    contract: "Actor + Session-Tenant + fachliche Capability + Object-Ownership + Version; Result-Union; server-only Service-Role-Provider"
  - name: "W4 Evidence- und Attachment-Vertrag"
    source: "privates Storage-Original und append-only Metadaten"
    contract: "stabile ID, privater Pfad, MIME, Größe, Hash, Provenienz, Extraktion, Konfidenz, polymorpher Link, Korrelation und Idempotenz; Legacy-Adapter ohne Legacy-Mutation"
  - name: "W4 Cross-Modul-Read-Port"
    source: "Single-Source-Domain-Fakten und -Ereignisse"
    contract: "versionierte v_* SQL-Views sind die einzigen Cross-Modul-Read-Ports"
acceptance_criteria:
  - id: "T0-01"
    criterion: "Der Precheck enthält genau eine aktuelle T0-Wahrheit mit Wahrheitankern, Risiken, Gates und Schlussfolgerung."
  - id: "T0-02"
    criterion: "Der Precheck dokumentiert Tenant-, Ledger-, RLS-/Default-ACL-, Evidence-, Event- und aktiven-Pfad-Risiken prüfbar."
  - id: "T0-03"
    criterion: "T0 weist Null-Side-Effect-Denials für Production, Remote, RLS, Grants, Default-ACLs, Legacy und Löschungen aus."
  - id: "T0-04"
    criterion: "T0 trennt lokale W2C-W4-Arbeit und W4-Kandidatenabnahme von externen Gates für F0-PASS, Remote- und Legacy-Mutationen."
  - id: "W2C-01"
    criterion: "Aktive Browser-Upload- und Public-URL-Pfade fail-closed schließen."
  - id: "W2C-02"
    criterion: "ID-only-Operationen ohne serverseitige Autorisierung fail-closed schließen."
  - id: "W2C-03"
    criterion: "Ein zweiter Stationsschreiber ohne kanonischen Command-Vertrag fail-closed schließen."
  - id: "W2C-04"
    criterion: "Unsichere Extraction-/Provider-Pfade fail-closed schließen."
  - id: "W2C-05"
    criterion: "Synthetische Today-/Cron-Wahrheit ohne kanonische Quelle fail-closed schließen."
  - id: "W2C-06"
    criterion: "Nichtatomare Side-Effects ohne nachweisbare Wiederholbarkeit fail-closed schließen."
  - id: "W2C-07"
    criterion: "Jeder Denial erzeugt keinen fachlichen Schreib-, Upload-, Event- oder externen Side-Effect."
  - id: "W2C-08"
    criterion: "Negative Tests belegen für jeden geschlossenen aktiven Pfad den Null-Side-Effect-Denial."
  - id: "W3-01"
    criterion: "Es gibt genau einen serverseitigen Command-Vertrag für die betroffenen Mutationen."
  - id: "W3-02"
    criterion: "Der Vertrag leitet Actor und Tenant ausschließlich aus der Serversession ab."
  - id: "W3-03"
    criterion: "Der Vertrag prüft fachliche Capability vor jeder Mutation."
  - id: "W3-04"
    criterion: "Der Vertrag prüft Ownership des betroffenen Domain-Objekts."
  - id: "W3-05"
    criterion: "Der Vertrag prüft eine Version und behandelt Konflikte explizit."
  - id: "W3-06"
    criterion: "Der Vertrag liefert eine diskriminierte Result-Union für Erfolg, Denial und Konflikt."
  - id: "W3-07"
    criterion: "Ein server-only Service-Role-Provider kapselt privilegierte Zugriffe; Secrets erscheinen nicht im Client-Payload."
  - id: "W3-08"
    criterion: "Negative Tests belegen Tenant-, Capability-, Ownership- und Versions-Denials ohne Side-Effect."
  - id: "W4-01"
    criterion: "Evidence/Attachments erhalten eine stabile Identität und private Preservation-Metadaten für Pfad, MIME, Größe, Hash und Provenienz."
  - id: "W4-02"
    criterion: "Extraktion und Konfidenz sind als Metadaten nachvollziehbar, ohne das Original zu ersetzen."
  - id: "W4-03"
    criterion: "Ein polymorpher Link verbindet Evidence mit dem fachlichen Zielobjekt."
  - id: "W4-04"
    criterion: "Legacy-Adapter lesen bestehende Evidence-Wahrheiten ohne Legacy- oder Objektmutation."
  - id: "W4-05"
    criterion: "Fakten und Ereignisse werden append-only geführt."
  - id: "W4-06"
    criterion: "Jeder relevante Schreibvorgang führt Korrelation und Idempotenz nachweisbar."
  - id: "W4-07"
    criterion: "Tenant wird serverseitig abgeleitet und bleibt über Evidence, Fakten und Ereignisse konsistent."
  - id: "W4-08"
    criterion: "Versionierte v_* SQL-Views bilden die einzigen Cross-Modul-Read-Ports."
  - id: "W4-09"
    criterion: "Negative Tests decken private Evidence, Legacy-Adapter, Append-only, Korrelation, Idempotenz und v_* Ports ab."
  - id: "W4-10"
    criterion: "End-to-End-Evidenz belegt einen Kernweg einschließlich Reload-Readback ohne Entwicklerwissen; nach dem W4-Bericht wird gestoppt."
  - id: "G-01"
    criterion: "P1 bis P12 werden gemäß F0-Vertrag als Kandidaten-Checks ausgeführt und nachgewiesen."
  - id: "G-02"
    criterion: "Lokale Migrationen sind zulässig; Remote-Migrationen sowie RLS-, Policy-, Grant- und Default-ACL-Mutationen bleiben gesperrt."
  - id: "G-03"
    criterion: "Der Kandidatenbranch darf gepusht und ein Draft-PR erstellt werden; kein Merge nach main erfolgt."
  - id: "G-04"
    criterion: "Eine Vercel Preview wird erstellt; Production wird weder deployt noch promotet."
  - id: "G-05"
    criterion: "Eine unabhängige Review liegt vor jeder Mergeempfehlung vor; Vertragsratifikation ist nur vor einem F0-PASS-Claim erforderlich."
required_checks:
  - "T0: YAML-Syntax, Pflichtkeys und eindeutige Criterion-IDs dieser Missionsdatei."
  - "T0: Markdown-Struktur mit genau einem H1 und ohne historische Marker in docs/evidence/f0/F0_PRECHECK.md."
  - "T0: git diff --check und git status."
preview_required: true
database_change:
  allowed: true
  description: "W2C-W4 dürfen lokale Migrationen erstellen; T0 erstellt keine Datenbankartefakte."
production_change:
  allowed: false
  description: "Keine Production-, Remote-, RLS-, Grant-, Default-ACL-, Ledger- oder Storage-Mutation."
approval_gates:
  - gate: "contract-ratification"
    required_before: "F0-PASS-Claim"
    approver: "Auftraggeber/Ratifizierer"
  - gate: "production-default-acl-and-rights"
    required_before: "Remote-Remediation von supabase_admin-Default-ACLs oder Production-Rechten"
    approver: "Production-Owner"
  - gate: "legacy-beleg-tenant-and-tax-classification"
    required_before: "Legacy-beleg-Mapping oder -Migration"
    approver: "Produkt- und Accounting-Owner"
  - gate: "bucket-purpose-and-legacy-object-classification"
    required_before: "Neuzuordnung, Migration oder Löschung von Legacy-Storage-Objekten"
    approver: "Produkt- und Storage-Owner"
  - gate: "independent-end-review"
    required_before: "Mergeempfehlung für den Draft-PR"
    approver: "Unabhängige read-only Review"
final_evidence:
  - "branch_sha"
  - "diff_file_list"
  - "local_checks"
  - "github_checks"
  - "vercel_preview"
  - "scope_guard"
  - "numbered_w2c_w4_evidence"
  - "independent_review"
