</script><script>/* Vernetzung 04: ausschließlich isolierte lokale Klickprobe. Kein Produktadapter, keine KI/OCR. */

const netDoc=id=>D.documents.find(d=>d.id===id);
const netKey=s=>norm(s).replace(/[^a-z0-9]/g,'');
const netButton=(label,action,id='',tone='green')=>'<button class="btn '+tone+'" data-net="'+action+'" data-id="'+esc(id)+'">'+esc(label)+'</button>';
function netFacts(raw){
 const pick=p=>raw.match(p)?.[1]?.trim()||'';
 const date=s=>{const m=s?.match(/(\d{2})\.(\d{2})\.(\d{4})/);const v=m?m[3]+'-'+m[2]+'-'+m[1]:s;return validDate(v)?v:''};
 const amount=pick(/(\d[\d.]*,\d{2}|\d+(?:\.\d{2})?)\s*(?:€|Euro)/i);
 const qty=pick(/(?:Menge|Stückzahl)\s*:\s*(\d+)/i);
 return {supplier:pick(/(?:Lieferant|Aussteller|Tankstelle)\s*:\s*([^;\n·]+)/i),invoiceRef:pick(/\b(RG[- ]\d+(?:[-/]\d+)*)\b/i),deliveryRef:pick(/\b(LS[- ]\d+(?:[-/]\d+)*)\b/i),offerRef:pick(/\b(AN[- ]\d+(?:[-/]\d+)*)\b/i),date:date(pick(/(?:Datum|vom)\s*:?\s*(\d{2}\.\d{2}\.\d{4}|20\d{2}-\d{2}-\d{2})/i)),amount:amount?Math.round(100*Number(amount.replace(/\.(?=\d{3})/g,'').replace(',','.'))):null,qty:qty?Number(qty):null,part:pick(/(?:Teil|Position)\s*:\s*([^;\n·]+)/i),due:date(pick(/fällig\s*:?\s*(\d{2}\.\d{2}\.\d{4}|20\d{2}-\d{2}-\d{2})/i)),discountDate:date(pick(/Skonto\s+(?:bis\s*)?:?\s*(\d{2}\.\d{2}\.\d{4}|20\d{2}-\d{2}-\d{2})/i)),discountPercent:Number(pick(/(\d+(?:[,.]\d+)?)\s*%\s*Skonto/i).replace(',','.'))||null};
}
function netFill(d,raw){const f=netFacts(raw);for(const k of ['supplier','date','invoiceRef','deliveryRef','offerRef','part','due','discountDate'])if(f[k]&&!d[k])d[k]=f[k];if(f.qty!==null&&!finite(d.qty,1))d.qty=f.qty;if(f.amount!==null&&!finite(d.amount,1))d.amount=f.amount;if(f.discountPercent&&!d.discountPercent)d.discountPercent=f.discountPercent;if(!d.number)d.number=d.kind==='delivery'?f.deliveryRef:f.invoiceRef;d.netSourceRaw=raw;return d}
function netPayment(d){if(!d.number||!d.supplier||!finite(d.amount,1))return null;const candidates=D.banks.filter(b=>netKey(b.invoice)===netKey(d.number)&&netKey(b.supplier)===netKey(d.supplier));return candidates.length===1&&candidates[0].amount===Number(d.amount)?candidates[0]:null}
function netContext(d){
 const matches=(kind,ref)=>ref?D.documents.filter(x=>x.id!==d.id&&x.kind===kind&&netKey(x.number)===netKey(ref)&&d.supplier&&netKey(x.supplier)===netKey(d.supplier)):[];
 const deliveries=d.kind==='delivery'?[]:matches('delivery',d.deliveryRef),offers=matches('offer',d.offerRef),invoices=d.kind==='invoice'?[]:matches('invoice',d.invoiceRef);
 const delivery=deliveries.length===1?deliveries[0]:null,offer=offers.length===1?offers[0]:null,invoice=invoices.length===1?invoices[0]:null;
 const facts=[],issues=[];const paymentTarget=d.kind==='delivery'&&invoice?invoice:d;const payment=netPayment(paymentTarget);const bankCandidates=D.banks.filter(b=>paymentTarget.number&&paymentTarget.supplier&&netKey(b.invoice)===netKey(paymentTarget.number)&&netKey(b.supplier)===netKey(paymentTarget.supplier));
 if(payment)facts.push({text:'Bezahlt am '+dateText(payment.date)+' · '+euros(payment.amount),source:payment.ref});
 else if(bankCandidates.length===1&&bankCandidates[0].amount>0&&bankCandidates[0].amount<Number(paymentTarget.amount))facts.push({text:'Teilzahlung '+euros(bankCandidates[0].amount)+' · noch '+euros(paymentTarget.amount-bankCandidates[0].amount)+' offen',source:bankCandidates[0].ref});
 else if(bankCandidates.length)issues.push({kind:'payment',text:'Kontobelege zum Vorgang vorhanden, aber keine eindeutige vollständige Zahlung. Beträge und Zuordnung vergleichen.'});
 else if(d.kind==='invoice')facts.push({text:'Zahlung nicht belegt',source:'Kein eindeutiger Treffer aus Lieferant, Rechnungsnummer und Gesamtbetrag.'});
 if(deliveries.length>1||offers.length>1||invoices.length>1)issues.push({kind:'ambiguous',text:'Mehrere Belege haben dieselbe Referenz. Noch nicht eindeutig verbunden.'});
 for(const [label,x] of [['Lieferschein',delivery],['Angebot',offer],['Rechnung',invoice]])if(x)facts.push({text:label+' '+x.number,source:'Lieferant + Referenz stimmen überein.',id:x.id});
 if(d.kind==='invoice'&&d.deliveryRef&&!deliveries.length)issues.push({kind:'delivery',text:'Lieferschein '+d.deliveryRef+' ist noch nicht vorhanden.'});
 if(d.kind==='invoice'&&d.offerRef&&!offers.length)issues.push({kind:'offer',text:'Angebot '+d.offerRef+' ist noch nicht vorhanden.'});
 for(const x of [delivery,offer].filter(Boolean))if(d.part&&x.part&&netKey(d.part)===netKey(x.part)&&finite(d.qty,1)&&finite(x.qty,1)&&Number(d.qty)!==Number(x.qty))issues.push({kind:'qty',text:d.qty+' '+d.part+' berechnet; '+x.qty+' auf '+x.number+'.',id:x.id});
 if(d.kind==='delivery'&&invoice&&d.part&&invoice.part&&netKey(d.part)===netKey(invoice.part)&&finite(d.qty,1)&&finite(invoice.qty,1)&&Number(d.qty)!==Number(invoice.qty))issues.push({kind:'qty',text:d.qty+' '+d.part+' auf diesem Lieferschein; '+invoice.qty+' auf Rechnung '+invoice.number+'.',id:invoice.id});
 if(offer&&finite(d.amount,1)&&finite(offer.amount,1)&&d.amount!==offer.amount)issues.push({kind:'amount',text:'Gesamtbetrag '+euros(d.amount)+'; Angebot '+euros(offer.amount)+'. Umfang und Preisgrundlage gegenüberstellen.',id:offer.id});
 if(!payment&&d.discountDate)facts.push({text:(d.discountDate<today()?'Skontofrist abgelaufen: ':'Skontofrist: ')+dateText(d.discountDate)+(d.discountPercent?' · '+d.discountPercent+' %':''),source:'Frist aus dem erfassten Beleg. Keine Zahlungs- oder Liquiditätsempfehlung.'});
 if(!payment&&d.due)facts.push({text:'Zahlungsziel '+dateText(d.due),source:'Erfasste Belegangabe'});
 return {facts,issues,payment,delivery,offer,invoice,related:[...deliveries,...offers,...invoices]};
}
function netEvidence(c){return '<div class="net-facts">'+c.facts.map(f=>'<span class="net-fact">'+esc(f.text)+'</span>').join('')+'</div>'+fold('Woran ich das festmache',c.facts.map(f=>'<p class="small">'+esc(f.text)+' — '+esc(f.source)+(f.id?' '+netButton('Beleg ansehen','evidence',f.id,'ghost'):'')+'</p>').join('')+'<p class="small">Lokale Testdaten. Eigene Fotos/PDFs werden hier nicht automatisch gelesen.</p>')}
function netSummary(d){const c=netContext(d);return c.issues.some(i=>['qty','amount'].includes(i.kind))?'Hier passt der Umfang noch nicht zusammen.':c.issues.some(i=>i.kind==='ambiguous')?'Ich habe mehrere mögliche Belege gefunden.':c.payment?'Die Zahlung habe ich im Testbestand gefunden.':c.delivery||c.invoice?'Die Belege passen zum selben Vorgang.':'Ich halte Beleg, Fristen und nächste Schritte zusammen.'}
function netConstraints(raw){return raw.split(/(?<=[.!?])\s+|\n/).filter(s=>/\b(nicht|keine?|unbedingt|erhalten|abdecken|unverändert|original|innen|außen|rückruf)\b/i.test(s)).map(s=>s.trim()).filter(Boolean)}
newQuote=function(src,a){const q=netBase.newQuote(src,a);q.requirements=netConstraints(src.raw);q.sourceText=src.raw;q.note=[q.note,...q.requirements].filter(Boolean).join('\n');persist();return q};
createDocument=function(kind,raw,files,source,sourceId){const d=netBase.createDocument(kind,raw,files,source,sourceId);netFill(d,raw);const m=getMessage(sourceId);if(m)m.documentId=d.id;persist();return d};
let netSyncing=false;
function netSync(){
 for(const m of D.messages){const q=getQuote(m.entityId);if(m.kind==='newquote'&&q)m.status=q.orderId?'done':q.sentVersion===q.version?'waiting':'open';if(m.kind==='accept'&&q?.version!==m.version)m.status='open';const d=netDoc(m.documentId);if(d)m.status=d.followup||d.status==='ready'?'waiting':'open';}
 for(const q of D.quotes){if(!q.requirements)q.requirements=netConstraints(q.raw||'');const o=getOrder(q.orderId);if(o&&!o.sourceText){o.sourceText=q.sourceText||q.raw;o.requirements=[...q.requirements];o.notes.push({text:'Originalanfrage: '+o.sourceText});for(const p of o.parts)for(const requirement of q.requirements)p.note=(p.note||'').replace(requirement,'').trim();}}
 for(const d of D.documents.filter(d=>d.kind==='invoice')){const c=netContext(d),key='net-doc-'+d.id;let t=D.tasks.find(x=>x.key===key);const needed=c.issues.length||!c.payment&&(d.due||d.discountDate);if(needed){const detail=c.issues.map(i=>i.text).join(' ')||'Zahlung noch nicht belegt. Keine Überweisung ausgelöst.';const title=c.issues.length?c.issues[0].text:'Rechnung '+d.number+' zur Zahlung vorbereiten';if(!t){t={id:uid('TASK'),key,owner:'Rolf',personal:false};D.tasks.push(t)}Object.assign(t,{title,detail,action:'document',entityId:d.id,due:c.payment?today():[d.discountDate,d.due].filter(Boolean).sort()[0]||today(),done:false});}else if(t)t.done=true;}
 for(const d of D.documents.filter(d=>['invoice','receipt'].includes(d.kind)&&d.status==='ready')){const key='net-accounting-'+d.id;let t=D.tasks.find(x=>x.key===key);if(!t){t={id:uid('TASK'),key,owner:'Rolf',personal:false};D.tasks.push(t)}Object.assign(t,{title:'Beleg '+(d.number||d.id)+' für Buchhaltung vorbereitet',detail:'Original und Zusammenhang vorhanden. Buchhaltungsanbindung ist in dieser Vorschau nicht verfügbar.',action:'document',entityId:d.id,done:!!d.booked});}
}

function netPaperPreview(){const f=buddyFacts(),raw=D.entry.raw;const d=netFill({...f,id:D.entry.id,raw,files:D.entry.files},raw);d.kind=analysis.kind;d.number=d.kind==='delivery'?d.deliveryRef:d.number;return d}
updateEntry=function(){netBase.updateEntry();if(entryMode==='choose'||analysis.warnings.length)return;const kind=analysis.kind;if(['invoice','delivery','receipt'].includes(kind)){const d=netPaperPreview(),saved=D.documents.find(x=>x.sourceId===D.entry.id&&x.kind===kind);if(saved&&saved.netSourceRaw!==D.entry.raw){for(const k of ['qty','part','invoiceRef','deliveryRef','offerRef','due','discountDate','discountPercent'])saved[k]=d[k]??'';saved.netSourceRaw=D.entry.raw;persist();}const c=netContext(d);const actual=buddyFacts();if((c.related.length||c.payment||c.issues.length||d.due)&&!actual.mismatch&&!buddyDuplicate(actual)){const issue=c.issues[0];const title=netSummary(d);const detail=issue?issue.text+(c.payment?' Die Zahlung ist bereits belegt.':' Ich habe den nächsten Schritt vorbereitet.'):c.payment?'Bezahlt am '+dateText(c.payment.date)+' · '+euros(c.payment.amount)+'. Ich ordne das Original dem Zusammenhang zu; keine zweite Zahlung.':'Ich habe passende Referenzen gefunden. Den tatsächlichen Lieferinhalt bestätigst du selbst.';const label=c.issues.some(i=>['qty','amount','ambiguous'].includes(i.kind))?'Abweichung gegenüberstellen':issue?.kind==='delivery'?'Lieferschein anfordern':c.payment?'Beleg & Zahlungsnachweis öffnen':kind==='delivery'?'Lieferung mit Rechnung verbinden':'Frist & Zahlung vorbereiten';$('#entrySuggestion').innerHTML=buddyPanel(title,detail,netButton(label,'entry-review'),c.facts.slice(0,3).map(f=>f.text),'Textangaben + lokaler Testbestand · keine echte OCR')+fold('Belege & Herkunft',netEvidence(c));}}
 if(['quote','order','copy'].includes(kind)){const req=netConstraints(D.entry.raw);if(req.length)$('#entrySuggestion').insertAdjacentHTML('beforeend','<div class="net-remember">'+icon('check')+'<span>Ich nehme auch mit: '+esc(req.join(' '))+'</span></div>');}

function netSeedDoc(kind,number,extra={}){let d=D.documents.find(x=>x.number===number&&x.kind===kind);if(d)return d;d={id:uid('BELEG'),kind,number,raw:'Synthetischer Testbeleg '+number,files:[],source:'Gekennzeichneter Testbestand',sourceId:'TEST-'+number,supplier:'Metallhandel Main',date:today(),amount:null,invoiceRef:'',deliveryRef:'',purpose:'',participants:'',place:'',qty:'',contentChecked:false,status:'ready',orderId:null,history:[],...extra};D.documents.push(d);return d}

function netSample(which){D.entry=freshEntry();if(which==='paid'){netSeedDoc('delivery','LS-26-192',{qty:4,part:'Halter',contentChecked:true,invoiceRef:'RG-26-184'});D.entry.raw='Rechnung RG-26-184; Lieferant: Metallhandel Main; 2.380,00 Euro; Datum: '+dateText(today())+'; Lieferschein LS-26-192; Menge: 4; Teil: Halter';}

function netReview(id,push=true){const d=netDoc(id);if(!d)return;const c=netContext(d);const missing=docMissing(d);const details='<div class="net-identity"><span class="badge blue">'+esc(d.kind==='invoice'?'Rechnung':d.kind==='delivery'?'Lieferschein':'Beleg')+'</span><strong>'+esc(d.number||'Nummer noch offen')+'</strong><span>'+esc(d.supplier||'Aussteller noch offen')+'</span></div>'+netEvidence(c)+(c.issues.length?'<div class="net-issues">'+c.issues.map(i=>'<p>'+esc(i.text)+'</p>').join('')+'</div>':'')+'<div class="row gap">'+(c.related.length?netButton('Belege nebeneinander','compare-doc',id,'soft'):'')+btn('Angaben ergänzen','document-fields',id,'ghost','file')+'</div>'+(d.followup?'<div class="note green gap">Rückfrage im Test versendet · Antwort steht aus. '+netButton('Gesendete Rückfrage','doc-sent',id,'ghost')+'</div>':'')+(d.status==='ready'?'<p class="small gap">Im lokalen Test erfasst. Nicht gebucht; keine Überweisung ausgelöst.</p>':'')+fold('Original & alle Angaben',originals(d.raw,d.files));

function netAction(a,id){const d=netDoc(id);
 if(a==='entry'){openEntry();return}if(a==='entry-return'){closeAll();openEntry();return}if(a==='sample'){netSample(id);return}
 if(a==='entry-review'){const f=netPaperPreview();const doc=createDocument(f.kind,D.entry.raw,D.entry.files,'Eingang',D.entry.id);for(const k of ['supplier','number','date','amount','qty','part','invoiceRef','deliveryRef','offerRef','due','discountDate','discountPercent','purpose','participants'])if(f[k]!==undefined&&f[k]!==null&&f[k]!=='')doc[k]=f[k];D.entry.entityIds[f.kind]=doc.id;preserveEntry();persist();netReview(doc.id);return}

 if(a==='bank-compare'){const target=d.kind==='delivery'&&netContext(d).invoice?netContext(d).invoice:d;const rows=D.banks.filter(b=>netKey(b.invoice)===netKey(target.number)&&netKey(b.supplier)===netKey(target.supplier));netBase.showModal('net-bank',id,'Diese Kontobelege brauchen eine eindeutige Zuordnung.','<div class="note">Rechnung '+esc(target.number)+' · '+euros(target.amount)+'</div><div class="stack gap">'+rows.map(b=>'<div class="note"><strong>'+euros(b.amount)+'</strong> · '+esc(b.ref)+'<br>'+esc(b.supplier)+' · '+dateText(b.date)+'</div>').join('')+'</div><p class="small gap">Mehrfachtreffer können Dubletten, Teilzahlungen oder Überzahlung sein. In dieser lokalen Probe wird nichts umgebucht oder als vollständig bezahlt bestätigt. Der Beleg bleibt offen.</p>',netButton('Zum Beleg zurück','review-return',id),'Lokale Kontobelege');return}
 if(a==='doc-send'){if(!d.replyDraft?.trim())return error('Schreib bitte die Rückfrage dazu.');if(d.replyContext!==JSON.stringify(netContext(d).issues)){netDocReply(id);return error('Die Belege haben sich geändert. Ich habe den Entwurf aktualisiert; noch nichts versendet.');}if(d.followup)d.history.push({at:d.followup.at,text:'Im Test versendete Rückfrage',body:d.followup.text});d.followup={text:d.replyDraft,at:new Date().toISOString(),context:JSON.stringify(netContext(d).issues)};persist();render();netReview(id,false);return}
 if(a==='document-ready'){if(d.kind==='delivery'&&!d.contentChecked){netBase.openDocument(id);return}if(docMissing(d)){netBase.openDocument(id);return}if(d.status==='ready'){netBase.showModal('net-next',id,'Der Beleg bleibt im Zusammenhang.',netEvidence(netContext(d))+'<p class="gap">Noch keine echte Buchung. Die Buchhaltung übernimmt später dieses Original und seinen Bezug.</p>',netButton('Nächstes Anliegen aufnehmen','next-entry'),'Lokale Vorschau');return}netCompleteDocument(d);return}
 if(a==='payment-plan'){const c=netContext(d);netBase.showModal('net-pay',id,'Ich habe die Zahlungsangaben zusammengestellt.',netEvidence(c)+'<p class="gap">'+euros(d.amount)+' · '+esc(d.supplier)+' · '+esc(d.number)+'</p><p class="small">Keine Bankverbindung oder Zahlungsfreigabe angeschlossen. Ich löse keine Überweisung aus und behaupte keine Liquiditätsprüfung.</p>'+(c.issues.length?'<p class="net-issue">Vorher offen: '+esc(c.issues.map(i=>i.text).join(' '))+'</p>':''),netButton('Frist im Test vormerken','deadline',id),'Vorbereitung, keine Zahlung');return}
 if(a==='deadline'){persist();netBase.showModal('net-reminder',id,'Die Frist ist mit dieser Rechnung verbunden.','<p>Auf Der Tag bleibt die nächste Handlung an diesem Beleg. Ein nachgewiesener Zahlungseingang beendet die Zahlungserinnerung; fehlende Unterlagen bleiben offen.</p>',netButton('Zur Rechnung','evidence',id),d.number);return}

</script><script>
/* Vorschau-Modul KV · Korrekturschicht auf V04 (AP-KV-V04, Auftrag V04 Abschn. 4/5). Optik = V04, nur Verhalten/Anschluss. Lokale Testdaten. */
const KV = {
 base: { qStatus, qChanged, openQuote, conversion, receiveOrder, nextAction, nextText, buddyOrder, messageDetail, renderDay, deriveDay, openDocument, printQuote, quoteSent, quoteMail, action, openRoute, setField, seed, orderCard, persist, netQuoteFooter }
};
const kvNow = () => new Date().toISOString();
const kvSet = () => {
 D.settings.followupDays ??= 7;
 D.settings.validityDays ??= 30;
 D.settings.payDefault ??= 'invoice';
 return D.settings
};
const kvMsgFor = (q, kind, current = true) => D.messages.find(m => m.kind === kind && m.entityId === q.id && (!current || m.version === q.version) && m.status !== 'done');
const kvAcceptMsg = q => kvMsgFor(q, 'accept');
const kvDeclineMsg = q => kvMsgFor(q, 'decline', false);
const kvExpired = q => !!(q && !q.orderId && !q.declinedAt && q.acceptedVersion !== q.version && q.sentVersion && q.validUntil && q.validUntil < today());
const kvFollowDue = q => q.sentVersion === q.version && !q.orderId && !q.declinedAt && q.acceptedVersion !== q.version && !kvAcceptMsg(q) && !kvDeclineMsg(q) && !kvExpired(q) ? addDays(String(q.followupSentAt || q.sentAt || kvNow()).slice(0, 10), Number(q.followupDays ?? kvSet().followupDays)) : '';
const kvPay = {
 invoice: 'Zahlung auf Rechnung',
 prepay: 'Vorkasse',
 cash: 'Bar / EC bei Abholung',
 agreement: 'Sondervereinbarung laut Kundenkarte'
};
const kvReasons = ['Preis passt nicht', 'Termin passt nicht', 'Anderweitig vergeben', 'Kein Bedarf mehr', 'Sonstiges'];

/* Testbestand ergänzen (nur einmal je Teststand) */
function kvPatch(d) {
 d.settings.followupDays ??= 7;
 d.settings.validityDays ??= 30;
 d.settings.payDefault ??= 'invoice';
 for (const q of d.quotes) {
  if (q.sentVersion && !q.sentAt) {
   q.sentAt = addDays(today(), -7) + 'T09:00:00.000Z';
   q.sentChannel = 'mail';
   q.validUntil = addDays(today(), 23)
  }
  q.followupDays ??= d.settings.followupDays;
  q.validityDays ??= d.settings.validityDays
 }
 const mq = d.messages.find(m => m.id === 'M-QUOTE');
 if (mq && !mq.files) mq.files = [{
  id: 'F-MQUOTE-1',
  name: 'Foto-Stossstangen.svg',
  type: 'image/svg+xml',
  role: 'Mail-Anhang',
  data: sketch(1)
 }];
 if (!d.messages.some(m => m.id === 'M-QUOTE-OHNE')) d.messages.splice(2, 0, {
  id: 'M-QUOTE-OHNE',
  type: 'kv',
  kind: 'newquote',
  customerId: null,
  from: 'j.becker@example.invalid',
  title: 'Anfrage: 6 Felgenringe verzinken – Absender noch offen',
  body: 'Guten Tag, bitte einen KV für 6 Felgenringe, verzinken blau. In vier Wochen wäre gut. Viele Grüße, Jörg Becker',
  received: today(),
  channel: 'E-Mail',
  status: 'open'
 });
 d.kvLayer = 1;
 return d
}
seed = function() {
 return kvPatch(KV.base.seed())
};
if (!D.kvLayer) kvPatch(D);

/* Status nur abgeleitet (AP-KV §2) */
qStatus = function(q) {
 if (q.orderId) return 'Als Auftrag übernommen';
 if (q.declinedAt) return 'Abgesagt · ' + q.declineReason;
 if (kvExpired(q)) return 'Abgelaufen am ' + dateText(q.validUntil);
 if (q.acceptedVersion === q.version) return 'Kundenfreigabe liegt vor';
 if (q.sentVersion === q.version) return 'Beim Kunden · Antwort ausstehend';
 if (q.sentVersion) return 'Geändert · neue Fassung senden';
 return 'Entwurf · noch nicht versendet'
};
/* Fassung +1 nur bei der ersten inhaltlichen Änderung nach Versand/Zusage; Zusage bleibt als Nachweis erhalten */
qChanged = function(q) {
 if (q.orderId || q.declinedAt) return;
 if (q.sentVersion === q.version || q.acceptedVersion === q.version) {
  q.version++;
  q.history.unshift({
   at: kvNow(),
   text: 'Angaben nach Versand geändert · Fassung ' + q.version
  })
 }
 q.status = 'draft';
 q.termManual || (q.term = planDate(q.leadWeeks, q.hours));
 persist()
};
function kvRecordSent(q, channel) {
 q.sentVersion = q.version;
 q.sentAt = kvNow();
 q.sentChannel = channel;
 q.validUntil = addDays(today(), Number(q.validityDays ?? kvSet().validityDays));
 q.followupSentAt = null;
 q.sentSnapshot = {
  version: q.version,
  price: quotePrice(q),
  term: q.term,
  positions: structuredClone(q.positions)
 };
 q.status = 'sent';
 q.history.unshift({
  at: kvNow(),
  text: 'Fassung ' + q.version + ' versendet · ' + (channel === 'druck' ? 'Druck / Post' : 'E-Mail')
 })
}

/* KV-Karte: Fassung, Zusage/Absage, Ansätze je KV */
function kvQuoteState(q) {
 const id = q.id;
 if (q.orderId) return '';
 if (q.declinedAt) return '<div class="note amber gap"><strong>Abgesagt am ' + dateText(q.declinedAt.slice(0, 10)) + ' · ' + esc(q.declineReason) + '</strong><p class="small gap-sm">' + esc(q.declineProof || '') + ' Kein Auftrag angelegt.</p><div class="row gap-sm">' + btn('Absage zu ' + q.id + ' zurücknehmen', 'kv-decline-undo', id, 'ghost', 'back') + '</div></div>';
 if (kvExpired(q)) return '<div class="note amber gap"><strong>Gültig bis ' + dateText(q.validUntil) + ' · abgelaufen.</strong><p class="small gap-sm">Keine Antwort zu Fassung ' + q.version + '. Der KV steht nicht mehr auf Der Tag.</p><div class="row gap-sm">' + btn('Absage festhalten', 'kv-decline', id, 'ghost', 'close') + '</div></div>';

/* App-weit: keine Zuordnungs- oder Art-Fragen an den Nutzer. Die App schlägt vor (mit Grund), Alternativen daneben. */
function vmRankCustomers(text, list) {
 const a = analyze(text),
  keys = [...a.positions.map(p => p.part), a.part].filter(Boolean).map(p => netKey(p).replace(/en$|n$/, '').slice(0, 7));
 return (list || []).map(c => {
  let score = 0;
  const why = [];
  if (norm(text).includes(norm(c.name))) {
   score += 5;
   why.push('voller Name im Text')
  }
  const prev = [...D.orders.filter(o => o.customerId === c.id).map(o => [o.id, o.title]), ...D.quotes.filter(q => q.customerId === c.id).map(q => [q.id, titleQ(q)])].filter(([, t]) => keys.some(k => k && netKey(t).includes(k)));
  if (prev.length) {
   score += 4;
   why.push('hatte schon ' + prev[0][1].replace(/^\d+\s/, '') + ' (' + prev.slice(0, 2).map(x => x[0]).join(', ') + ')')
  }
  if (c.city && norm(text).includes(norm(c.city))) {
   score += 2;
   why.push('Ort ' + c.city + ' im Text')
  }
  if (c.email && norm(text).includes(norm(c.email))) {
   score += 5;
   why.push('Absenderadresse bekannt')
  }
  if (!why.length && c.last && norm(text).includes(norm(c.last))) {
   score += 1;
   why.push('Name ' + c.last + ' im Text')
  }
  return {
   c,
   score,
   reason: why.join(' · ') || 'ähnlicher Name'
  }
 }).sort((x, y) => y.score - x.score)
}
function vmRankOrders(raw, opts = {}) {
 const msg = D.messages.find(m => m.body === raw),
  a = analyze(raw || ''),
  keys = [...a.positions.map(p => p.part), a.part].filter(Boolean).map(p => netKey(p).replace(/en$|n$/, '').slice(0, 7)),
  cid = opts.customerId || msg?.customerId || a.selected?.id,
  thread = msg?.threadOrderId;
 return D.orders.map(o => {
  let score = 0;
  const why = [];
  if (thread === o.id) {
   score += 10;
   why.push('Antwort auf eure Mail zu ' + o.id)
  }
  if ((a.refs || []).some(r => r.order?.id === o.id)) {
   score += 9;
   why.push('Nummer im Text')
  }
  if (cid && o.customerId === cid) {
   score += 5;
   why.push('Kunde ' + getCustomer(cid).name)
  }
  if (keys.some(k => k && netKey(o.title + ' ' + o.parts.map(p => p.name).join(' ')).includes(k))) {
   score += 3;
   why.push('Teil passt')
  }
  if (opts.expectGoods && !o.received && !o.parentId && o.phase !== 'handed') {
   score += 4;
   why.push('Ware erwartet')
  }
  if (opts.complaint && ['handed', 'finished'].includes(o.phase)) {
   score += 2;
   why.push(o.phase === 'handed' ? 'bereits übergeben' : 'fertig im Haus')
  }
  return {
   o,
   score,
   reason: why.join(' · ')
  }
 }).sort((x, y) => y.score - x.score)
}
const vmOrderLine = o => o.id + ' · ' + getCustomer(o.customerId).name + ' · ' + o.title + (o.phase === 'handed' ? ' · übergeben' : o.phase === 'finished' ? ' · fertig' : '');

 $('#entrySuggestion').innerHTML = best ? buddyPanel('Vorschlag: ' + what + ' für ' + best.c.name, 'Grund: ' + best.reason + '.' + (r.length > 1 ? ' Ebenfalls „' + a.customerName + '“: ' + r.slice(1).map(x => x.c.name).join(', ') + '.' : ''), btn(what + ' für ' + best.c.name + ' vorbereiten', 'entry-customer', best.c.id, 'green', 'file') + r.slice(1, 4).map(x => btn('Stattdessen ' + x.c.name, 'entry-customer', x.c.id, 'ghost', 'user')).join('') + btn('Neuen Kunden aufnehmen', 'entry-newcustomer', '', 'ghost', 'user')) : buddyPanel('Vorschlag: Kunde ' + (name || '') + ' neu anlegen', 'Grund: ' + (name ? '„' + name + '“ ist noch nicht im Kundenstamm.' : 'Im Text steht noch kein Kunde.') + ' Die übrigen Angaben bleiben im Eingang.', btn('Kunde ' + (name || '') + ' anlegen · dann ' + what, 'entry-newcustomer', '', 'green', 'user'))
};
const KV_PAYCARD = paymentCard;
paymentCard = function(id, push = true) {
 KV_PAYCARD(id, push);
 const o = getOrder(id),
  t = $('#modalTitle');
 if (t && dialogState?.kind === 'payment') t.textContent = 'Zahlungseingang zu ' + (o.invoice?.id || 'der Rechnung') + ' zuordnen'
};

render();
